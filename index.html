<h3>TITULO I: DENOMINACIÓN Y RÉGIMEN DE LA ASOCIACIÓN</h3>

<h4>Artículo 1º.-</h4>
<p>1.- Al amparo del artículo 22 de la Constitución Española y de la Ley Orgánica 1/2002, de 22 de marzo, reguladora del derecho de asociación y demás legislación aplicable, se constituye con sede en Lugo y con la denominación de <strong>Asociación de Vecinos Parque de Rosalía de Castro-Recatelo</strong>, Asociación que carece de ánimo de lucro.</p>

<p>Esta Asociación tiene personalidad jurídica propia y plena capacidad de obrar, pudiendo realizar todos aquellos actos que sean necesarios para el cumplimiento de la finalidad para la que fue creada, siempre con sujeción a lo dispuesto en el ordenamiento jurídico.</p>

<p>2.- El funcionamiento de la Asociación estará regulado por los presentes estatutos y los acuerdos válidamente adoptados por su Asamblea General y órganos directivos, dentro de la esfera de su respectiva competencia. En lo no previsto se estará a lo establecido en la Ley Orgánica 1/2002, de 22 de marzo, reguladora del Derecho de Asociación.</p>
<p>3. Esta asociación se constituye por tiempo indefinido y seguirá en todo momento los principios democráticos contenidos en el marco de la Constitución y el resto del ordenamiento jurídico.</p>

<h3>TITULO II. FINES Y ACTIVIDADES DE LA ASOCIACIÓN</h3>

<h4>Artículo 2º.- Fines.</h4>
<p><strong>1. <u>Son fines de esta Asociación:</u></strong></p>
<p>1º) La representación y defensa de los intereses generales y comunes de los asociados.</p>
<p>2º) Informar a los asociados y difundir entre todos ellos, todo aquello que pueda ser de interés para la asociación y sus miembros y que guarde relación con los fines y objetivos de la misma.</p>



<p>3º) Promocionar la participación activa de todos los asociados en el desarrollo de los fines de la asociación, así como en la ejecución de todas las actividades o acciones que la asociación desarrolle relacionadas con tales fines, promoviendo asimismo la mutua cooperación y colaboración entre todo ellos para alcanzar los objetivos propuestos por la asociación.</p>
<p>4º) Actuar como interlocutora ante las distintas administraciones públicas y en representación de los vecinos integrados en la asociación, para la tutela y defensa de sus intereses mutuos y generales relacionados con los fines propios de la asociación y con las actuaciones comunes que la misma lleve a cabo, así como para la realización de las acciones necesarias ante los organismos pertinentes, para el buen desarrollo y ejecución de los fines de esta asociación, así como de todos los acuerdos válidamente adoptados por ésta y según lo dispuesto en estos estatutos, y para el fomento y desarrollo de cuantas acciones y actuaciones sean precisas para alcanzar dichos fines, y cualquier otro relacionado con los mismos y que redunde en beneficio de la zona de actuación fundamental de la asociación y de toda la localidad de Lugo.</p>
<p>5º) Presentación de iniciativas-propuestas y la propuesta de firma de acuerdos o convenios con y ante las administraciones públicas y autoridades competentes, que sean acordadas por los socios, y que estén dirigidas en todo momento a la consecución de los fines de esta asociación, a la ejecución de los acuerdos adoptados por la misma para la promoción e incentivación de la mejora en la prestación y gestión de los servicios públicos en la zona y en toda la localidad, y para el fomento de la realización de todo tipo de actuaciones y acciones por parte de los servicios públicos, que redunden en beneficio de todos los vecinos y asociados.</p>
<p>6º) Promover y gestionar ante los órganos y autoridades competentes y en nombre y representación de todos los asociados, <u>la realización de todas aquellas actuaciones que</u> <u>sean precisas para la adecuada gestión, mantenimiento y mejora por parte de dichos</u> <u>organismos y autoridades competentes,</u> de forma prioritaria en la zona que abarca el ámbito de actuación de la asociación, y de forma secundaria y subsidiaria en todas las calles de la ciudad que puedan precisarlo, <u>de la situación actual de los siguientes</u> <u>servicios públicos:</u> Regulación del tráfico en general en toda la localidad, y de forma particular en la zona del ámbito de actuación de esta asociación, especialmente en cuanto al planteamiento de una redistribución de la reserva de plazas de aparcamiento para los organismo públicos establecidos en dicha zona, ya que el número de reservas es excesivo y perjudica enormemente a los vecinos de la zona, así como mejora de los viales y el asfaltado en la zona y en toda la localidad; Mejora de la situación actual de parques y jardines; Mejora del servicio de recogida de basuras y limpieza; Solución de problemas del alumbrado así como de ruidos y contaminación ambiental en la zona, especialmente durante la celebración de fiestas populares que causan numerosos problemas de habitabilidad y convivencia a los vecinos, vulnerándose a menudo la normativa local de protección frente a la contaminación acústica y ambiental; Mejora en las actuaciones de las autoridades competentes en cuanto a la prevención del vandalismo en la zona y en toda la localidad y en todas sus manifestaciones</p>



<p>7º) Incentivar la realización de acciones que favorezcan la convivencia pacífica en el vecindario, promoviendo valores de igualdad, tolerancia, respeto hacia otras creencias o forma de vida diferentes, e igualdad de trato para todos los vecinos independientemente de su condición personal o social, o su forma de pensar y vivir, respetando en todo momento los derechos individuales de cada vecino, siempre y cuando se respeten en todo momento los derechos y deberes conjuntos de toda la comunidad.</p>
<p>8º) Fomento de la realización de actividades culturales, lúdicas y recreativas de todo tipo, para mayores y niños, en épocas concretas y significativas del año, tales como Navidad, Carnavales, Samaín, Fiestas Patronales destacadas (recuperación de la Fiesta de las Dolores que ha dejado de celebrarse, y era valorada muy positivamente por la ciudadanía en general), etc…. las cuales favorecen la convivencia de todos los vecinos, además de incentivar las visitas a nuestra localidad e incentivar el turismo, lo cual redunda en beneficio de los negocios locales incentivando así nuestra economía, y beneficia asimismo a todos los vecinos.</p>
<p>Así pues, estas actividades pueden consistir en <u>mercadillos, conciertos al aire libre o</u> <u>en locales habilitados a tal fin, obras de teatro, campeonatos de ajedrez, billar,</u> <u>petanca y otros juegos populares similares, así como campeonatos de cualquier</u> <u>deporte; realización de talleres de variadas temáticas que puedan interesar a la</u> <u>ciudadanía; actuaciones de magia;cantos de taberna, monólogos de humor;teatro;</u> <u>exposiciones culturales de todo tipo; cine al aire libre; charlas sobre temas de interés;</u> <u>concursos o certámenes de fotografía; actuaciones para los más pequeños como</u> <u>títeres, cuentacuentos, ciclos de películas específicos para ellos; convocatoria de</u> <u>campeonatos de parkour, skate, y otras actividades de interés para los más jóvenes,</u> <u>que incentiven su interés por el deporte y la vida sana y al aire libre; promover la</u> <u>fundación de clubs de lectura, de escritura creativa, de senderismo, y en general, de</u> <u>cualquier actividad que fomente la convivencia pacífica, la participación activa de los</u> <u>vecinos en la comunidad, prestando especial atención a colectivos desfavorecidos e</u> <u>incentive los valores de respeto, tolerancia e igualdad de todos y para todos,</u> <u>promocionando en todo momento la cultura, la creatividad, y todas aquellas</u> <u>actividades que incentiven un estilo de vida sano y beneficioso para todos, de forma</u> <u>individual y colectiva.</u></p>
<p>9º) Fomento de actuaciones que incentiven el turismo en Lugo, presentando propuestas e iniciativas a los organismos competentes, para la realización de acciones que promocionen especialmente nuestras señas de identidad y los valores que caracterizan nuestra comunidad, poniendo en alza, difundiendo y publicitando todo aquello que nuestra ciudad puede ofrecer a los visitantes foráneos, tanto desde el punto de vista de nuestro importante patrimonio cultural y arquitectónico, como en cuanto a costumbres propias de nuestra localidad, como por ejemplo el ofrecer una “tapa” gratis con cada consumición, lo cual hacen casi todas cafeterías, bares, restaurantes y locales del ramo hostelero de nuestra ciudad, y que es algo que gusta mucho a nuestros visitantes; todo ello a fin de atraer un mayor número de turistas al</p>



<p>año, lo cual beneficia a la economía local y en consecuencia, a todos los vecinos de la localidad.</p>
<p>10º) Presentación de iniciativas y propuestas, y realización de actuaciones para la promoción preferente y primordial de nuestro importante patrimonio histórico, cultural y artístico, así como para la adecuada preservación y conservación del mismo, y la mejora en la medida de lo posible la gestión del cuidado del mismo, ya que es uno de nuestros más importantes valores y debe ser por tanto prioritario para nuestros representantes, su adecuado cuidado y conservación en las mejores condiciones, ya que ello es fundamental para toda la ciudadanía y para la promoción del turismo.</p>
<p>11º) Presentación de iniciativas y propuestas, y realización de actuaciones para el fomento de acciones por parte de los servicios públicos competentes, de acciones para la conservación y protección del Medio Ambiente –soterramiento de contenedores de recogida selectiva de basura, implantación del aparcamiento y la bicicleta eléctrica, puntos de recarga de automóviles eléctricos o pila de combustible…etc.</p>
<p>Promoviendo asimismo entre todos los vecinos, la necesaria concienciación para contribuir activamente, tanto de forma individual y colectiva, como miembros de la comunidad, en la realización de dichas acciones de protección y preservación del Medio Ambiente, fomentando una mayor involucración, y un incremento de la participación de todos los vecinos en actuaciones y medidas de protección medioambiental.</p>
<p>12º) Promover la realización de acuerdos con otras asociaciones y los negocios particulares dedicados al ocio la cultura, el deporte y el entretenimiento en nuestra ciudad, tales como cines, locales de conciertos, agencias de viaje, negocios de entretenimiento de los niños, el rokodromo, natación, la escuela de hípica etc…..para lograr ventajas o mejores condiciones para los asociados en la utilización de los servicios que ofertan estos negocios, que se ven también beneficiados de dichos acuerdos dado que la asociación aportaría un gran número de clientes a sus negocios a cambio de obtener mejoras o ventajas que les impulsen al uso de dichos servicios.</p>
<p>13º) Participar activamente con otras organizaciones, grupos y/o administraciones a través de programas de ayuda o subvención y/o redes de cooperación con el fin de conseguir el beneficio y la mejora de la asociación y de sus miembros.</p>
<p>14ª) Desarrollo de actividades, promociones y proyectos dirigidos a la sensibilización y utilización de las nuevas tecnologías, promoviendo e impulsando estas entre los socios de la Asociación y que asimismo redunden en el interés general de la ciudadanía.</p>
<p>15ª) Vigilar y exigir que las condiciones del solar abandonado(y de las casas en ruinas del mismo), con entrada por la calle Ciudad de Vivero, no supongan ningún tipo de problema para la salud vecinal y pública en general.</p>
<p>16º) Así mismo la Asociación quiere reconocer,expresamente, a los animales domésticos como “Seres Sintientes” y realizar ,para ello, actividades para su plena integración en la comunidad vecinal.</p>


<h3>TITULO III. DOMICILIO Y ÁMBITO TERRITORIAL</h3>

<h4>Artículo 3º.- Domicilio.</h4>
<p>Esta Asociación tendrá su domicilio social en el Concello de Lugo (Provincia de Lugo), y su estará situado en la Rúa Pascual Veiga, 6, 27002 Lugo.</p>
<p>En caso de cambio de domicilio social, se acordará por acuerdo de la Junta Directiva ratificado por la Asamblea General y se comunicará a los organismos pertinentes dicha modificación.</p>
<h4>Artículo 4º.- Ámbito Territorial.</h4>
<p>. El ámbito territorial de esta Asociación es local, ya que la misma desarrollará sus fines y actividades dentro de la localidad de Lugo y fundamentalmente y más concretamente en la zona del <strong>Parque de Rosalía de Castro y Recatelo,</strong> incluyendo asimismo en su ámbito principal de actuación, las siguientes calles de la zona antedicha: PASCUAL VEIGA, DOUTOR GARCÍA PORTELA, RIBADEO, VILLALBA, CARRIL DOS LOUREIROS, RECATELO Y CARRIL RECATELO, ISAAC DIAZ PARDO, ARMANDO</p>



<p>DURÁN, MOURELO, PURO CORA, CIDADE DE VIVEIRO, AVELINO POUSA ANTELO, SANTIAGO Y ZONA PUERTA DE SANTIAGO,FRAY PLÁCIDO Y VILLA DE SARRIA.</p>
<p><u>Todos los asociados podrán ser miembros de la Junta Directiva de esta asociación,; elegidos según lo descrito en los presentes estatutos en su apartado</u> <u>correspondiente,</u> <u>si bien, podrán formar parte de la asociación vecinos de otras calles</u> <u>de la ciudad de Lugo, que puedan estar interesados en participar en las actuaciones</u> <u>que desarrolla esta asociación de forma general en beneficio de todos los vecinos de la</u> <u>localidad y de toda la ciudadanía lucense, y de forma más particular y concreta, de los</u> <u>vecinos de la zona y las calles detalladas en el apartado anterior.</u></p>
<p>Pero también podrán formar parte de la misma según lo descrito en el Título siguiente, todos aquellos vecinos de Lugo que estén interesados en participar, colaborar, aportar propuestas o iniciativas que redunden en beneficio de toda la ciudadanía y a todos los vecinos de la localidad de Lugo, especialmente en lo que refiere a actuaciones dirigidas a la protección y defensa del patrimonio histórico, natural-paisajístico, cultural y arquitectónico de la localidad: Parque de Rosalía de Castro; Camino de Santiago; Casco antiguo; Río Miño y su entorno; Muralla Romana; Termas; Catedral…etc.</p>

<h3>TITULO IV. PERSONAS ASOCIADAS</h3>

<h4>Artículo 5º: Adquisición de la condición de asociado</h4>
<p>1. Para adquirir la condición de persona asociada, es necesario ser vecino de una de las calles o de la zona referida en el ámbito territorial de estos estatutos prioritariamente, o ser vecino de la localidad de Lugo de forma general pudiendo todos los socios ser elegidos como miembros de la Junta Directiva,y <u>podrán</u> <u>participar en la Asamblea General con voz y voto.</u></p>
<p>2. Las personas físicas miembros de esta asociación deben ser mayores de edad.</p>
<p>3. Las personas jurídicas para poder integrarse en esta asociación, requerirán presentar documentación acreditativa de la persona o personas que actuarán en nombre y representación de la asociación en todos los actos de la misma.</p>
<h4>Artículo 6º.- Clases de socios.</h4>



<p>Dentro de la Asociación existirán las siguientes clases de socios:</p>
<p>a) Socios fundadores, que serán aquellos que participen en el acto de constitución de la Asociación.</p>
<p>b) Socios de número, que serán los que ingresen después de la constitución de la Asociación.</p>
<p>c) Socios de honor, los que por su prestigio o por haber contribuido de modo relevante a la dignificación y desarrollo de la Asociación, se hagan acreedores a tal distinción. El nombramiento de los socios de honor corresponderá a la Junta Directiva o Asamblea General.</p>
<h4>Artículo 7. Pérdida de la condición de persona asociada</h4>
<p>1. La condición de persona asociada se perderá:</p>
<p>a) Por voluntad propia, que será efectiva mediante la presentación de renuncia, por escrito ante la junta directiva de la asociación, dirigida a la secretaría general de la asociación. La renuncia tendrá efectos desde la fecha da su presentación.</p>
<p>b) Por falta de pago de las cuotas que dan derecho a pertenecer a la asociación y al disfrute de todos sus servicios y como socio de pleno derecho de la misma. Las cuotas serán las que acuerde la asociación en la Asamblea General correspondiente y según lo dispuesto en los presentes estatutos. Esta pérdida del derecho de socio, será efectiva desde la notificación fehaciente a la persona interesada, del acuerdo de pérdida de la condición de asociado por impago de cuotas, adoptado a tales efectos por la junta directiva de la asociación. Las personas que pierdan su condición de asociados por esta causa, podrán ser rehabilitados en caso de que en un plazo de 6 meses desde su expulsión de la asociación, abonen las cuotas pendientes de pago.</p>
<p>c) Por incumplimento de los presentes estatutos o de los acuerdos válidamente adoptados por los órganos de la asociación, así como por la realización de acciones que perjudiquen gravemente los intereses de ésta o de algún miembro de la misma, siempre y cuando sea demostrable la realización de estas acciones por el asociado a fin de privarle de su condición y derechos como socio.</p>
<p>d) Por fallecimiento de la persona física o extinción de la persona jurídica. 7</p>
<p>2.- La expulsión de personas asociadas en los casos supuestos dos apartados b) y c) del párrafo anterior, será acordada por la Junta Directiva, después de celebrar audiencia con la persona interesada. El acuerdo de expulsión, deberá ser ratificado por Asamblea General extraordinaria, y contra su resolución, el interesado podrá recurrir ante la jurisdicción ordinaria.</p>
<h4>Artículo 8. Derechos de los asociados</h4>
<p>a) Participar en las actividades de la asociación</p>
<p>b) Ser electores y elegibles para los cargos de los órganos de goberno de esta</p>
<p>asociación</p>
<p>c) Participar en las Asambleas Generales de la asociación con voz y voto.</p>
<p>d) Recibir información de la composición de los órganos de representación de la asociación, del estado de cuentas y del desarrollo de sus actividades</p>
<p>e) Acceder para su consulta, a la documentación propia de la asociación a través de sus órganos de representación.</p>
<p>f) Ser oídas con carácter previo a la adopción de medidas disciplinarias contra ellos, así como a ser informados de todos los hechos que dieron lugar a dichas medidas, debiendo motivarse el acuerdo que, en seu caso, imponga dicha sanción</p>
<p>g) Impugnar los acuerdos de los dos órganos de asociación que estime contrarios a la ley o a los estatutos.</p>
<p>2. No podrán ejercer ninguno de estos derechos los asociados que no estén al día en el pago de las cuotas de la asociación.</p>
<h4>Artículo 9. Obligaciones de los asociados</h4>
<p>a) Cumplir los presentes estatutos de los acuerdos válidamente adoptados por los órganos de gobierno y representación de la asociación.</p>



<p>b) Pagar las cuotas que se establezcan.</p>
<p>c) Desempeñar en su caso, las obligaciones inherentes a los cargos que ocupan y para los que hayan sido elegidos</p>
<p>d) Asistir a las Asambleas y demás actos organizados por la asociación.</p>

<h3>TITULO V. ÓRGANOS DE GOBIERNO Y REPRESENTACIÓN</h3>
<h3>CAPÍTULO I. CLASES Y DENOMINACIÓN</h3>

<h4>Artículo 10º.- Clases y principios.</h4>
<p>1. Los órganos de gobierno y representación de la Asociación son: a) La Asamblea General</p>
<p>b) La Junta Directiva.</p>
<p>c) Secciones: por acuerdo de la Asamblea General podrán organizarse en la Asociación aquellas Secciones que se estimen convenientes para el mejor cumplimiento de los fines de la misma.</p>
<p>2. La organización interna y funcionamiento de la asociación deberá ser democrático, con pleno respeto al pluralismo.</p>

<h3>CAPÍTULO II. ASAMBLEA GENERAL</h3>

<h4>Artículo 11º.- Composición.</h4>
<p>La Asamblea General es el órgano supremo de gobierno de la Asociación y está integrada por todos los asociados.</p>
<h4>Artículo 12º.- Clases de Sesiones.</h4>
<p>Las reuniones de la Asamblea General serán ordinarias y extraordinarias.</p>
<p>- La Asamblea General Ordinaria se reunirá necesariamente al menos una vez al año, dentro de los cuatro meses siguientes al cierre del ejercicio.</p>



<p>- Las Asambleas Generales Extraordinarias se celebrarán cuando las circunstancias lo aconsejen, a juicio del Presidente, cuando la Directiva lo acuerde o cuando lo proponga por escrito una décima parte de los asociados.</p>
<h4>Artículo 13º.- Convocatoria</h4>
<p>Las convocatorias de las Asambleas Generales se realizarán por medios telemáticos, expresando el lugar, día y hora de la reunión así como el orden del día con expresión concreta de los asuntos a tratar. Entre la convocatoria y el día señalado para la celebración de la Asamblea en primera convocatoria habrán de mediar al menos quince días, pudiendo asimismo hacerse constar si procediera la fecha y hora en que se reunirá la Asamblea en segunda convocatoria, sin que entre una y otra pueda mediar un plazo inferior a una hora.</p>
<h4>Artículo 14º.- Quórum de asistencia y votaciones.</h4>
<p>Las Asambleas Generales, tanto ordinarias como extraordinarias, quedarán válidamente constituidas en primera convocatoria cuando concurran a ella un tercio de los asociados con derecho a voto, y en segunda convocatoria cualquiera que sea el número de asociados con derecho a voto. Será necesaria en todo caso la presencia del Presidente y Secretario, o de las personas que legalmente les sustituyan.</p>
<p>Los acuerdos se tomarán por mayoría simple de las personas presentes o representadas cuando los votos afirmativos superen a los negativos, no siendo computables a estos efectos los votos en blanco ni las abstenciones.</p>
<p>Será necesario mayoría cualificada de las personas presentes o representadas, que resultará cuando los votos afirmativos superen la mitad de éstas, para:</p>
<p>a) Nombramiento de las Juntas Directivas y Administradores.</p>
<p>b) Acuerdo para constituir una Federación de Asociaciones o integrarse en ellas.</p>
<p>c) Disposición o enajenación de bienes integrantes del inmovilizado. d) Modificación de estatutos.</p>
<p>e) Disolución de la entidad.</p>
<p>f) Acuerdo sobre compensación/remuneración de los miembros de los órganos de representación; si así se considerase necesario por razón y ejercicio en el cargo.</p>
<h4>Artículo 15º.- Competencias.</h4>
<p>1. Son competencia de la Asamblea General Ordinaria los asuntos siguientes: a) Aprobar, en su caso, la gestión de la Junta Directiva.</p>
<p>b) Examinar y aprobar las cuentas anuales.</p>



<p>c) Resolver sobre la aprobación del inventario anual de bienes muebles e inmuebles cuya valoración detallada de los mismos será realizada por el miembro de la Junta Directiva previamente designado por esta última.</p>
<p>d) Aprobar o rechazar las propuestas de las Juntas Directivas en orden a las actividades de la Asociación.</p>
<p>e) Acordar los gastos que hayan que atenderse con cuotas extraordinarias y su establecimiento, así como los de las cuotas ordinarias, fijar la cuantía de éstas y su periodicidad.</p>
<p>f) Cualquier otra que no sea de la competencia exclusiva de la Asamblea Extraordinaria.</p>
<p>2. Corresponde a la Asamblea General Extraordinaria:</p>
<p>a) Nombramiento y revocación de los miembros de la Junta Directiva. b) Modificación de los Estatutos.</p>
<p>c) Disolución de la Asociación y, en su caso, nombramiento de liquidadores. d) Expulsión de socios, a propuesta de la Junta Directiva.</p>
<p>e) Constitución de Federaciones o integración en ellas.</p>
<p>f) Solicitud de declaración de utilidad pública.</p>
<h4>Artículo 16º.- Obligatoriedad de los acuerdos</h4>
<p>Los acuerdos adoptados conforme a los preceptos anteriores obligarán a los socios, incluso a los no asistentes, llevándose a un libro de actas que firmará el Presidente y el Secretario General.</p>

<h3>CAPÍTULO VI. JUNTA DIRECTIVA</h3>

<h4>Artículo 17º.- Composición.</h4>
<p>La Asociación será gestionada y representada por una Junta Directiva formada por: un Presidente, un Vicepresidente, un Secretario General, un Tesorero y un vocal (en su caso).</p>

<p>Todos los cargos que componen la Junta Directiva serán <em>gratuitos (salvo que se</em></p>

<p><em>disponga otra cosa en los Estatutos y que conste en las cuentas anuales aprobadas en Asamblea. Art. 11.5 LO 1/2002)</em>. Estos serán designados y revocados por la Asamblea General Extraordinaria<sup>1</sup>.</p>
<p>Podrán causar baja:</p>
<p>- Por renuncia voluntaria comunicada por escrito a la Junta Directiva. <em>-</em> Por incumplimiento de las obligaciones que tuvieran encomendadas. <em>-</em> Por expiración del mandato.</p>
<h4>Artículo 18º. Elección de cargos.</h4>
<p>1.- Los cargos de la Junta Directiva, tendrán una duración de 1 año, pudiendo ser reelegidos sus miembros al finalizar su mandato<em>.</em></p>
<p>2.- La elección se efectuará por la Asamblea General mediante votación. Podrán Ser elegidos como miembros de la Junta Directiva todos los asociados-</p>

<p>3.- Las vacantes que pudieran producirse en la Junta, se cubrirán provisionalmente por designación de la Junta Directiva, hasta la celebración de la Asamblea General, que elegirá a los nuevos miembros o confirmará a los designados provisionalmente.</p>

<p><em>. Para ser miembros de la Junta Directiva es necesario ser mayor de edad, estar en pleno uso de los derechos civiles y no estar incurso en los motivos de incompatibilidad establecidos en la legislación vigente .</em></p>
<p><em>(Art.11.4 LO 1/2002)</em></p>
<h4>Artículo 19º.- Sesiones.</h4>



<p>La Junta Directiva celebrará sesión cuando lo determine el Presidente, por iniciativa propia o a petición de alguno de sus miembros.</p>
<p>Quedará constituida cuando asista la mitad más uno de sus miembros y para que sus acuerdos sean válidos deberán ser tomados por mayoría de votos. En caso de empate, el voto del Presidente será de calidad.</p>
<p>Cuando la Junta Directiva lo estime procedente por la índole de la materia a tratar en la sesión, podrán ser invitados a tomar parte en sus deliberaciones como asesores cualificados, pero sin voto, profesionales o especialistas para clarificar asuntos concretos que figuren en el orden del día.</p>
<p>De las sesiones levantará acta el Secretario General, con el visto bueno del Presidente y la reflejará en el libro de actas.</p>
<h4>Artículo 20º: Competencias.</h4>
<p>Las facultades de la Junta Directiva se extenderán, con carácter general a todos los actos propios de las finalidades de la asociación, siempre que no requieran, según estos Estatutos, autorización expresa de la Asamblea General.</p>
<p>Son facultades particulares de la Junta Directiva:</p>
<p>a) Dirigir las actividades sociales y llevar la gestión económica y administrativa de la Asociación, acordando realizar los oportunos contratos y actos en el periodo entre Asambleas.</p>
<p>b) Ejecutar los acuerdos de la Asamblea General.</p>
<p>c) Formular y someter a la aprobación de la Asamblea General los Balances y las Cuentas anuales.</p>
<p>d) Dar cuenta de su actividad a la Asamblea General.</p>
<p>e) Resolver sobre la admisión de nuevos asociados.</p>
<p>f) Nombrar delegados para alguna determinada actividad de la Asociación. g) Cualquier otra facultad que no sea de la exclusiva competencia de la Asamblea General de socios.</p>
<h4>Artículo 21º.- Presidente. Competencias.</h4>
<p>Son atribuciones del Presidente de la Asociación:</p>
<p>a) Ostentar la representación legal de la Asociación ante toda clase de organismos públicos o privados.</p>
<p>b) Convocar, presidir y levantar las sesiones que celebre la Asamblea General y la Junta Directiva, así como dirigir las deliberaciones de una y otra.</p>
<p>c) Ordenar los pagos por cuenta de fondos de la Asociación, previos a los acuerdos de gastos correspondientes.</p>
<p>d) Autorizar con su firma los documentos, actas y correspondencia. 13</p>
<p>e) Adoptar cualquier medida urgente que la buena marcha de la Asociación aconseje o en el desarrollo de sus actividades resulte necesaria o conveniente, sin perjuicio de dar cuenta posteriormente a la Junta Directiva.</p>
<p>f) Velar por los fines de la Asociación y su cumplimiento.</p>
<h4>Artículo 22º.- Vicepresidente. Competencias.</h4>
<p>Son facultades del Vicepresidente:</p>
<p>a) Sustituir al Presidente en caso de ausencia, enfermedad o cese. b) Las que delegue el Presidente o le atribuya la Asamblea General.</p>
<h4>Artículo 23º.- Secretario General. Competencias.</h4>
<p>El Secretario General tendrá a cargo la dirección de los trabajos puramente administrativos de la Asociación, expedirá certificaciones, llevará los libros de la asociación que sean legalmente establecidos y el fichero de asociados, y custodiará la documentación de la entidad, haciendo que se cursen a las comunicaciones sobre designación de Juntas Directivas y demás acuerdos sociales inscribibles a los Registros correspondientes, así como la presentación de las cuentas anuales y el cumplimiento de las obligaciones documentales en los términos que legalmente correspondan.</p>
<h4>Artículo 24º.- Tesorero. Competencias.</h4>
<p>Corresponde al Tesorero:</p>
<p>a) Recaudar y custodiar los fondos de la Asociación y llevar en orden los libros de Contabilidad.</p>
<p>b) Preparar los balances y presupuestos de la Asociación para su aprobación por la Asamblea General.</p>
<p>c) Dar cumplimiento a las órdenes de pago que expida el Presidente. d) Llevar inventario de bienes, si los hubiera.</p>
<h4>Artículo 25º.- Vocales. Competencia.</h4>



<p>Los vocales tendrán las obligaciones propias de su cargo como miembros de la Junta Directiva, y así como las que nazcan de las delegaciones o comisiones de trabajo que la propia Junta las encomiende.</p>

<h3>CAPÍTULO IV. RÉGIMEN ECONÓMICO Y PATRIMONIAL</h3>

<h4>Artículo 26º.- Patrimonio.</h4>
<p>La Asociación no cuenta con patrimonio fundacional o fondo social inicial.</p>
<h4>Artículo 27º.- Ingresos.</h4>
<p>Los recursos de la Asociación están constituidos por:</p>
<p>1.- Las cuotas (ordinarias o extraordinarias) de los socios.</p>
<p>2.- Los donativos o aportaciones que reciba.</p>
<p>3.- Las herencias o legados que pudiera recibir de forma legal por parte de los asociados o de terceras personas.</p>
<p>4.- Las subvenciones, ayudas y auxilios que reciba de la Administración estatal, regional, provincial o municipal, así como las que la conceden otras instituciones de carácter privado (fundaciones, otras asociaciones, etc.).</p>
<p>5.- Cualquier otro recurso lícito.</p>
<h4>Artículo 28º.- Cuotas.</h4>
<p>1.- Las cuotas ordinarias o extraordinarias se establecerán por la Asamblea General, a propuesta de la Junta Directiva, y no son reintegrables en caso alguno.</p>
<p>2.- Para la admisión de nuevos socios, podrá ser fijada por la Asamblea General, como aportación inicial, no reintegrable, una cuota de admisión.</p>
<h4>Artículo 29º.- Obligaciones documentales y contables:</h4>
<p>1. La asociación ha de disponer de una relación actualizada de sus asociados, llevar una contabilidad que permita obtener la imagen fiel del patrimonio, del resultado y de la situación financiera de la entidad, así como las actividades realizadas, efectuar</p>



<p>un inventario de sus bienes y recoger en un libro las actas de las reuniones de sus órganos de gobierno y representación. Deberán llevar su contabilidad conforme a las normas específicas que les resulten de aplicación.</p>
<p>2. Las cuentas de la asociación se aprobarán anualmente por la Asamblea General.</p>
<p>3. El ejercicio asociativo y económico será anual y su cierre tendrá lugar el 31 de diciembre de cada año.</p>

<h3>CAPÍTULO V. DISOLUCIÓN Y LIQUIDACIÓN DE LA ASOCIACIÓN.</h3>

<h4>Artículo 30º.-</h4>
<p>La asociación se disolverá:</p>
<p>a) Voluntariamente cuando así lo acuerde la Asamblea General Extraordinaria, convocada al efecto, por un número de asociados no inferior al 10%. El acuerdo sobre la disolución requerirá mayoría cualificada de las personas presentes o representadas, que resultará cuando los votos afirmativos superen la mitad. <em>(Art. 12 LO 1/2002)</em></p>
<p>b) Por las causas determinadas en el artículo 39 del Código Civil.</p>
<p>c) Por sentencia judicial firme.</p>
<h4>Artículo 31º.-</h4>
<p>En caso de disolución, se nombrará una comisión liquidadora la cual, una vez extinguidas las deudas, y si existiese sobrante líquido lo destinará para fines que no desvirtúen su naturaleza no lucrativa .</p>

<h3>CAPITULO VI. REFORMA DE LOS ESTATUTOS</h3>

<h4>Artículo 32º.- Reforma de los Estatutos.</h4>
<p>Las modificaciones de los presentes Estatutos será de competencia de la Asamblea General Extraordinaria, adoptándose el acuerdo por mayoría cualificada de las personas presentes o representadas, que resultará cuando los votos afirmativos superen la mitad de los asistentes.</p>



<p>Las modificaciones que se realicen se comunicarán al Registro correspondiente.</p>
<h3>DISPOSICIÓN ADICIONAL</h3>
<p>En todo cuanto no esté previsto en los presentes Estatutos se aplicará la vigente Ley Orgánica 1/2002, de 22 de marzo, reguladora del Derecho de Asociación, y las Disposiciones Complementarias.</p>

<h3>TÍTULO I: DENOMINACIÓN E RÉXIME DA ASOCIACIÓN</h3>

<h4>Artigo 1º.-</h4>
<p>1.- Ao abeiro do artigo 22 da Constitución española e da Lei orgánica 1/2002, do 22 de marzo, reguladora do dereito de asociación e demais lexislación aplicable, constitúese con sede en Lugo e coa denominación de <strong>Asociación de Veciños Parque de Rosalía de Castro-Recatelo</strong> unha asociación que carece de ánimo de lucro.</p>

<p>Esta asociación ten personalidade xurídica propia e plena capacidade de obrar, e pode realizar todos aqueles actos que sexan necesarios para o cumprimento da finalidade para a que foi creada, sempre con suxeición ao disposto no ordenamento xurídico.</p>

<p>2.- O funcionamento da asociación estará regulado polos presentes estatutos e polos acordos validamente adoptados pola súa Asemblea Xeral e órganos directivos, dentro da esfera da súa respectiva competencia. No non previsto, estarase ao establecido na Lei orgánica 1/2002, do 22 de marzo, reguladora do dereito de asociación.</p>
<p>3. Esta asociación constitúese por tempo indefinido e seguirá en todo momento os principios democráticos contidos no marco da Constitución e do resto do ordenamento xurídico.</p>

<h3>TÍTULO II. FINS E ACTIVIDADES DA ASOCIACIÓN</h3>

<h4>Artigo 2º.- Fins.</h4>
<p><strong>1. <u>Son fins desta asociación:</u></strong></p>
<p>1º) A representación e defensa dos intereses xerais e comúns dos asociados.</p>
<p>2º) Informar os asociados e difundir entre todos eles todo aquilo que poida ser de interese para a asociación e os seus membros e que garde relación cos fins e obxectivos dela.</p>
<p>3º) Promover a participación activa de todos os asociados no desenvolvemento dos fins da asociación, así como na execución de todas as actividades ou accións que a asociación desenvolva relacionadas con tales fins, promovendo así mesmo a mutua cooperación e colaboración entre todos eles para alcanzar os obxectivos propostos pola asociación.</p>
<p>4º) Actuar como interlocutora ante as distintas administracións públicas e en representación dos veciños integrados na asociación, para a tutela e defensa dos seus intereses mutuos e xerais relacionados cos fins propios da asociación e coas actuacións comúns que esta leve a cabo, así como para a realización das accións necesarias ante os organismos pertinentes, para o bo desenvolvemento e execución dos fins desta asociación e de todos os acordos validamente adoptados por ela segundo o disposto nestes estatutos, e para o fomento e desenvolvemento de cantas accións e actuacións sexan precisas para alcanzar os devanditos fins, e calquera outro relacionado con eles e que redunde en beneficio da zona de actuación fundamental da asociación e de toda a localidade de Lugo.</p>
<p>5º) Presentación de iniciativas-propostas e proposta de sinatura de acordos ou convenios coas administracións públicas e autoridades competentes e ante elas, que sexan acordadas polos socios e que estean dirixidas en todo momento á consecución dos fins desta asociación, á execución dos acordos adoptados por ela para a promoción e o incentivo da mellora na prestación e xestión dos servizos públicos na zona e en toda a localidade, e para o fomento da realización de todo tipo de actuacións e accións por parte dos servizos públicos que redunden en beneficio de todos os veciños e asociados.</p>
<p>6º) Promover e xestionar ante os órganos e autoridades competentes, en nome e representación de todos os asociados, <u>a realización de todas aquelas actuacións que sexan precisas para a axeitada xestión, mantemento e mellora, por parte deses organismos e autoridades competentes,</u> de forma prioritaria na zona que abrangue o ámbito de actuación da asociación, e de forma secundaria e subsidiaria en todas as rúas da cidade que o poidan precisar, <u>da situación actual dos seguintes servizos públicos:</u> regulación do tráfico en xeral en toda a localidade, e de forma particular na zona do ámbito de actuación desta asociación, especialmente no que se refire á proposta dunha redistribución da reserva de prazas de aparcamento para os organismos públicos establecidos nesa zona, xa que o número de reservas é excesivo e prexudica enormemente os veciños da zona, así como mellora dos viais e do asfaltado na zona e en toda a localidade; mellora da situación actual de parques e xardíns; mellora do servizo de recollida de lixo e limpeza; solución de problemas da iluminación pública, así como de ruídos e contaminación ambiental na zona, especialmente durante a celebración de festas populares que causan numerosos problemas de habitabilidade e convivencia aos veciños, vulnerándose a miúdo a normativa local de protección fronte á contaminación acústica e ambiental; mellora nas actuacións das autoridades competentes en canto á prevención do vandalismo na zona e en toda a localidade, en todas as súas manifestacións.</p>
<p>7º) Incentivar a realización de accións que favorezan a convivencia pacífica na veciñanza, promovendo valores de igualdade, tolerancia, respecto cara a outras crenzas ou formas de vida diferentes, e igualdade de trato para todos os veciños independentemente da súa condición persoal ou social ou da súa forma de pensar e vivir, respectando en todo momento os dereitos individuais de cada veciño, sempre e cando se respecten en todo momento os dereitos e deberes conxuntos de toda a comunidade.</p>
<p>8º) Fomento da realización de actividades culturais, lúdicas e recreativas de todo tipo, para maiores e nenos, en épocas concretas e significativas do ano, tales como Nadal, Entroido, Samaín, festas patronais destacadas (recuperación da Festa das Dores, que deixou de celebrarse e era valorada moi positivamente pola cidadanía en xeral), etc., as cales favorecen a convivencia de todos os veciños, ademais de incentivar as visitas á nosa localidade e o turismo, o que redunda en beneficio dos negocios locais, incentivando así a nosa economía, e beneficia así mesmo a todos os veciños.</p>
<p>Así pois, estas actividades poden consistir en <u>mercadiños, concertos ao aire libre ou en locais habilitados para tal fin, obras de teatro, campionatos de xadrez, billar, petanca e outros xogos populares similares, así como campionatos de calquera deporte; realización de obradoiros de variadas temáticas que poidan interesar á cidadanía; actuacións de maxia; cantos de taberna, monólogos de humor; teatro; exposicións culturais de todo tipo; cine ao aire libre; charlas sobre temas de interese; concursos ou certames de fotografía; actuacións para os máis pequenos como monicreques, contacontos, ciclos de películas específicos para eles; convocatoria de campionatos de parkour, skate e outras actividades de interese para os máis novos, que incentiven o seu interese polo deporte e a vida sa e ao aire libre; promover a fundación de clubs de lectura, de escrita creativa, de sendeirismo e, en xeral, de calquera actividade que fomente a convivencia pacífica e a participación activa dos veciños na comunidade, prestando especial atención aos colectivos desfavorecidos, e que incentive os valores de respecto, tolerancia e igualdade de todos e para todos, promovendo en todo momento a cultura, a creatividade e todas aquelas actividades que incentiven un estilo de vida san e beneficioso para todos, de forma individual e colectiva.</u></p>
<p>9º) Fomento de actuacións que incentiven o turismo en Lugo, presentando propostas e iniciativas aos organismos competentes para a realización de accións que promovan especialmente os nosos sinais de identidade e os valores que caracterizan a nosa comunidade, poñendo en valor, difundindo e publicitando todo aquilo que a nosa cidade pode ofrecer aos visitantes de fóra, tanto desde o punto de vista do noso importante patrimonio cultural e arquitectónico como no que respecta aos costumes propios da nosa localidade, como por exemplo ofrecer unha «tapa» de balde con cada consumición, cousa que fan case todas as cafetarías, bares, restaurantes e locais do ramo da hostalaría da nosa cidade, e que é algo que lles gusta moito aos nosos visitantes; todo iso co fin de atraer un maior número de turistas ao ano, o que beneficia a economía local e, en consecuencia, a todos os veciños da localidade.</p>
<p>10º) Presentación de iniciativas e propostas, e realización de actuacións para a promoción preferente e primordial do noso importante patrimonio histórico, cultural e artístico, así como para a súa axeitada preservación e conservación e a mellora, na medida do posible, da xestión do seu coidado, xa que é un dos nosos valores máis importantes e debe ser, polo tanto, prioritario para os nosos representantes o seu axeitado coidado e conservación nas mellores condicións, pois iso é fundamental para toda a cidadanía e para a promoción do turismo.</p>
<p>11º) Presentación de iniciativas e propostas, e realización de actuacións para o fomento, por parte dos servizos públicos competentes, de accións para a conservación e protección do medio ambiente: soterramento de colectores de recollida selectiva de lixo, implantación do aparcamento e da bicicleta eléctrica, puntos de recarga de automóbiles eléctricos ou de pila de combustible, etc.</p>
<p>Promovendo así mesmo entre todos os veciños a necesaria concienciación para contribuír activamente, tanto de forma individual como colectiva, como membros da comunidade, na realización desas accións de protección e preservación do medio ambiente, fomentando unha maior implicación e un incremento da participación de todos os veciños en actuacións e medidas de protección ambiental.</p>
<p>12º) Promover a realización de acordos con outras asociacións e cos negocios particulares dedicados ao lecer, á cultura, ao deporte e ao entretemento na nosa cidade, tales como cines, locais de concertos, axencias de viaxes, negocios de entretemento para os nenos, o rocódromo, a natación, a escola de hípica, etc., para lograr vantaxes ou mellores condicións para os asociados na utilización dos servizos que ofrecen estes negocios, que tamén se ven beneficiados por eses acordos, dado que a asociación achegaría un gran número de clientes aos seus negocios a cambio de obter melloras ou vantaxes que os animen ao uso deses servizos.</p>
<p>13º) Participar activamente con outras organizacións, grupos e/ou administracións a través de programas de axuda ou subvención e/ou redes de cooperación co fin de conseguir o beneficio e a mellora da asociación e dos seus membros.</p>
<p>14º) Desenvolvemento de actividades, promocións e proxectos dirixidos á sensibilización e utilización das novas tecnoloxías, promovéndoas e impulsándoas entre os socios da asociación e que así mesmo redunden no interese xeral da cidadanía.</p>
<p>15º) Vixiar e esixir que as condicións do soar abandonado (e das casas en ruínas que hai nel), con entrada pola rúa Cidade de Viveiro, non supoñan ningún tipo de problema para a saúde veciñal e pública en xeral.</p>
<p>16º) Así mesmo, a asociación quere recoñecer expresamente os animais domésticos como «seres sintentes» e realizar, para iso, actividades para a súa plena integración na comunidade veciñal.</p>


<h3>TÍTULO III. DOMICILIO E ÁMBITO TERRITORIAL</h3>

<h4>Artigo 3º.- Domicilio.</h4>
<p>Esta asociación terá o seu domicilio social no Concello de Lugo (provincia de Lugo), e estará situado na rúa Pascual Veiga, 6, 27002 Lugo.</p>
<p>En caso de cambio de domicilio social, decidirase por acordo da Xunta Directiva ratificado pola Asemblea Xeral, e comunicaráselles a modificación aos organismos pertinentes.</p>
<h4>Artigo 4º.- Ámbito territorial.</h4>
<p>O ámbito territorial desta asociación é local, xa que desenvolverá os seus fins e actividades dentro da localidade de Lugo e, fundamentalmente e máis concretamente, na zona do <strong>Parque de Rosalía de Castro e Recatelo,</strong> incluíndo así mesmo no seu ámbito principal de actuación as seguintes rúas da devandita zona: PASCUAL VEIGA, DOUTOR GARCÍA PORTELA, RIBADEO, VILALBA, CARRIL DOS LOUREIROS, RECATELO E CARRIL RECATELO, ISAAC DÍAZ PARDO, ARMANDO DURÁN, MOURELO, PURO CORA, CIDADE DE VIVEIRO, AVELINO POUSA ANTELO, SANTIAGO E ZONA DA PORTA DE SANTIAGO, FREI PLÁCIDO E VILA DE SARRIA.</p>
<p><u>Todos os asociados poderán ser membros da Xunta Directiva desta asociación, elixidos segundo o descrito nos presentes estatutos no seu apartado correspondente, se ben poderán formar parte da asociación veciños doutras rúas da cidade de Lugo que poidan estar interesados en participar nas actuacións que desenvolve esta asociación, de forma xeral en beneficio de todos os veciños da localidade e de toda a cidadanía lucense, e de forma máis particular e concreta dos veciños da zona e das rúas detalladas no apartado anterior.</u></p>
<p>Pero tamén poderán formar parte dela, segundo o descrito no título seguinte, todos aqueles veciños de Lugo que estean interesados en participar, colaborar e achegar propostas ou iniciativas que redunden en beneficio de toda a cidadanía e de todos os veciños da localidade de Lugo, especialmente no que se refire a actuacións dirixidas á protección e defensa do patrimonio histórico, natural-paisaxístico, cultural e arquitectónico da localidade: Parque de Rosalía de Castro; Camiño de Santiago; casco antigo; río Miño e o seu contorno; Muralla romana; Termas; Catedral, etc.</p>

<h3>TÍTULO IV. PERSOAS ASOCIADAS</h3>

<h4>Artigo 5º: Adquisición da condición de asociado</h4>
<p>1. Para adquirir a condición de persoa asociada é necesario ser veciño, prioritariamente, dunha das rúas ou da zona referida no ámbito territorial destes estatutos, ou ser veciño da localidade de Lugo de forma xeral. Todos os socios poderán ser elixidos membros da Xunta Directiva e <u>poderán participar na Asemblea Xeral con voz e voto.</u></p>
<p>2. As persoas físicas membros desta asociación deben ser maiores de idade.</p>
<p>3. As persoas xurídicas, para poder integrarse nesta asociación, deberán presentar documentación acreditativa da persoa ou persoas que actuarán no seu nome e representación en todos os actos da asociación.</p>
<h4>Artigo 6º.- Clases de socios.</h4>
<p>Dentro da asociación existirán as seguintes clases de socios:</p>
<p>a) Socios fundadores, que serán aqueles que participen no acto de constitución da asociación.</p>
<p>b) Socios de número, que serán os que ingresen despois da constitución da asociación.</p>
<p>c) Socios de honra, os que polo seu prestixio ou por contribuír de xeito relevante á dignificación e desenvolvemento da asociación se fagan merecedores de tal distinción. O nomeamento dos socios de honra corresponderalle á Xunta Directiva ou á Asemblea Xeral.</p>
<h4>Artigo 7. Perda da condición de persoa asociada</h4>
<p>1. A condición de persoa asociada perderase:</p>
<p>a) Por vontade propia, que será efectiva mediante a presentación da renuncia por escrito ante a Xunta Directiva da asociación, dirixida á secretaría xeral. A renuncia terá efectos desde a data da súa presentación.</p>
<p>b) Pola falta de pagamento das cotas que dan dereito a pertencer á asociación, ao goce de todos os seus servizos e á condición de socio de pleno dereito. As cotas serán as que acorde a asociación na Asemblea Xeral correspondente e segundo o disposto nos presentes estatutos. Esta perda do dereito de socio será efectiva desde a notificación fidedigna á persoa interesada do acordo de perda da condición de asociado por impagamento de cotas, adoptado para tal efecto pola Xunta Directiva. As persoas que perdan a súa condición de asociados por esta causa poderán ser rehabilitadas se, nun prazo de 6 meses desde a súa expulsión da asociación, aboan as cotas pendentes de pagamento.</p>
<p>c) Polo incumprimento dos presentes estatutos ou dos acordos validamente adoptados polos órganos da asociación, así como pola realización de accións que prexudiquen gravemente os intereses desta ou dalgún dos seus membros, sempre e cando sexa demostrable a realización destas accións polo asociado, para privalo da súa condición e dereitos como socio.</p>
<p>d) Polo falecemento da persoa física ou a extinción da persoa xurídica.</p>
<p>2.- A expulsión de persoas asociadas nos supostos dos apartados b) e c) do parágrafo anterior será acordada pola Xunta Directiva, despois de celebrar audiencia coa persoa interesada. O acordo de expulsión deberá ser ratificado pola Asemblea Xeral extraordinaria e, contra a súa resolución, a persoa interesada poderá recorrer ante a xurisdición ordinaria.</p>
<h4>Artigo 8. Dereitos dos asociados</h4>
<p>a) Participar nas actividades da asociación.</p>
<p>b) Ser electores e elixibles para os cargos dos órganos de goberno desta asociación.</p>
<p>c) Participar nas asembleas xerais da asociación con voz e voto.</p>
<p>d) Recibir información da composición dos órganos de representación da asociación, do estado de contas e do desenvolvemento das súas actividades.</p>
<p>e) Acceder, para a súa consulta, á documentación propia da asociación a través dos seus órganos de representación.</p>
<p>f) Ser oídos con carácter previo á adopción de medidas disciplinarias contra eles, así como ser informados de todos os feitos que deron lugar a esas medidas, e o acordo que, se é o caso, impoña a sanción deberá ser motivado.</p>
<p>g) Impugnar os acordos dos órganos da asociación que considere contrarios á lei ou aos estatutos.</p>
<p>2. Non poderán exercer ningún destes dereitos os asociados que non estean ao día no pagamento das cotas da asociación.</p>
<h4>Artigo 9. Obrigas dos asociados</h4>
<p>a) Cumprir os presentes estatutos e os acordos validamente adoptados polos órganos de goberno e representación da asociación.</p>
<p>b) Pagar as cotas que se establezan.</p>
<p>c) Desempeñar, se é o caso, as obrigas inherentes aos cargos que ocupen e para os que fosen elixidos.</p>
<p>d) Asistir ás asembleas e demais actos organizados pola asociación.</p>

<h3>TÍTULO V. ÓRGANOS DE GOBERNO E REPRESENTACIÓN</h3>
<h3>CAPÍTULO I. CLASES E DENOMINACIÓN</h3>

<h4>Artigo 10º.- Clases e principios.</h4>
<p>1. Os órganos de goberno e representación da asociación son: a) A Asemblea Xeral.</p>
<p>b) A Xunta Directiva.</p>
<p>c) Seccións: por acordo da Asemblea Xeral poderán organizarse na asociación aquelas seccións que se consideren convenientes para o mellor cumprimento dos seus fins.</p>
<p>2. A organización interna e o funcionamento da asociación deberán ser democráticos, con pleno respecto ao pluralismo.</p>

<h3>CAPÍTULO II. ASEMBLEA XERAL</h3>

<h4>Artigo 11º.- Composición.</h4>
<p>A Asemblea Xeral é o órgano supremo de goberno da asociación e está integrada por todos os asociados.</p>
<h4>Artigo 12º.- Clases de sesións.</h4>
<p>As reunións da Asemblea Xeral serán ordinarias e extraordinarias.</p>
<p>- A Asemblea Xeral ordinaria reunirase necesariamente polo menos unha vez ao ano, dentro dos catro meses seguintes ao peche do exercicio.</p>
<p>- As asembleas xerais extraordinarias celebraranse cando as circunstancias o aconsellen, a xuízo do presidente, cando a Directiva o acorde ou cando o propoña por escrito unha décima parte dos asociados.</p>
<h4>Artigo 13º.- Convocatoria</h4>
<p>As convocatorias das asembleas xerais realizaranse por medios telemáticos, indicando o lugar, día e hora da reunión, así como a orde do día coa expresión concreta dos asuntos que se van tratar. Entre a convocatoria e o día sinalado para a celebración da asemblea en primeira convocatoria deberán mediar polo menos quince días, e poderá facerse constar, se procede, a data e hora en que se reunirá a asemblea en segunda convocatoria, sen que entre unha e outra poida mediar un prazo inferior a unha hora.</p>
<h4>Artigo 14º.- Quórum de asistencia e votacións.</h4>
<p>As asembleas xerais, tanto ordinarias como extraordinarias, quedarán validamente constituídas en primeira convocatoria cando concorra a elas un terzo dos asociados con dereito a voto, e en segunda convocatoria calquera que sexa o número de asociados con dereito a voto. Será necesaria en todo caso a presenza do presidente e do secretario, ou das persoas que legalmente os substitúan.</p>
<p>Os acordos tomaranse por maioría simple das persoas presentes ou representadas, cando os votos afirmativos superen os negativos, sen que se computen para estes efectos os votos en branco nin as abstencións.</p>
<p>Será necesaria maioría cualificada das persoas presentes ou representadas, que resultará cando os votos afirmativos superen a metade destas, para:</p>
<p>a) Nomeamento das xuntas directivas e administradores.</p>
<p>b) Acordo para constituír unha federación de asociacións ou integrarse nelas.</p>
<p>c) Disposición ou alleamento de bens integrantes do inmobilizado. d) Modificación de estatutos.</p>
<p>e) Disolución da entidade.</p>
<p>f) Acordo sobre compensación/remuneración dos membros dos órganos de representación, se así se considerase necesario por razón e exercicio do cargo.</p>
<h4>Artigo 15º.- Competencias.</h4>
<p>1. Son competencia da Asemblea Xeral ordinaria os asuntos seguintes: a) Aprobar, se é o caso, a xestión da Xunta Directiva.</p>
<p>b) Examinar e aprobar as contas anuais.</p>
<p>c) Resolver sobre a aprobación do inventario anual de bens mobles e inmobles, cuxa valoración detallada realizará o membro da Xunta Directiva previamente designado por esta.</p>
<p>d) Aprobar ou rexeitar as propostas das xuntas directivas en relación coas actividades da asociación.</p>
<p>e) Acordar os gastos que haxa que atender con cotas extraordinarias e o seu establecemento, así como os das cotas ordinarias, e fixar a contía e a periodicidade destas.</p>
<p>f) Calquera outra que non sexa da competencia exclusiva da Asemblea extraordinaria.</p>
<p>2. Correspóndelle á Asemblea Xeral extraordinaria:</p>
<p>a) Nomeamento e revogación dos membros da Xunta Directiva. b) Modificación dos estatutos.</p>
<p>c) Disolución da asociación e, se é o caso, nomeamento de liquidadores. d) Expulsión de socios, por proposta da Xunta Directiva.</p>
<p>e) Constitución de federacións ou integración nelas.</p>
<p>f) Solicitude de declaración de utilidade pública.</p>
<h4>Artigo 16º.- Obrigatoriedade dos acordos</h4>
<p>Os acordos adoptados conforme os preceptos anteriores obrigarán os socios, incluso os non asistentes, e levaranse a un libro de actas que asinarán o presidente e o secretario xeral.</p>

<h3>CAPÍTULO III. XUNTA DIRECTIVA</h3>

<h4>Artigo 17º.- Composición.</h4>
<p>A asociación será xestionada e representada por unha Xunta Directiva formada por: un presidente, un vicepresidente, un secretario xeral, un tesoureiro e un vogal (se é o caso).</p>

<p>Todos os cargos que compoñen a Xunta Directiva serán <em>gratuítos (agás que se dispoña outra cousa nos estatutos e que conste nas contas anuais aprobadas en asemblea. Art. 11.5 LO 1/2002)</em>. Estes serán designados e revogados pola Asemblea Xeral extraordinaria.</p>
<p>Poderán causar baixa:</p>
<p>- Por renuncia voluntaria comunicada por escrito á Xunta Directiva. - Por incumprimento das obrigas que tivesen encomendadas. - Por expiración do mandato.</p>
<h4>Artigo 18º. Elección de cargos.</h4>
<p>1.- Os cargos da Xunta Directiva terán unha duración de 1 ano, e os seus membros poderán ser reelixidos ao finalizar o seu mandato.</p>
<p>2.- A elección efectuaraa a Asemblea Xeral mediante votación. Poderán ser elixidos como membros da Xunta Directiva todos os asociados.</p>

<p>3.- As vacantes que se poidan producir na Xunta cubriranse provisionalmente por designación da Xunta Directiva, ata a celebración da Asemblea Xeral, que elixirá os novos membros ou confirmará os designados provisionalmente.</p>

<p><em>Para ser membro da Xunta Directiva é necesario ser maior de idade, estar en pleno uso dos dereitos civís e non estar incurso nos motivos de incompatibilidade establecidos na lexislación vixente.</em></p>
<p><em>(Art. 11.4 LO 1/2002)</em></p>
<h4>Artigo 19º.- Sesións.</h4>
<p>A Xunta Directiva celebrará sesión cando o determine o presidente, por iniciativa propia ou por petición dalgún dos seus membros.</p>
<p>Quedará constituída cando asista a metade máis un dos seus membros e, para que os seus acordos sexan válidos, deberán ser tomados por maioría de votos. En caso de empate, o voto do presidente será de calidade.</p>
<p>Cando a Xunta Directiva o considere procedente pola índole da materia que se vai tratar na sesión, poderán ser invitados a tomar parte nas súas deliberacións, como asesores cualificados pero sen voto, profesionais ou especialistas para aclarar asuntos concretos que figuren na orde do día.</p>
<p>Das sesións levantará acta o secretario xeral, co visto e prace do presidente, e reflectiraa no libro de actas.</p>
<h4>Artigo 20º: Competencias.</h4>
<p>As facultades da Xunta Directiva estenderanse, con carácter xeral, a todos os actos propios das finalidades da asociación, sempre que non requiran, segundo estes estatutos, autorización expresa da Asemblea Xeral.</p>
<p>Son facultades particulares da Xunta Directiva:</p>
<p>a) Dirixir as actividades sociais e levar a xestión económica e administrativa da asociación, acordando realizar os oportunos contratos e actos no período entre asembleas.</p>
<p>b) Executar os acordos da Asemblea Xeral.</p>
<p>c) Formular e someter á aprobación da Asemblea Xeral os balances e as contas anuais.</p>
<p>d) Dar conta da súa actividade á Asemblea Xeral.</p>
<p>e) Resolver sobre a admisión de novos asociados.</p>
<p>f) Nomear delegados para algunha actividade determinada da asociación. g) Calquera outra facultade que non sexa da competencia exclusiva da Asemblea Xeral de socios.</p>
<h4>Artigo 21º.- Presidente. Competencias.</h4>
<p>Son atribucións do presidente da asociación:</p>
<p>a) Ostentar a representación legal da asociación ante toda clase de organismos públicos ou privados.</p>
<p>b) Convocar, presidir e levantar as sesións que celebren a Asemblea Xeral e a Xunta Directiva, así como dirixir as deliberacións dunha e doutra.</p>
<p>c) Ordenar os pagamentos por conta dos fondos da asociación, previos os acordos de gastos correspondentes.</p>
<p>d) Autorizar coa súa sinatura os documentos, actas e correspondencia.</p>
<p>e) Adoptar calquera medida urxente que a boa marcha da asociación aconselle ou que no desenvolvemento das súas actividades resulte necesaria ou conveniente, sen prexuízo de darlle conta posteriormente á Xunta Directiva.</p>
<p>f) Velar polos fins da asociación e polo seu cumprimento.</p>
<h4>Artigo 22º.- Vicepresidente. Competencias.</h4>
<p>Son facultades do vicepresidente:</p>
<p>a) Substituír o presidente en caso de ausencia, enfermidade ou cesamento. b) As que lle delegue o presidente ou lle atribúa a Asemblea Xeral.</p>
<h4>Artigo 23º.- Secretario xeral. Competencias.</h4>
<p>O secretario xeral terá ao seu cargo a dirección dos traballos puramente administrativos da asociación, expedirá certificacións, levará os libros da asociación legalmente establecidos e o ficheiro de asociados, e custodiará a documentación da entidade, facendo que se cursen as comunicacións sobre designación de xuntas directivas e demais acordos sociais inscribibles nos rexistros correspondentes, así como a presentación das contas anuais e o cumprimento das obrigas documentais nos termos que legalmente correspondan.</p>
<h4>Artigo 24º.- Tesoureiro. Competencias.</h4>
<p>Correspóndelle ao tesoureiro:</p>
<p>a) Recadar e custodiar os fondos da asociación e levar en orde os libros de contabilidade.</p>
<p>b) Preparar os balances e orzamentos da asociación para a súa aprobación pola Asemblea Xeral.</p>
<p>c) Dar cumprimento ás ordes de pagamento que expida o presidente. d) Levar o inventario de bens, se os houber.</p>
<h4>Artigo 25º.- Vogais. Competencia.</h4>
<p>Os vogais terán as obrigas propias do seu cargo como membros da Xunta Directiva, así como as que nazan das delegacións ou comisións de traballo que a propia Xunta lles encomende.</p>

<h3>CAPÍTULO IV. RÉXIME ECONÓMICO E PATRIMONIAL</h3>

<h4>Artigo 26º.- Patrimonio.</h4>
<p>A asociación non conta con patrimonio fundacional nin fondo social inicial.</p>
<h4>Artigo 27º.- Ingresos.</h4>
<p>Os recursos da asociación están constituídos por:</p>
<p>1.- As cotas (ordinarias ou extraordinarias) dos socios.</p>
<p>2.- Os donativos ou achegas que reciba.</p>
<p>3.- As herdanzas ou legados que puider recibir de forma legal por parte dos asociados ou de terceiras persoas.</p>
<p>4.- As subvencións, axudas e auxilios que reciba da Administración estatal, autonómica, provincial ou municipal, así como os que lle concedan outras institucións de carácter privado (fundacións, outras asociacións, etc.).</p>
<p>5.- Calquera outro recurso lícito.</p>
<h4>Artigo 28º.- Cotas.</h4>
<p>1.- As cotas ordinarias ou extraordinarias estableceraas a Asemblea Xeral, por proposta da Xunta Directiva, e non son reintegrables en ningún caso.</p>
<p>2.- Para a admisión de novos socios, a Asemblea Xeral poderá fixar unha cota de admisión como achega inicial non reintegrable.</p>
<h4>Artigo 29º.- Obrigas documentais e contables:</h4>
<p>1. A asociación debe dispoñer dunha relación actualizada dos seus asociados, levar unha contabilidade que permita obter a imaxe fiel do patrimonio, do resultado e da situación financeira da entidade, así como das actividades realizadas, efectuar un inventario dos seus bens e recoller nun libro as actas das reunións dos seus órganos de goberno e representación. Deberá levar a súa contabilidade conforme as normas específicas que lle resulten de aplicación.</p>
<p>2. As contas da asociación aprobaraas anualmente a Asemblea Xeral.</p>
<p>3. O exercicio asociativo e económico será anual e o seu peche terá lugar o 31 de decembro de cada ano.</p>

<h3>CAPÍTULO V. DISOLUCIÓN E LIQUIDACIÓN DA ASOCIACIÓN</h3>

<h4>Artigo 30º.-</h4>
<p>A asociación disolverase:</p>
<p>a) Voluntariamente, cando así o acorde a Asemblea Xeral extraordinaria convocada para o efecto por un número de asociados non inferior ao 10 %. O acordo sobre a disolución requirirá maioría cualificada das persoas presentes ou representadas, que resultará cando os votos afirmativos superen a metade. <em>(Art. 12 LO 1/2002)</em></p>
<p>b) Polas causas determinadas no artigo 39 do Código civil.</p>
<p>c) Por sentenza xudicial firme.</p>
<h4>Artigo 31º.-</h4>
<p>En caso de disolución, nomearase unha comisión liquidadora que, unha vez extinguidas as débedas, e se existise sobrante líquido, o destinará a fins que non desvirtúen a súa natureza non lucrativa.</p>

<h3>CAPÍTULO VI. REFORMA DOS ESTATUTOS</h3>

<h4>Artigo 32º.- Reforma dos estatutos.</h4>
<p>As modificacións dos presentes estatutos serán competencia da Asemblea Xeral extraordinaria, e o acordo adoptarase por maioría cualificada das persoas presentes ou representadas, que resultará cando os votos afirmativos superen a metade dos asistentes.</p>
<p>As modificacións que se realicen comunicaranse ao rexistro correspondente.</p>
<h3>DISPOSICIÓN ADICIONAL</h3>
<p>En todo canto non estea previsto nos presentes estatutos aplicarase a vixente Lei orgánica 1/2002, do 22 de marzo, reguladora do dereito de asociación, e as disposicións complementarias.</p>

<details class="bic-gl"><summary><strong>BIC 1. Resumo en galego</strong></summary>
<p><strong>Memoria técnica valorada: traballos de restauración e
conservación de elementos arquitectónicos no parque Rosalía de Castro
(Lugo).</strong> Páxinas 1 a 115 do documento orixinal.</p>
<h4>Que é este documento</h4>
<p>É o estudo que encargou o Servizo de Parques e Xardíns do Concello de
Lugo para restaurar e conservar os elementos históricos do parque.
Redactouno unha arquitecta en maio de 2026 e está asinado en Lugo o 8 de
maio de 2026. O dono do parque é o Concello.</p>
<p>O documento describe cada elemento, os danos que ten, por que hai que
arranxalo e como se vai facer. Serve tamén para que as administracións
que teñen que dar permisos poidan pronunciarse. Todas as obras seguen o
Plan Director do parque, redactado en 2008 polo arquitecto César
Portela.</p>
<h4>Datos do parque</h4>
<ul>
<li>Está entre a rúa Puro Cora (entrada principal), a avenida Dr. García
Portela, a rúa Pascual Veiga e a rúa Frei Plácido Rei Lemos.</li>
<li>A parcela principal mide 26.794 m². Tamén se actúa nas Costas do
Parque, cara á avenida República Arxentina.</li>
<li>É zona verde no Plan Xeral de Lugo e figura como elemento protexido
no seu catálogo (ficha L-26). Aplícase a Lei 5/2016 do patrimonio
cultural de Galicia.</li>
<li>As obras son de conservación e mantemento: non cambian o volume, o
uso nin a estrutura do parque.</li>
</ul>
<h4>A historia do parque</h4>
<ul>
<li><strong>A orixe.</strong> O Concello acordou crear o parque o 2 de
xullo de 1921, co alcalde Ángel López Pérez. Quería un lugar onde os
nenos xogasen en liberdade e os maiores descansasen, nunha cidade de
rúas estreitas e con pouco sol. A veciñanza levaba anos pedíndoo.</li>
<li><strong>O proxecto.</strong> Fíxoo o arquitecto municipal Ramiro
Sainz (memoria do 23 de novembro de 1921), coa xardinaría do enxeñeiro
agrónomo Eguileor. Concibiuno como «pulmón da cidade» e mesturou o
xardín paisaxista inglés coa xeometría dos xardíns italianos e
franceses.</li>
<li><strong>Os terreos.</strong> Escolleuse a zona do Garañón, xunto ao
barrio de Recatelo: leiras de cultivo con vistas ao val do Miño. As
primeiras obras fixéronse precisamente na parte alta, a carón de
Recatelo.</li>
<li><strong>Os nomes.</strong> A xente chamoulle axiña «Bella Vista». En
1927 recibiu o nome de Alfonso XIII e o 21 de abril de 1931 pasou a
chamarse Rosalía de Castro.</li>
<li><strong>Os elementos históricos:</strong>
<ul>
<li>A balaustrada Art Déco do Balcón do Garañón (1929-1931), de Eloy
Maquieira, feita con pezas de «pedra artificial» dos talleres Escudero
da Coruña, que chegaron en tren.</li>
<li>A pérgola (1927-1929), unha das primeiras obras de España en
formigón armado, con azulexo azul cobalto e a glicinia que florece cada
primavera. Restaurouse a fondo en 2007.</li>
<li>O estanque (1926), con dous vasos unidos por unha ponte de estilo
Art Déco e as casiñas dos patos.</li>
<li>A entrada principal da praza de Avilés (1923-1927).</li>
<li>O quiosco da música (1928), de Eloy Maquieira.</li>
<li>O mapa da Península Ibérica (1929), con luces nas capitais e
pequenos surtidores nos ríos.</li>
<li>O monumento ao alcalde Ángel López Pérez (1958), do escultor
Francisco Asorey, co pedestal de Manuel Mallo.</li>
<li>A Fonte Xacobea (1954), de Manuel Mallo e do arquitecto Ruperto
Sánchez.</li>
<li>Os bancos (1923), cos pés de ferro feitos en Vigo.</li>
</ul></li>
<li><strong>As Costas do Parque.</strong> O Concello comprou en 1922 a
Leira da Viña, de 26.850 m². En 1930 fixo os planos da parte baixa
Cecilio Rodríguez, xardineiro xefe de Madrid e ligado ao Retiro. A zona
axardinouse en 1972 e remodelouse en 1989.</li>
<li>Segundo o Plan Director de 2008, a balaustrada, a pérgola, o
estanque, o quiosco, o mapa e o monumento son «intocables»: só se poden
restaurar.</li>
</ul>
<h4>Os danos que ten hoxe</h4>
<p>O parque restaurouse entre 2007 e 2011 e está en xeral en bo estado.
Pero pasaron uns quince anos e fai falta revisar e renovar os acabados.
Os danos máis comúns son:</p>
<ul>
<li><strong>A auga, a causa principal:</strong> humidade que sobe da
terra, filtracións desde o terreo que sosteñen os muros, auga de chuvia
mal recollida e as xeadas, que rompen o revestimento.</li>
<li><strong>Gretas e fisuras</strong> en muros e molduras, por onde
entra máis auga e medran plantas.</li>
<li><strong>Desprendementos</strong> do revestimento, que deixan á vista
o ladrillo.</li>
<li><strong>Vandalismo:</strong> pintadas, golpes e danos nas zonas ao
alcance da man.</li>
<li><strong>Musgo e vexetación</strong> en cornixas e gretas, e
<strong>óxido</strong> nas partes metálicas.</li>
<li>No estanque hai perdas de auga, e na casa grande das aves apareceu
unha greta pola auga filtrada e polas raíces dunha árbore próxima.</li>
</ul>
<h4>Como se vai traballar</h4>
<ul>
<li>Atacar primeiro as causas, sobre todo a auga.</li>
<li>Mínima intervención: tocar só o que está danado, salvo a limpeza e a
pintura xeral.</li>
<li>Materiais compatibles cos orixinais: morteiros de cal nas fábricas
históricas e pinturas minerais que deixan respirar a parede.</li>
<li>Respectar as cores, texturas e acabados orixinais.</li>
<li>Limpar con cepillos suaves e auga pulverizada, sen chorros a
presión.</li>
</ul>
<h4>As 13 actuacións</h4>
<ol type="1">
<li><strong>Muro de contención de García Portela e Frei Plácido Rei
Lemos.</strong> Limpeza de todo o muro, retirada de pintadas, reparación
de gretas e do revestimento, pintura mineral e mellora da saída da auga
de chuvia para que non escorra pola parede. Farase por tramos e con
valado.</li>
<li><strong>Balaustrada e columnas do Balcón do Garañón.</strong> O
mesmo tratamento que o muro, e ademais protexer os ferros que unen as
pezas. Calcúlase que hai que reparar arredor dun 40 %.</li>
<li><strong>Pérgola.</strong> Non ten problemas de estrutura. Hai que
limpala, quitarlle a vexetación e pintala, protexendo a glicinia con
poda suave e mantas, coa supervisión dun especialista en árbores.
Repoñeranse as baldosas rotas.</li>
<li><strong>Estanque.</strong> Baleiralo e limpalo, renovar a
impermeabilización do vaso e dos bordos, vixiar e reparar a greta da
casa das aves, pintar as varandas e a ponte e protexer os pozos do
saneamento contra as raíces.</li>
<li><strong>Entrada principal.</strong> Limpeza das floreiras e dos
elementos decorativos, reparación de fisuras e pintura.</li>
<li><strong>Entradas secundarias</strong> (Pascual Veiga, Puro Cora e
García Portela). Quitar o óxido dos arcos metálicos das trepadeiras,
reparalos e pintalos de branco, e lavar e pintar as bases.</li>
<li><strong>Bordos dos xardíns.</strong> Limpar e pintar todos, e
refacer só os tramos rotos (arredor dun 10 %).</li>
<li><strong>Quiosco da música.</strong> Limpar e pintar a fachada e o
ferro, protexer a madeira, arranxar a parte baixa das portas e repoñer o
tramo de varanda que falta.</li>
<li><strong>Monumento ao alcalde Ángel López Pérez.</strong> A escultura
está ben. Limpeza do vaso da fonte, que ten musgo, e renovación das
xuntas e da impermeabilización.</li>
<li><strong>Fonte Xacobea.</strong> Limpeza das manchas escuras do vaso
e reparación das xuntas.</li>
<li><strong>Mapa da Península Ibérica.</strong> Limpeza e pintura da
madeira da cuberta, da reixa oxidada e dos piares, e retirada de

const SIN_TILDES = t => String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
function resultadosBusqueda(q){
  const palabras = SIN_TILDES(q).split(/\s+/).filter(w=>w.length>1);
  if(!palabras.length) return "";
  const nombreSec = sec => sec==="avisos" ? ["inicio","Avisos"] : (TABS.find(t=>t.id===sec) ? [sec, TABS.find(t=>t.id===sec).label] : [sec==="quejas"?"proyectos":"inicio", sec==="quejas"?"Proyectos":"Avisos"]);
  const casa = txt => { const t=SIN_TILDES(txt); return palabras.every(w=>t.includes(w)); };
  const trozo = txt => { const t=String(txt||""); if(t.length<=220) return t; const k=SIN_TILDES(t).indexOf(palabras[0]); const a=Math.max(0,k-80); return (a?"…":"")+t.slice(a,a+220)+"…"; };
  const out=[];
  for(const it of S.items){
    if(!it.section || it.section==="_borrado") continue;
    const txt=[it.title,it.body,it.docName,it.entity,it.place,it.time,it.cuando,it.album].filter(Boolean).join(" · ");

    const [tab,label]=nombreSec(it.section);
    out.push({at:it.date||"", html:`<article class="card"><div class="meta"><span class="pill p-blue">${esc(label)}</span>${it.date?`<span>${fmtDate(it.date)}</span>`:""}</div><h3>${esc(it.title||"")}</h3>${it.body?`<p class="body">${esc(trozo(B(it)))}</p>`:""}${attach(it)}<div class="row-actions"><button type="button" class="btn ghost small" data-go="${tab}">Ver en ${esc(label)}</button></div></article>`});
  }
  for(const d of S.mercAll) for(const a of (d.anuncios||[])){
    if(!casa([a.tipo,a.titulo,a.texto,a.precio].join(" · "))) continue;
    out.push({at:(a.at||"").slice(0,10), html:`<article class="card"><div class="meta"><span class="pill p-green">Mercadiño · ${esc(a.tipo)}</span>${a.precio?`<span><strong>${esc(a.precio)}</strong></span>`:""}</div><h3>${esc(a.titulo)}</h3>${a.texto?`<p class="body">${esc(trozo(a.texto))}</p>`:""}<div class="row-actions"><button type="button" class="btn ghost small" data-go="mercadillo">Ver en el Mercadiño</button></div></article>`});
  }
  out.sort((x,y)=>(y.at||"").localeCompare(x.at||""));
  return out.length ? `<p class="meta">${out.length===1?"1 resultado":out.length+" resultados"}</p>`+out.slice(0,60).map(r=>r.html).join("") : `<div class="empty"><strong>No hemos encontrado nada con «${esc(q)}».</strong>Prueba con otra palabra.</div>`;
}

  const l=S.lectAll.filter(d=>d.vistos&&d.vistos[id]).map(d=>({uid:d.uid, ...d.vistos[id]})).sort((a,b)=>(b.ultima||"").localeCompare(a.ultima||""));
  if(!l.length) return `<p class="meta">👁 Ningún socio lo ha abierto todavía (solo lo ve la directiva)</p>`;
  return `<details class="lectores"><summary class="meta">👁 Lo han abierto ${l.length} ${l.length===1?"socio":"socios"} (solo lo ve la directiva)</summary><ul>${l.map(x=>`<li>${esc(nombreDe(x.uid))} · ${x.ultima?new Date(x.ultima).toLocaleDateString("es-ES",{day:"numeric",month:"short"}):""}${x.veces>1?" · "+x.veces+" veces":""}</li>`).join("")}</ul></details>`;
}
async function registrarLectura(id){

/* Quita las franjas negras (o casi negras) de los bordes de una foto. Devuelve null si no hay nada que quitar. */
async function sinBordes(blob){
  if(!blob || !/^image\/(jpe?g|png|webp|heic|heif)/i.test(blob.type||"image/jpeg")) return null;
  let bm; try{ bm = await createImageBitmap(blob, {imageOrientation:"from-image"}); }catch(_){ try{ bm = await createImageBitmap(blob); }catch(__){ return null; } }
  const W=bm.width, H=bm.height, k=Math.min(1, 400/Math.max(W,H)), w=Math.max(1,Math.round(W*k)), h=Math.max(1,Math.round(H*k));
  const c=document.createElement("canvas"); c.width=w; c.height=h; const x=c.getContext("2d",{willReadFrequently:true}); x.drawImage(bm,0,0,w,h);
  let px; try{ px=x.getImageData(0,0,w,h).data; }catch(_){ return null; }
  const osc=(i)=>{ const l=0.3*px[i]+0.59*px[i+1]+0.11*px[i+2]; return l<40; };
  const fila=y=>{ let n=0; for(let i=0;i<w;i++) if(osc((y*w+i)*4)) n++; return n/w>0.96; };
  const col=xx=>{ let n=0; for(let j=0;j<h;j++) if(osc((j*w+xx)*4)) n++; return n/h>0.96; };
  let t=0,b=h-1,l=0,r=w-1;
  while(t<b && fila(t)) t++; while(b>t && fila(b)) b--; while(l<r && col(l)) l++; while(r>l && col(r)) r--;
  const m=1; t=Math.min(h-1,t+(t?m:0)); b=Math.max(0,b-(b<h-1?m:0)); l=Math.min(w-1,l+(l?m:0)); r=Math.max(0,r-(r<w-1?m:0));
  const cw=r-l+1, ch=b-t+1;
  if(cw*ch > w*h*0.97 || cw<w*0.2 || ch<h*0.2) return null;
  const sx=Math.round(l/k), sy=Math.round(t/k), sw=Math.min(W-sx,Math.round(cw/k)), sh=Math.min(H-sy,Math.round(ch/k));
  const o=document.createElement("canvas"); o.width=sw; o.height=sh; o.getContext("2d").drawImage(bm,sx,sy,sw,sh,0,0,sw,sh);
  const out = await new Promise(res=>o.toBlob(res,"image/jpeg",0.9)); bm.close&&bm.close();
  if(!out) return null;
  return new File([out], ((blob.name||"foto").replace(/\.[^.]+$/,""))+".jpg", {type:"image/jpeg"});
}
async function prepararFoto(fl){ try{ return (await sinBordes(fl)) || fl; }catch(_){ return fl; } }
async function recortarFotos(ids, btn){
  const its=ids.map(id=>S.items.find(i=>i.id===id)).filter(i=>i&&i.photo&&!/pdf/i.test(i.photoType||""));
  let hechas=0, sin=0, fallos=0, txt=btn?btn.textContent:"";
  for(const it of its){
    if(btn){ btn.disabled=true; btn.textContent=`Revisando ${hechas+sin+fallos+1} de ${its.length}…`; }
    try{
      const r = await fetch(imgSrc(it.photo)); if(!r.ok) throw 0;
      const bl = await r.blob(); const nueva = await sinBordes(new File([bl],"foto",{type:bl.type||"image/jpeg"}));
      if(!nueva){ sin++; continue; }
      const up = await S.assets.upload(nueva);
      const {id, ...resto} = it;

      hechas++;

  }
  if(btn){ btn.disabled=false; btn.textContent=txt; }
  alert(its.length ? `Listo: ${hechas} foto${hechas===1?"":"s"} recortada${hechas===1?"":"s"}${sin?`, ${sin} sin bordes negros`:""}${fallos?`, ${fallos} no se ${fallos===1?"ha":"han"} podido arreglar`:""}.` : "No hay fotos que revisar.");
}
/* Pixelar caras (solo directiva): detecta las caras en el móvil y las tapa con cuadros. */
const FACE_CDN = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/";
let caraApiP = null;
function cargarCaras(){
  return caraApiP || (caraApiP = (async()=>{
    const fa = await import(window.FACE_JS || FACE_CDN+"dist/face-api.esm.js");
    await fa.nets.ssdMobilenetv1.loadFromUri(window.FACE_MODELS || FACE_CDN+"model/");
    return fa;
  })().catch(e=>{ caraApiP=null; throw e; }));
}
function zonasCaras(dets){ return dets.map(d=>{ const b=d.box; return {x:b.x-b.width*0.25, y:b.y-b.height*0.45, w:b.width*1.5, h:b.height*1.7}; }); }
function pixelarZona(c, r){
  const x0=Math.max(0,Math.round(r.x)), y0=Math.max(0,Math.round(r.y));
  const ww=Math.min(c.width-x0,Math.round(r.w+Math.min(0,r.x))), hh=Math.min(c.height-y0,Math.round(r.h+Math.min(0,r.y)));
  if(ww<2||hh<2) return;
  const t=Math.max(4,Math.round(Math.max(ww,hh)/10)), sw=Math.max(1,Math.round(ww/t)), shh=Math.max(1,Math.round(hh/t));
  const m=document.createElement("canvas"); m.width=sw; m.height=shh;
  m.getContext("2d").drawImage(c,x0,y0,ww,hh,0,0,sw,shh);
  const x=c.getContext("2d"); x.imageSmoothingEnabled=false; x.drawImage(m,0,0,sw,shh,x0,y0,ww,hh); x.imageSmoothingEnabled=true;
}
async function pixelarCaras(blob){
  const fa = await cargarCaras();
  const img = await createImageBitmap(blob);
  const c = document.createElement("canvas"); c.width=img.width; c.height=img.height;
  const x = c.getContext("2d"); x.drawImage(img,0,0);
  const dets = await fa.detectAllFaces(c, new fa.SsdMobilenetv1Options({minConfidence:0.3, maxResults:100}));
  if(!dets.length) return null;
  for(const r of zonasCaras(dets)) pixelarZona(c, r);
  const out = await new Promise(r=>c.toBlob(r,"image/jpeg",0.9));
  return { file:new File([out],"foto.jpg",{type:"image/jpeg"}), caras:dets.length };
}

  const c=$("#px-c"), err=t=>{ const e=$("#px-err"); e.textContent=t; e.hidden=!t; };
  let hist=[], ini=null, base=null;

    const img=await createImageBitmap(await r.blob());
