  c.addEventListener("pointerdown",e=>{ ini=pos(e); base=c.getContext("2d").getImageData(0,0,c.width,c.height); c.setPointerCapture(e.pointerId); });
  c.addEventListener("pointermove",e=>{ if(!ini) return; const p=pos(e), x=c.getContext("2d"); x.putImageData(base,0,0); x.strokeStyle="#ff3b30"; x.lineWidth=Math.max(3,c.width/250); x.strokeRect(ini.x,ini.y,p.x-ini.x,p.y-ini.y); });
  c.addEventListener("pointerup",e=>{ if(!ini) return; const p=pos(e), x=c.getContext("2d"); x.putImageData(base,0,0);
    const r={x:Math.min(ini.x,p.x), y:Math.min(ini.y,p.y), w:Math.abs(p.x-ini.x), h:Math.abs(p.y-ini.y)}; ini=null;
    if(r.w<8||r.h<8) return; hist.push(base); pixelarZona(c,r); cambiar(); });
  $("#px-undo").onclick=()=>{ const d=hist.pop(); if(d) c.getContext("2d").putImageData(d,0,0); cambiar(); };
  $("#px-cancel").onclick=closeSheet;
  $("#px-auto").onclick=async ev=>{ const b=ev.currentTarget, t=b.textContent; b.disabled=true; b.textContent="Buscando…"; err("");
    try{ const fa=await cargarCaras(); const dets=await fa.detectAllFaces(c, new fa.SsdMobilenetv1Options({minConfidence:0.3, maxResults:100}));
      if(!dets.length) err("No se ha encontrado ninguna cara. Puedes taparlas a mano arrastrando el dedo.");
      else { guarda(); for(const r of zonasCaras(dets)) pixelarZona(c,r); cambiar(); }
    }catch(_){ err("No se ha podido cargar el detector de caras. Comprueba la conexión."); }
    b.disabled=false; b.textContent=t; };
  $("#px-save").onclick=async ev=>{ const b=ev.currentTarget; b.disabled=true; b.textContent="Guardando…"; err("");
    try{
      const bl=await new Promise(r=>c.toBlob(r,"image/jpeg",0.9));
      const up=await S.assets.upload(new File([bl],"foto.jpg",{type:"image/jpeg"}));
      const {id:_i, ...resto}=it, vieja=it.photo;
      await S.db.collection("items").doc(it.id).set({...resto, photo:up.id, photoType:"image/jpeg", updatedAt:new Date().toISOString()});
      try{ await S.assets.delete(vieja); }catch(_){}
      closeSheet();
    }catch(x){ b.disabled=false; b.textContent="Guardar"; err("No se ha podido guardar. Vuelve a intentarlo."+((x&&(x.message||x.code))?" (Detalle: "+String(x.message||x.code).slice(0,120)+")":"")); }
  };
}
async function pixelarFotos(ids, btn){
  const its=ids.map(id=>S.items.find(i=>i.id===id)).filter(i=>i&&i.photo&&!/pdf/i.test(i.photoType||""));
  if(!its.length) return alert("No hay fotos que revisar.");
  if(!confirm(`Se buscarán las caras en ${its.length===1?"esta foto":"las "+its.length+" fotos"} y se pixelarán todas las que se encuentren. La foto original se borra y no se puede recuperar. ¿Seguimos?`)) return;
  let hechas=0, caras=0, sin=0, fallos=0; const txt=btn?btn.textContent:"";
  if(btn){ btn.disabled=true; btn.textContent="Preparando…"; }
  try{ await cargarCaras(); }catch(_){ if(btn){ btn.disabled=false; btn.textContent=txt; } return alert("No se ha podido cargar el detector de caras. Comprueba la conexión y vuelve a probar."); }
  for(const it of its){
    if(btn) btn.textContent=`Revisando ${hechas+sin+fallos+1} de ${its.length}…`;
    try{
      const r = await fetch(imgSrc(it.photo)); if(!r.ok) throw 0;
      const res = await pixelarCaras(await r.blob());
      if(!res){ sin++; continue; }
      const up = await S.assets.upload(res.file);

        <span class="eyebrow">Parque de Rosalía de Castro · Recatelo · Lugo</span>
        <h2>Entre todos, por nuestro barrio</h2>
        <p>Vivimos en uno de los rincones con más carácter de Lugo. Recatelo y el Parque de Rosalía de Castro están en pleno centro, a los pies de la Muralla, y el parque es el gran pulmón verde de la ciudad, con su mirador sobre el valle del Miño.</p>
        <p>El parque es nuestro gran tesoro. Nació hace un siglo, en 1921, y lleva el nombre de Rosalía de Castro desde 1931. Es un jardín histórico y un auténtico jardín botánico, con árboles centenarios, rincones de flores, el estanque, la pérgola, el templete de la música y un sinfín de aves que viven en él. Aquí hemos crecido varias generaciones de lucenses, y por eso la asociación lucha por cuidarlo y por que se declare Bien de Interés Cultural. Te lo contamos todo en la pestaña <a href="#bic" data-go="bic">Parque Rosalía BIC</a>.</p>
        <p>Pocos barrios pueden presumir de lo que tenemos alrededor: cuatro patrimonios. La Muralla romana y el Camino Primitivo, los dos Patrimonio de la Humanidad; la Catedral, en ese mismo Camino; y el río Miño, dentro de la Reserva de la Biosfera Terras do Miño.</p>
        <p>Recatelo fue durante generaciones un barrio de paso y de hospedaje. Por aquí entraba en la ciudad quien venía del Puente Romano, y las diligencias de Friol y Portomarín paraban en la Porta de Santiago. Los días de feria, la gente de las aldeas llegaba con sus carros de leña y paja, y se gastaba lo ganado en comida y vino: Recatelo tenía fama de servir el mejor vino de Lugo.</p>
        <p>Casas de comidas como Casa do Bataneiro, El Frade, El Manco o El Rivas hicieron famoso el barrio. A su alrededor trabajaban serrerías, almacenes de bebidas como Casa Mourelle, talleres de bicicletas y tiendas de toda la vida. Ese espíritu emprendedor sigue vivo en la hostelería que hoy llena de vida nuestras calles.</p>
        <p>Por eso creemos que la zona tiene unas posibilidades inmensas, para vivir, para pasear y para recibir a quien nos visita. La asociación nació entre muchos vecinos para cuidarla y sacarla adelante. Nos sentamos con el Concello, con la Xunta de Galicia, con la Diputación Provincial de Lugo, con los grupos políticos, con la Subdelegación del Gobierno y con las fuerzas y cuerpos de seguridad de la ciudad, como la Policía Nacional, la Local y la Autonómica. Toda institución que se interese por el barrio es bienvenida, siempre que no lo use para sus fines políticos.</p>
        <p>En septiembre de 2023 recuperamos las antiguas fiestas del barrio en el Templete del Parque, y desde entonces las Festas de Recatelo son nuestra excusa para saludarnos y charlar entre vecinos. Y a lo largo del año echamos una mano a la Protectora de Animales, Asociación Capaces, Michos y la Asociación Española Contra el Cáncer.</p>
        ${S.uid && !S.canEdit && !(S.consent&&S.consent.acepta) ? `<div class="notice">Antes de empezar, revisa y acepta la <a href="#privacidad" data-go="privacidad">protección de datos</a>.</div>` : ""}
        ${S.uid && !S.canEdit && !S.ficha ? `<div class="notice">¿Eres socio/a? <a href="#misdatos" data-go="misdatos">Déjanos tus datos y tu prioridad para el barrio</a>.</div>` : ""}
        <p>Esta app es de todos los socios: aquí encontrarás los avisos, los cursos, el Mercadiño, las reuniones, las sugerencias y las fotos de lo que vamos haciendo. Y como siempre, quedamos a vuestra disposición para cualquier sugerencia, duda o apunte.</p>
        <p class="firma">Junta Directiva</p></section>

      <section class="cuota"><span>Cuota de socio</span><div class="big">35 € <span>al año</span></div><p>Con tu cuota sostienes las actividades, las Festas de Recatelo y el apoyo a los colectivos que apadrinamos.</p><p><strong>Cómo pagar:</strong> transferencia o ingreso en Caixa Rural Galega. Titular exacto de la cuenta: <strong>ASOC DE VECINOS PARQUE DE ROSALIA DE CASTRO-RECA</strong>. IBAN: <span class="iban" id="iban">ES15 3070 0001 2563 4625 3229</span>. Concepto: tu nombre y DNI.</p><p><strong>Cuándo:</strong> el pago se hace en la primera quincena de enero de cada año.</p><div><button class="btn" style="background:var(--surface);color:var(--green)" id="copy-iban" type="button">Copiar IBAN</button> <span id="copy-msg"></span></div></section>

  bic(){

    return `<div><h2>Parque Rosalía BIC</h2><p class="lead">El Parque de Rosalía de Castro es mucho más que un parque. Es un jardín histórico con cien años de vida y un auténtico jardín botánico en el corazón de Lugo: árboles centenarios de muchas especies, flores que cambian con cada estación y una fauna propia que vive en él todo el año, sobre todo aves, que anidan en sus copas y llenan el parque de cantos.</p><p class="lead">Nació en 1921, cuando el Concello decidió crear un gran parque para que los niños jugasen al aire libre y los mayores tuviesen dónde pasear y descansar. La gente enseguida lo llamó «Bella Vista» por su mirador sobre el valle del Miño. En 1927 recibió el nombre de Alfonso XIII y desde el 21 de abril de 1931 lleva el de Rosalía de Castro.</p><p class="lead">Desde entonces, varias generaciones de lucenses han jugado, paseado y se han enamorado bajo sus árboles, y muchas familias guardan aquí sus mejores recuerdos. Ese cariño es lo que nos mueve: queremos que nuestros hijos y nietos lo reciban tal y como lo conocimos.</p><p class="lead">El parque y Recatelo nacieron juntos: las primeras obras se hicieron en las tierras junto al barrio. Por eso nuestra asociación lleva los dos nombres y defiende la zona como un todo.</p><p class="lead">Hoy el parque sufre mucho. El botellón deja basura, cristales y destrozos cada fin de semana, y el vandalismo daña sus bancos, sus fuentes y sus elementos históricos. Las grandes fiestas que se celebran dentro, como el Arde Lucus o el San Froilán, llenan el parque de miles de personas, escenarios y puestos que pisotean el césped, aprietan la tierra sobre las raíces de los árboles y castigan sus muros, sus caminos y sus estructuras. Todo ello ante la pasividad de las instituciones.</p><p class="lead">Por eso insistimos ante el Concello y la Xunta en que lo protejan de verdad, empezando por declararlo Bien de Interés Cultural (BIC), la máxima protección que reconoce la Ley 5/2016 del patrimonio cultural de Galicia.</p></div>
      ${apoyoBIC()}
      <section class="card legal"><p>Un BIC no se puede alterar sin control de Patrimonio: protege su trazado, sus árboles centenarios, su fauna, sus elementos históricos y su entorno, junto a la Muralla romana. Es la garantía de que el gran pulmón verde de Lugo llegue intacto a las próximas generaciones.</p><p>Aquí reunimos la auditoría del parque y los documentos que lo justifican.</p></section>
      <section class="card legal"><h3>Por qué el parque merece ser BIC</h3><p><strong>Un jardín botánico vivo.</strong> Sus árboles, muchos plantados hace cien años, son hoy un patrimonio vivo: dan sombra, limpian el aire de la ciudad y dan refugio a su fauna, en especial a las aves. El Plan Director del parque (2008), elaborado con un botánico, pide conservar sus valores históricos, ambientales, paisajísticos y botánicos.</p><p><strong>Un jardín centenario.</strong> Nació por acuerdo del Ayuntamiento el 2 de julio de 1921 y en 2021 cumplió cien años. Es uno de los jardines públicos históricos de Lugo que siguen en pie.</p><p><strong>Un jardín histórico de autor.</strong> Lo proyectó en 1921 el arquitecto municipal Ramiro Sainz, con la jardinería del ingeniero agrónomo Eguileor. Une el trazado natural del jardín paisajista inglés con la geometría de los jardines italianos y franceses. La Ley 5/2016 reconoce expresamente el «jardín histórico» como una de las categorías de BIC.</p><p><strong>Su arquitectura de los años 20 y 30.</strong> Conserva piezas de aquella época: la entrada de la Plaza de Avilés (1923-1927), el estanque con su puente y la casita de los patos, la pérgola (1927-1929), el quiosco de la música (1928), el mapa de la Península Ibérica (1929) y la balaustrada Art Decó del Balcón do Garañón de Eloy Maquieira (1929-1931).</p><p><strong>Un balcón sobre el Miño, junto a la Muralla.</strong> Está al lado de la Muralla romana, Patrimonio de la Humanidad, y se asoma al valle del Miño. Parque, Muralla y río forman un mismo paisaje que hay que proteger entero.</p><p><strong>La memoria de la ciudad.</strong> Se creó como «pulmón de la ciudad», lleva casi un siglo con el nombre de nuestra gran poeta, Rosalía de Castro, y generaciones de lucenses han crecido en él.</p><p><strong>La protección actual no basta.</strong> Hoy solo figura como elemento protegido en el catálogo del plan urbanístico de Lugo (ficha L-26). Como BIC, cualquier obra necesitaría el visto bueno de Patrimonio de la Xunta y no dependería solo de cada gobierno municipal.</p></section>

  encuestas(){
    const list=sortDesc(bySection("encuestas"));
    return `<div><h2>Encuestas</h2><p class="lead">La directiva pregunta y los socios votan. Cada socio tiene un voto por encuesta y los resultados se muestran sin nombres.</p></div>
      <section class="stack">${list.length?list.map(encuestaCard).join(""):emptyBox("No hay encuestas abiertas.","Pulsa “+ Añadir encuesta” y escribe la pregunta y las opciones.")}</section>`;
  },
  incidencias(){
    let list=[]; for(const d of S.incAll) for(const a of (d.avisos||[])) list.push({...a, uid:d.uid});
    list.sort((a,b)=>(b.at||"").localeCompare(a.at||""));
    const form = S.uid ? `<form class="card" id="inc-form" novalidate><h3>Avisar de un problema en el barrio</h3>
      ${field("inc-tipo","Qué pasa",sel("inc-tipo",ITIPOS,ITIPOS[0]))}
      ${field("inc-texto","Explícalo en pocas palabras",`<textarea id="inc-texto" maxlength="400" style="min-height:80px" placeholder="Por ejemplo: la farola delante del portal 12 lleva una semana apagada"></textarea>`)}
      ${field("inc-foto","Foto (opcional)",`<input id="inc-foto" type="file" accept="image/*">`)}
      <div class="row-actions" style="justify-content:flex-start"><button type="button" class="btn ghost small" id="inc-gps">📍 Usar mi ubicación</button><span class="meta" id="inc-pos">${S.incPos?"Ubicación marcada en el mapa.":"O toca en el mapa el sitio exacto."}</span></div>
      <p class="err" id="inc-err" hidden></p>
      <div class="row-actions"><button class="btn" id="inc-save">Enviar aviso</button></div></form>` : `<div class="notice">Abre la app con tu cuenta para avisar de un problema.</div>`;
    const card=a=>{ const st=IESTADOS[a.estado]||IESTADOS.pendiente;
      return `<article class="card inc"><div class="meta"><span class="pill ${st[1]}">${st[0]}</span><span class="pill p-blue">${esc(a.tipo)}</span><span>${a.at?new Date(a.at).toLocaleDateString("es-ES",{day:"numeric",month:"long",year:"numeric"}):""}</span></div>
        ${a.texto?`<p class="body">${esc(a.texto)}</p>`:""}${a.foto?`<img src="${imgSrc(a.foto)}" alt="" loading="lazy" onerror="this.remove()">`:""}
        <div class="row-actions">${a.lat!=null?`<button type="button" class="btn ghost small" data-inc-ver="${esc(a.id)}">Ver en el mapa</button>`:""}
        ${S.canEdit?sel("inc-est-"+a.id,Object.entries(IESTADOS).map(([k,x])=>[k,x[0]]),a.estado||"pendiente").replace("<select ",`<select data-inc-est="${esc(a.uid)}|${esc(a.id)}" `):""}
        ${S.canEdit||a.uid===S.uid?`<button type="button" class="btn ghost small" data-inc-del="${esc(a.uid)}|${esc(a.id)}">Borrar</button>`:""}</div></article>`; };
    if(!["Ver avisos","Añadir aviso"].includes(S.filter.incidencias)) S.filter.incidencias="Ver avisos";
    const anadir=S.filter.incidencias==="Añadir aviso";
    return `<div><h2>Avisos del barrio</h2><p class="lead">¿Una farola apagada, un bache o basura acumulada? Avisa con una foto y marca el sitio en el mapa. La directiva lo comunica al Concello y aquí verás cómo va.</p></div>
      ${filterBar("incidencias",["Ver avisos","Añadir aviso"],true)}
      ${anadir?form:""}<div id="mapa-slot" class="card" style="padding:6px"></div>
      ${anadir?"":`<section class="stack">${list.length?list.map(card).join(""):`<div class="empty"><strong>No hay avisos todavía.</strong>Cuando un socio avise de un problema, saldrá aquí.</div>`}</section>`}`;
  },
  proyectos(){
    let list=sortDesc(S.items.filter(i=>i.section==="proyectos"||(i.section==="quejas"&&i.kind==="proyecto"))).map(i=>i.ptab==="Banco de la memoria"?{...i,ptab:PTABS[0]}:i);
    const hayOtros=list.some(i=>!PTABS.includes(i.ptab)), tabs=hayOtros?[...PTABS,"Otros"]:PTABS;
    if(!tabs.includes(S.filter.proyectos)) S.filter.proyectos=PTABS[0];
    const f=S.filter.proyectos;
    list = f==="Otros" ? list.filter(i=>!PTABS.includes(i.ptab)) : list.filter(i=>i.ptab===f);
    return `<div><h2>Proyectos</h2><p class="lead">Los proyectos que la asociación impulsa para el barrio y en qué punto está cada uno.</p></div>
      ${filterBar("proyectos",tabs,true)}
      ${PINTRO[f]?`<div class="card"><p style="margin:0">${PINTRO[f]}</p></div>`:""}
      <section class="stack">${list.length?list.map(quejaCard).join(""):emptyBox("Todavía no hay documentos en esta pestaña.","Añade el documento con «+ Añadir proyecto» y elige esta pestaña.")}</section>`;
  },
  mercadillo(){
    const mercContacto = a => {
      const c=(a.contacto||"").trim(), msg=`Hola${a.nombre?" "+a.nombre:""}, soy socio/a de la Asociación de Vecinos Parque de Rosalía-Recatelo. Me interesa tu anuncio del Mercadiño: «${a.titulo}».`;
      const b=[];
      if(c.includes("@")) b.push(`<a class="btn small" href="mailto:${encodeURIComponent(c)}?subject=${encodeURIComponent("Mercadiño: "+a.titulo)}&body=${encodeURIComponent(msg)}">Me interesa: escribir correo</a>`);
      else { let d=c.replace(/\D/g,""); if(d.length===9) d="34"+d; else if(d.startsWith("0034")) d=d.slice(2);
        if(d.length>=11){ b.push(`<a class="btn small" target="_blank" rel="noopener" href="https://wa.me/${d}?text=${encodeURIComponent(msg)}">Me interesa: WhatsApp</a>`); b.push(`<a class="btn ghost small" href="tel:+${d}">Llamar</a>`); } }
      return b.length?`<div class="row-actions" style="justify-content:flex-start">${b.join("")}</div>`:"";
    };
    let list=[]; for(const d of S.mercAll) for(const a of (d.anuncios||[])) list.push({...a, uid:d.uid});
    list.sort((x,y)=>(y.at||"").localeCompare(x.at||""));
    if(S.mercAntes==null) S.mercAntes=mercVisto();
    try{ localStorage.setItem("recatelo-merc-visto",new Date().toISOString()); }catch(_){}
    const nuevoEn = t => list.some(a=>a.uid!==S.uid&&(a.at||"")>S.mercAntes&&(t==="Empleo"?ETIPOS.includes(a.tipo):a.tipo===t));
    // Sin pestaña "Todas": se abre en la pestaña del anuncio más reciente
    const pestMerc = t => ETIPOS.includes(t) ? "Empleo" : t;
    if(![...MTIPOS,"Empleo"].includes(S.filter.mercadillo)) S.filter.mercadillo = list.length ? pestMerc(list[0].tipo) : MTIPOS[0];
    const f=S.filter.mercadillo;
    list = f==="Empleo" ? list.filter(a=>ETIPOS.includes(a.tipo)) : list.filter(a=>a.tipo===f);
    const card = a => `<article class="card"><div class="meta">${a.uid!==S.uid&&(a.at||"")>S.mercAntes?`<span class="pill p-red">Nuevo</span>`:""}<span class="pill ${a.tipo==="Dono"?"p-green":a.tipo==="Compro"?"p-amber":a.tipo==="Trueque"?"p-blue":a.tipo==="Alquilo"?"p-green":a.tipo==="Ofrezco empleo"?"p-blue":a.tipo==="Busco empleo"?"p-amber":"p-red"}">${esc(a.tipo)}</span>${a.precio?`<span><strong>${esc(a.precio)}</strong></span>`:""}<span>${a.at?new Date(a.at).toLocaleDateString("es-ES",{day:"numeric",month:"long"}):""}</span>${a.editado?`<span>(corregido)</span>`:""}</div>
      <h3>${esc(a.titulo)}</h3>${a.texto?`<p class="body">${esc(a.texto)}</p>`:""}${(a.fotos||[]).length?`<div class="merc-fotos">${a.fotos.map(f=>`<img src="${imgSrc(f)}" alt="" loading="lazy" onerror="this.remove()">`).join("")}</div>`:""}<p class="body"><strong>Contacto:</strong> ${esc(a.contacto)}${a.nombre?" · "+esc(a.nombre):""}</p>
      ${a.uid!==S.uid?mercContacto(a):""}
      ${(a.uid===S.uid||S.canEdit)?`<div class="row-actions"><button class="btn ghost small" data-merc-edit="${esc(a.uid)}|${esc(a.id)}">Editar anuncio</button><button class="btn ghost small" data-merc-del="${esc(a.uid)}|${esc(a.id)}">Quitar anuncio</button></div>`:""}</article>`;
    let form="";
    if(S.uid && !S.noDb) form = `<details class="card" id="mc-box"><summary><strong>Poner un anuncio</strong></summary><form id="mc-form" novalidate style="display:grid;gap:12px;margin-top:12px">
      <div class="two">${field("mc-tipo","Qué quieres hacer",sel("mc-tipo",[...MTIPOS,...ETIPOS],f==="Empleo"?"Ofrezco empleo":f))}${field("mc-precio","Precio o sueldo (opcional)",`<input id="mc-precio" placeholder="Por ejemplo: 20 € o 50 €/mes">`)}</div>
      ${field("mc-titulo","Título",`<input id="mc-titulo" placeholder="${f==="Empleo"?"Por ejemplo: busco cuidadora por las tardes":"Por ejemplo: bicicleta de niño"}">`)}
      ${field("mc-texto","Descripción (opcional)",`<textarea id="mc-texto"></textarea>`)}
      ${field("mc-foto","Fotos (opcional, hasta 3)",`<input id="mc-foto" type="file" accept="image/*" multiple><span class="meta" id="mc-foto-n">${S.mcFotos&&S.mcFotos.length?S.mcFotos.length+(S.mcFotos.length===1?" foto elegida":" fotos elegidas"):""}</span>`)}
      <div class="two">${field("mc-contacto","Teléfono o correo para contactar",`<input id="mc-contacto" autocomplete="tel">`)}${field("mc-nombre","Tu nombre (opcional)",`<input id="mc-nombre" autocomplete="name">`)}</div>
      <p class="err" id="mc-err" hidden></p><div class="row-actions"><button class="btn" id="mc-send">Publicar anuncio</button></div></form></details>`;
    return `<div><h2>Mercadiño</h2><p class="lead">Alquila, vende, dona, compra o haz trueque entre vecinos, y ofrece o busca empleo en la pestaña Empleo. Solo los socios ven los anuncios. Si te interesa uno, pulsa “Me interesa” y le escribes directamente a quien lo publicó.</p></div>
      ${form}${filterBar("mercadillo",[...MTIPOS,"Empleo"],true).replace(/<button data-f="([^"]+)"([^>]*)>([^<]*)<\/button>/g,(m,v,r,l)=>nuevoEn(v)?`<button data-f="${v}"${r}>${l} 🔴</button>`:m)}
      <section class="stack">${list.length?list.map(card).join(""):emptyBox(f==="Empleo"?"No hay ofertas ni demandas de empleo todavía.":"No hay anuncios todavía.","Pon el primero con “Poner un anuncio”.")}</section>`;
  },
  sugerencias(){
    const list=sortDesc(S.items.filter(i=>i.section==="sugerencias"||(i.section==="quejas"&&i.kind!=="proyecto")));
    return `<div><h2>Sugerencias</h2><p class="lead">${S.canEdit?"Los mensajes que envían los socios y las propuestas que la asociación ha trasladado a las instituciones.":"Envía tu queja o sugerencia a la directiva y consulta las propuestas que la asociación ha trasladado a las instituciones."}</p></div>
      <section class="stack"><h3>${S.canEdit?"Mensajes de los socios":"Envía la tuya a la directiva"}</h3>${S.canEdit?"":`<p class="lead" style="margin:0">Solo la directiva lee los mensajes.</p>`}${VIEWS.buzon(true)}</section>
      <section class="stack"><h3>Propuestas de la asociación</h3>${list.length?list.map(quejaCard).join(""):emptyBox("No hay sugerencias todavía.","Añade cada sugerencia con la institución y su estado.")}</section>`;
  },
  colectivos(){
    const news=sortDesc(bySection("colectivos"));
    return `<div><h2>Colectivos que apadrinamos</h2><p class="lead">Entidades sociales a las que la asociación da su apoyo.</p></div>
      <section class="grid2">${COLECTIVOS.map(c=>`<article class="card colectivo"><div class="ico" aria-hidden="true">${colIcon(c.id)}</div><div><h3>${c.name}</h3><p class="body" style="color:var(--muted);margin-top:4px">${c.desc}</p></div></article>`).join("")}</section>
      <section class="stack"><h3>Noticias de los colectivos</h3>${news.length?news.map(colNews).join(""):emptyBox("Sin noticias por ahora.","Añade campañas, recogidas o actos de estos colectivos.")}</section>`;
  },
  fotos(){
    const LIBRE="Foto temática libre socios", soc=[];
    for(const d of S.fotoSoc||[]) for(const x of (d.fotos||[])) soc.push({id:"s:"+d.uid+":"+x.id, section:"fotos", album:ALBUMES.includes(x.album)?x.album:LIBRE, photo:x.photo, photoType:x.photoType, title:"Foto de un socio", date:(x.at||"").slice(0,10), socio:d.uid, fid:x.id});
    const all=sortDesc([...bySection("fotos"), ...soc]); const f=S.filter.fotos;
    if(f==="__vistas") return S.canEdit ? quienMiraFotos() : (S.filter.fotos="todas", VIEWS.fotos());
    const albs=[...ALBUMES.filter(a=>a!=="Otros"), ...new Set(all.map(i=>i.album||"Otros").filter(a=>!ALBUMES.includes(a))), "Otros"];
    if(f==="todas"){
      const card=a=>{ const ps=all.filter(i=>(i.album||"Otros")===a); if(a==="Otros"&&!ps.length) return ""; const c=ps.find(i=>i.photo&&!/pdf/.test(i.photoType||""));
        return `<button class="carpeta" data-f="${esc(a)}"><span class="cov">${c?`<img src="${imgSrc(c.photo)}" alt="" loading="lazy">`:"📁"}</span><strong>${esc(a)}</strong><span class="meta">${ps.length} foto${ps.length===1?"":"s"}</span></button>`; };
      return `<div><h2>Fotos</h2><p class="lead">Las fotos de las Festas de Recatelo y de las demás actividades del barrio, por carpetas.</p></div>${S.canEdit?`<div class="filters" data-filter="fotos"><button data-f="__vistas">👁 Quién mira las fotos (solo directiva)</button></div>`:""}
        <section class="carpetas" data-filter="fotos">${albs.map(card).join("")}</section>`;
    }
    const list=all.filter(i=>(i.album||"Otros")===f); S.verList=list.filter(i=>i.photo); registrarFoto(f);
    const trimAll = S.canEdit && list.length ? `<div class="row-actions">${!SOC_ALBS.includes(f)&&list.some(i=>i.photo&&!i.socio)?`<button type="button" class="btn ghost small" data-pix-all>Pixelar las caras de toda la carpeta</button>`:""}<button type="button" class="btn ghost small" data-mover-fotos>Mover fotos a otra carpeta</button></div>` : "";
    const puedeSubir = SOC_ALBS.includes(f) && S.uid && !S.canEdit && !S.noDb && (window.subirFotoSocio || S.assets);
    const n=(S.fsElegidas||[]).length;
    const subir = puedeSubir ? `<form class="card" id="fs-form" novalidate><h3>Sube tus fotos</h3><p class="meta">${f===LIBRE?"Esta carpeta es de los socios: cualquier tema vale. Solo las ven los socios.":"Enseña lo que hay que arreglar en el barrio: baches, suciedad, farolas, aceras… Las ven la directiva y los socios."}</p>
      <label class="field"><span>Carpeta</span><select id="fs-alb">${SOC_ALBS.map(a=>`<option value="${esc(a)}"${a===f?" selected":""}>${esc(a)}</option>`).join("")}</select></label>
      <label class="field"><span>Elige una o varias fotos</span><input id="fs-files" type="file" accept="image/*,.jpg,.jpeg,.png,.webp,.gif" multiple></label>
      ${n?`<p class="meta">${n} foto${n===1?"":"s"} elegida${n===1?"":"s"}. Puedes volver a pulsar para añadir más. <button type="button" class="btn ghost small" id="fs-limpiar">Quitar todas</button></p>`:""}
      <p class="err" id="fs-err" hidden></p><div class="row-actions"><button class="btn" id="fs-send">Subir ${n>1?n+" fotos":"foto"}</button></div></form>` : "";
    return `<div class="filters" data-filter="fotos"><button data-f="todas">← Todas las carpetas</button></div>
      <div><h2>${esc(f)}</h2><p class="lead">${list.length} foto${list.length===1?"":"s"}</p></div>${subir}
      ${trimAll}${list.length?`<section class="photos">${list.map(it=>photoCard(it, S.verList.indexOf(it))).join("")}</section>`:emptyBox("Esta carpeta todavía está vacía.",S.canEdit?"Pulsa “+ Añadir foto” para subir la primera.":"Pronto subiremos las fotos.")}`;
  },
  buzon(sinIntro){
    const intro = sinIntro ? "" : `<div><h2>Buzón de quejas y sugerencias</h2><p class="lead">Cuéntale a la directiva lo que te preocupa del barrio o lo que mejorarías. Solo la directiva lee los mensajes.</p></div>`;
    if(S.canEdit) return intro + buzonAdmin();
    let form;
    if(S.noDb || !S.uid) form = `<div class="notice">Para escribir en el buzón tienes que abrir la app con tu cuenta.</div>`;
    else if(S.buzonBlocked) form = `<div class="notice">Tu acceso solo permite leer. Pide a la directiva permiso de “Colaborador” para poder enviar mensajes.</div>`;
    else form = `<form class="card" id="bz-form" novalidate><h3>Nuevo mensaje</h3>
      <div class="two">${field("bz-tipo","Tipo",sel("bz-tipo",BTIPOS,"Queja"))}${field("bz-contacto","Tu nombre o teléfono (opcional)",`<input id="bz-contacto" autocomplete="name">`)}</div>
      ${field("bz-texto","Mensaje",`<textarea id="bz-texto" placeholder="Por ejemplo: la farola de la calle … lleva una semana apagada."></textarea>`)}
      <p class="err" id="bz-err" hidden></p><div class="row-actions"><button class="btn" id="bz-send">Enviar a la directiva</button></div></form>`;
    const mine = (S.buzon?.msgs||[]).slice().reverse();
    return intro + form + `<section class="stack"><h3>Mis mensajes</h3>${mine.length?mine.map(m=>bzCard(m,false)).join(""):`<div class="empty"><strong>Aún no has enviado ningún mensaje.</strong>Cuando la directiva te responda, verás la respuesta aquí.</div>`}</section>`;
  },
  misdatos(){
    const f = S.ficha || {};
    const intro = `<div><h2>Mis datos de socio</h2><p class="lead">Déjanos tus datos para que la directiva pueda contactarte, y cuéntanos qué es lo primero que mejorarías en el barrio. Solo la directiva los ve.</p></div>`;
    let form;
    if(S.noDb || !S.uid) form = `<div class="notice">Abre la app con tu cuenta para rellenar tus datos.</div>`;
    else if(S.fichaBlocked) form = `<div class="notice">Tu acceso solo permite leer. Pide a la directiva permiso de “Colaborador” para guardar tus datos.</div>`;
    else if(S.ficha && !S.fichaEdit) form = `<section class="card"><h3>Tus datos</h3>
      <div class="notice">Guardados el ${new Date(f.at).toLocaleDateString("es-ES",{day:"numeric",month:"long",year:"numeric"})}. Si algo está mal, pulsa “Editar mis datos” y corrígelo.</div>
      <dl class="datos"><dt>Nombre y apellidos</dt><dd>${esc(f.nombre||"—")}</dd><dt>Dirección</dt><dd>${esc(f.direccion||"—")}</dd><dt>Teléfono</dt><dd>${esc(f.telefono||"—")}</dd><dt>Correo electrónico</dt><dd>${esc(f.email||"—")}</dd><dt>Tu prioridad para el barrio</dt><dd>${esc(f.prioridad||"—")}</dd></dl>
      <div class="row-actions"><button type="button" class="btn ghost" id="fi-borrar">Borrar mis datos</button><button type="button" class="btn" id="fi-editar">Editar mis datos</button></div></section>`;
    else form = `<form class="card" id="fi-form" novalidate>
      ${S.ficha?`<h3>Editar mis datos</h3>`:""}
      ${field("fi-nombre","Nombre y apellidos",`<input id="fi-nombre" autocomplete="name" value="${esc(f.nombre||"")}">`)}
      ${field("fi-dir","Dirección",`<input id="fi-dir" autocomplete="street-address" placeholder="Calle, número, piso" value="${esc(f.direccion||"")}">`)}
      <div class="two">${field("fi-tel","Teléfono",`<input id="fi-tel" type="tel" autocomplete="tel" value="${esc(f.telefono||"")}">`)}${field("fi-email","Correo electrónico (si tienes)",`<input id="fi-email" type="email" autocomplete="email" value="${esc(f.email||"")}">`)}</div>
      ${field("fi-prio","Tu prioridad para mejorar el barrio",`<textarea id="fi-prio" maxlength="300" style="min-height:90px" placeholder="En una frase: ¿qué es lo primero que mejorarías en la zona?">${esc(f.prioridad||"")}</textarea>`)}
      <label class="check"><input type="checkbox" id="fi-ok" ${S.ficha?"checked":""}> <span>Acepto que la asociación guarde estos datos según la <a href="#privacidad" data-go="privacidad">información de protección de datos</a>.</span></label>
      <p class="err" id="fi-err" hidden></p>
      <div class="row-actions">${S.ficha?`<button type="button" class="btn ghost" id="fi-cancelar">Cancelar</button>`:""}<button class="btn" id="fi-save">${S.ficha?"Guardar cambios":"Guardar mis datos"}</button></div></form>`;
    let admin="";
    if(S.canEdit){
      const rows=S.fichasAll.slice().sort((a,b)=>(a.nombre||"").localeCompare(b.nombre||"","es"));
      admin=`<section class="stack"><h3>Socios registrados (solo directiva): ${rows.length}</h3>${rows.length?`<div class="card" style="overflow-x:auto"><table class="tbl"><thead><tr><th>Nombre</th><th>Dirección</th><th>Correo</th><th>Fecha</th><th>Cuota ${anioCuota()}</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.nombre)}</td><td>${esc(r.direccion)}</td><td>${esc(r.email)}</td><td>${r.at?new Date(r.at).toLocaleDateString("es-ES"):""}</td><td>${cuotaPagada(r.uid)?`<button type="button" class="btn small" data-cuota="${esc(r.uid)}|0">✓ Pagada</button>`:`<button type="button" class="btn ghost small" data-cuota="${esc(r.uid)}|1">Pendiente</button>`}</td><td><button type="button" class="btn ghost small" data-ficha-del="${esc(r.uid)}">Borrar</button></td></tr>`).join("")}</tbody></table></div>
        <h3>Prioridades de los socios</h3>${rows.filter(r=>r.prioridad).map(r=>`<article class="card"><p class="body">“${esc(r.prioridad)}”</p><div class="meta">${esc(r.nombre)}</div></article>`).join("")||`<div class="empty">Nadie ha escrito su prioridad todavía.</div>`}`
        :`<div class="empty"><strong>Aún no hay socios registrados.</strong>Comparte el enlace de esta sección para que rellenen sus datos.</div>`}</section>`;
    }
    return intro + cuotaSocio() + form + admin;
  },
  privacidad(){
    const c = S.consent;
    let box;
    if(S.noDb || !S.uid) box = `<div class="notice">Abre la app con tu cuenta para poder dar tu consentimiento.</div>`;

async function nsGuardar(uid, cambiar){
  const d=(S.buzonAll||[]).find(x=>x.uid===uid); if(!d) return;
  await S.db.doc("buzon/"+uid).update({propuestos:cambiar((d.propuestos||[]).slice())});
}
document.addEventListener("submit", async e=>{
  if(e.target.id!=="ns-form") return; e.preventDefault();
  const er=$("#ns-err"); er.hidden=true;
  const nombre=$("#ns-nombre").value.trim().slice(0,80), tel=$("#ns-tel").value.trim().slice(0,30);
  if(!nombre||!tel){ er.textContent="Escribe el nombre y el teléfono."; er.hidden=false; return; }
  if(tel.replace(/\D/g,"").length<9){ er.textContent="Revisa el teléfono, parece que le faltan números."; er.hidden=false; return; }
  if(!$("#ns-ok").checked){ er.textContent="Antes de enviarlo, pregúntale si está de acuerdo y marca la casilla."; er.hidden=false; return; }
  const b=$("#ns-send"); b.disabled=true; b.textContent="Enviando…";
  const x={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), nombre, tel, at:new Date().toISOString()};
  try{ const cur=S.buzon||{}; await S.db.doc("buzon/"+S.uid).set({...cur, uid:S.uid, msgs:cur.msgs||[], propuestos:[...(cur.propuestos||[]), x].slice(-30)}); S.buzon={...cur, propuestos:[...(cur.propuestos||[]), x]};
    $("#ns-nombre").value=""; $("#ns-tel").value=""; $("#ns-ok").checked=false; b.disabled=false; b.textContent="Enviar a la directiva";
    er.textContent="Enviado. Gracias, la directiva se pondrá en contacto."; er.hidden=false; er.className="notice"; }
  catch(_){ er.textContent="No se ha podido enviar. Vuelve a intentarlo."; er.hidden=false; b.disabled=false; b.textContent="Enviar a la directiva"; }
});
document.addEventListener("click", e=>{
  const o=e.target.closest("[data-ns-ok]"); if(o){ const [u,id]=o.dataset.nsOk.split("|"); nsGuardar(u,l=>l.map(x=>x.id===id?{...x,contactado:new Date().toISOString()}:x)).catch(()=>alert("No se ha podido guardar.")); return; }
  const d=e.target.closest("[data-ns-del]"); if(d){ if(!confirm("¿Borrar esta propuesta?")) return; const [u,id]=d.dataset.nsDel.split("|"); nsGuardar(u,l=>l.filter(x=>x.id!==id)).catch(()=>alert("No se ha podido borrar.")); }
});

/* ---------- encuestas ---------- */
function encuestaCard(it){
  const ops=it.opciones||[], mio=S.votos&&S.votos.votos?S.votos.votos[it.id]:undefined, votado=mio!==undefined;
  const cerrada=!!(it.cierre&&it.cierre<today());
  const rec=S.recVotos[it.id]||{}, total=Object.values(rec).reduce((a,b)=>a+b,0);
  const verRes = votado || cerrada || S.canEdit;
  const cuerpo = verRes
    ? `<div class="opc">${ops.map((o,i)=>{ const n=rec[i]||0, pc=total?Math.round(n*100/total):0; return `<div><div class="meta" style="justify-content:space-between"><span>${String(mio)===String(i)?"✓ ":""}${esc(o)}</span><span>${n} (${pc}%)</span></div><div class="barra"><i style="width:${pc}%"></i></div></div>`; }).join("")}</div>
       <p class="meta">${total===1?"1 voto":total+" votos"}${votado&&!cerrada?" · Has votado. Puedes cambiar tu voto:":""}</p>`
    : "";
  const botones = !cerrada && S.uid ? `<div class="opc">${ops.map((o,i)=>`<button type="button" class="btn ${votado?"ghost small":""}" data-voto="${esc(it.id)}|${i}">${esc(o)}</button>`).join("")}</div>` : "";
  return `<article class="card"><div class="meta"><span class="pill ${cerrada?"p-amber":"p-green"}">${cerrada?"Cerrada":"Abierta"}</span>${it.cierre?`<span>${cerrada?"Cerró el":"Se puede votar hasta el"} ${fmtDate(it.cierre)}</span>`:""}</div>
    <h3>${esc(T(it))}</h3>${it.body?`<p class="body">${esc(B(it))}</p>`:""}${cuerpo}${botones}${adminRow(it)}</article>`;
}
async function contarVotos(){ if(!window.rpcApp) return; try{ const r=await rpcApp("recuento_votos"); if(r&&typeof r==="object"){ S.recVotos=r; render(); } }catch(e){} }
async function votar(enc, i){
  const votos={...((S.votos&&S.votos.votos)||{})}; votos[enc]=i;
  try{ await S.db.doc("votos/"+S.uid).set({uid:S.uid, votos}); S.votos={votos}; render(); contarVotos(); }
  catch(x){ alert("No se ha podido guardar tu voto. Vuelve a intentarlo."); }
}
async function startVotos(){
  if(!S.db||!S.uid) return;

/* ---------- avisos del barrio ---------- */
let MAPA=null, MAPA_EL=null, MAPA_CAPA=null, MAPA_MIO=null;
function cargarLeaflet(){
  if(window.L) return Promise.resolve();
  if(cargarLeaflet.p) return cargarLeaflet.p;
  const css=document.createElement("link"); css.rel="stylesheet"; css.href="vendor/leaflet/leaflet.css"; document.head.appendChild(css);
  return cargarLeaflet.p=new Promise((ok,ko)=>{ const sc=document.createElement("script"); sc.src="vendor/leaflet/leaflet.js"; sc.onload=ok; sc.onerror=ko; document.head.appendChild(sc); });
}
async function montarMapa(){
  const slot=document.getElementById("mapa-slot"); if(!slot) return;
  if(!MAPA_EL){ MAPA_EL=document.createElement("div"); MAPA_EL.id="mapa"; }
  slot.appendChild(MAPA_EL);
  try{ await cargarLeaflet(); }catch(e){ MAPA_EL.textContent="No se ha podido cargar el mapa."; return; }
  if(!MAPA){
    MAPA=L.map(MAPA_EL).setView([43.0072,-7.5615],16);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19, attribution:"© OpenStreetMap"}).addTo(MAPA);
    MAPA_CAPA=L.layerGroup().addTo(MAPA);
    MAPA.on("click",ev=>{ if(!S.uid) return; marcarMio(ev.latlng.lat, ev.latlng.lng); });
  }
  setTimeout(()=>MAPA.invalidateSize(),50);
  MAPA_CAPA.clearLayers();
  for(const d of S.incAll) for(const a of (d.avisos||[])) if(a.lat!=null){
    const st=IESTADOS[a.estado]||IESTADOS.pendiente;
    L.circleMarker([a.lat,a.lng],{radius:9, weight:2, color:"#fff", fillOpacity:.95, fillColor:a.estado==="arreglado"?"#3e7d5a":a.estado==="comunicado"?"#b86a12":"#b3261e"})
      .bindPopup(`<strong>${esc(a.tipo)}</strong><br>${esc(st[0])}${a.texto?"<br>"+esc(a.texto):""}`).addTo(MAPA_CAPA);
  }
  if(S.incPos) marcarMio(S.incPos.lat, S.incPos.lng, true);
}
function marcarMio(lat,lng,silencio){
  S.incPos={lat:+lat.toFixed(6), lng:+lng.toFixed(6)};
  if(!MAPA) return;
  if(MAPA_MIO) MAPA_MIO.setLatLng([lat,lng]); else MAPA_MIO=L.marker([lat,lng]).addTo(MAPA);
  const m=document.getElementById("inc-pos"); if(m && !silencio) m.textContent="Ubicación marcada en el mapa.";
}
async function startInc(){
  if(!S.db) return;
  S.db.collection("incidencias").onSnapshot(snap=>{ S.incAll=snap.docs.map(d=>({uid:d.id,...d.data()})); renderDatos(); },()=>{});
}
async function guardarInc(uid, cambiar){
  const d=S.incAll.find(x=>x.uid===uid); const avisos=cambiar(((d&&d.avisos)||[]).slice());
  await S.db.doc("incidencias/"+uid).set({avisos});
}

$("#main").addEventListener("click", async e=>{
  const ap=e.target.closest("[data-apoyo]"); if(ap) return setApoyo(ap.dataset.apoyo==="1");
  const vt=e.target.closest("[data-voto]"); if(vt){ const [enc,i]=vt.dataset.voto.split("|"); return votar(enc,+i); }
  const cu=e.target.closest("[data-cuota]"); if(cu){ const [u,on]=cu.dataset.cuota.split("|"); return setCuota(u,on==="1"); }
  if(e.target.closest("#inc-gps")){
    const m=$("#inc-pos"); if(!navigator.geolocation){ m.textContent="Este móvil no da la ubicación. Toca en el mapa el sitio."; return; }
    m.textContent="Buscando dónde estás…";
    navigator.geolocation.getCurrentPosition(p=>{ marcarMio(p.coords.latitude,p.coords.longitude); if(MAPA) MAPA.setView([p.coords.latitude,p.coords.longitude],18); },
      ()=>{ m.textContent="No se ha podido saber tu ubicación. Toca en el mapa el sitio."; },{enableHighAccuracy:true, timeout:15000});
    return;
  }
  const iv=e.target.closest("[data-inc-ver]"); if(iv){
    for(const d of S.incAll) for(const a of (d.avisos||[])) if(a.id===iv.dataset.incVer && MAPA){ MAPA.setView([a.lat,a.lng],18); MAPA_EL.scrollIntoView({behavior:"smooth",block:"center"}); }
    return;
  }
  const idl=e.target.closest("[data-inc-del]"); if(idl){
    const [u,id]=idl.dataset.incDel.split("|"); if(!confirm("¿Borrar este aviso?")) return;
    try{ await guardarInc(u, l=>l.filter(a=>a.id!==id)); }catch(x){ alert("No se ha podido borrar. Vuelve a intentarlo."); }
  }
});

// Los datos se refrescan cada 30 segundos; mientras alguien escribe en un formulario no se repinta la pantalla

window.sinAvisos = () => !!(S.uid && !S.canEdit && S.consent && S.consent.comunicaciones===false);
let RENDER_PEND=false;
function escribiendo(){ const a=document.activeElement; return !!(a && a.closest && a.closest("#main, #sheet-root") && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)); }
function renderDatos(){ if(escribiendo()){ RENDER_PEND=true; return; } render(); }
document.addEventListener("focusout", ()=>{ if(!RENDER_PEND) return; setTimeout(()=>{ if(RENDER_PEND && !escribiendo()){ RENDER_PEND=false; render(); } }, 1500); });
function render(){
  RENDER_PEND=false;
  let html = "";
  if(S.noDb) html += `<div class="notice">Abre esta app con tu cuenta de Claude para ver las publicaciones de la asociación.</div>`;
  else if(!S.loaded) html += `<div class="notice">Cargando publicaciones…</div>`;
  const gate = S.uid && !S.canEdit && S.consentLoaded && !(S.consent&&S.consent.acepta) && !S.consentBlocked;
  $("#tabs").hidden = !!gate;
  // Después de la protección de datos, también hay que rellenar «Mis datos» para poder navegar
  const gateFicha = !gate && S.uid && !S.canEdit && S.consent && S.consent.acepta && S.fichaLoaded && !S.ficha && !S.fichaBlocked;
  if(gateFicha){ $("#tabs").hidden = true; S.fichaEdit = true; }
  if(gate) html += `<div class="next"><span class="eyebrow">Bienvenida/o a la app de socios</span><h3>Antes de empezar, firma la protección de datos</h3><span>Lee la información y marca la primera casilla. Solo tendrás que hacerlo una vez.</span></div>` + VIEWS.privacidad();
  else if(gateFicha) html += `<div class="next"><span class="eyebrow">Un último paso</span><h3>Rellena tus datos de socio</h3><span>Así la directiva sabe quién eres y puede contactarte. Solo tendrás que hacerlo una vez y solo los ve la directiva.</span></div>` + VIEWS.misdatos();
  else {
    const g = groupOf(S.tab);
    if(g.subs.length>1) html += `<div class="filters" role="tablist" aria-label="${esc(g.label)}">${g.subs.map(([id,l])=>`<button data-go="${id}" aria-pressed="${S.tab===id}">${l}</button>`).join("")}</div>`;
    html += VIEWS[S.tab]();
  }
  const keep = {}; for(const id of ["ns-nombre","ns-tel","mc-tipo","mc-precio","mc-titulo","mc-texto","mc-contacto","mc-nombre","bz-texto","bz-contacto","bz-tipo","fi-nombre","fi-dir","fi-tel","fi-email","fi-prio","lt-nombre","lt-dni","lt-n","inc-tipo","inc-texto","bq"]){ const el=document.getElementById(id); if(el) keep[id]=el.value; }
  const abiertos = [...document.querySelectorAll("#main details[id]")].filter(d=>d.open).map(d=>d.id);
  $("#main").innerHTML = html;
  for(const id of abiertos){ const d=document.getElementById(id); if(d) d.open=true; }
  for(const id in keep){ const el=document.getElementById(id); if(el) el.value=keep[id]; }
  $("#fab").hidden = !(S.canEdit && ADD_LABEL[S.tab]) || !!gate;
  if(!$("#fab").hidden) $("#fab").textContent = "+ Añadir " + ADD_LABEL[S.tab];
  document.body.classList.toggle("con-fab", !$("#fab").hidden);
  if(S.tab==="incidencias") montarMapa();
  pintarMarca();
}

    S.db.collection("buzon").onSnapshot(async snap=>{

      try{ const ps=await S.user.profiles(S.buzonAll.map(d=>d.uid)); for(const u in ps) S.names[u]=ps[u].name||""; }catch(e){}
      renderDatos();
    },()=>{});
  } else if(S.uid){
    S.db.doc("buzon/"+S.uid).onSnapshot(snap=>{ S.buzon=snap.exists?snap.data():null; renderDatos(); },()=>{});
  }
}

/* ---------- formulario de la directiva ---------- */
function field(id,label,inner){ return `<label for="${id}">${label}${inner}</label>`; }
function sel(id,opts,val){ return `<select id="${id}">${opts.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${v===val?"selected":""}>${esc(l)}</option>`}).join("")}</select>`; }
function closeSheet(){ $("#sheet-root").innerHTML=""; }

function openForm(section, it){
  const v = it || {date: today()};
  let extra = "";
  if(section==="cursos") extra = `<div class="two">${field("f-time","Horario",`<input id="f-time" value="${esc(v.time||"")}" placeholder="Martes y jueves, 18:00–19:30">`)}${field("f-place","Lugar",`<input id="f-place" value="${esc(v.place||"")}">`)}</div>`
     + field("f-plazas","Plazas (déjalo vacío si no hay límite)",`<input id="f-plazas" type="number" min="1" inputmode="numeric" value="${esc(v.plazas||"")}">`);
  if(section==="avisos") extra = field("f-kind","Tipo",sel("f-kind",[["reunion","Reunión de socios"],["aviso","Aviso general"]],v.kind||"reunion"))
     + `<div class="two">${field("f-time","Hora",`<input id="f-time" type="time" value="${esc(v.time||"")}">`)}${field("f-place","Lugar",`<input id="f-place" value="${esc(v.place||"")}" placeholder="Local social, plaza…">`)}</div>`;
  const regF = `<div class="two">${field("f-regdate","Registrado en el Concello el (opcional)",`<input id="f-regdate" type="date" value="${esc(v.regDate||"")}">`)}${field("f-regnum","Nº de registro (opcional)",`<input id="f-regnum" value="${esc(v.regNum||"")}" placeholder="REGAGE…">`)}</div>`;
  const entDef = v.entity || (S.filter[section] && S.filter[section]!=="todas" && ENTIDADES.includes(S.filter[section]) ? S.filter[section] : "Alcaldía");
  if(section==="reuniones") extra = regF;
  if(section==="proyectos"||section==="sugerencias"||section==="quejas") extra = `<div class="two">${field("f-status","Estado",sel("f-status",Object.entries(ESTADOS).map(([k,x])=>[k,x[0]]),v.status||"presentada"))}</div>`
     + field("f-entity","Institución",sel("f-entity",ENTIDADES,entDef)) + regF;
  if(section==="proyectos") extra = field("f-ptab","Pestaña",sel("f-ptab",[...PTABS,"Otros"],v.ptab||(PTABS.includes(S.filter.proyectos)?S.filter.proyectos:PTABS[0]))) + extra;
  if(section==="encuestas") extra = field("f-opciones","Opciones (una por línea)",`<textarea id="f-opciones" style="min-height:110px" placeholder="Sí\nNo\nMe da igual">${esc((v.opciones||[]).join("\n"))}</textarea>`)
     + field("f-cierre","Se puede votar hasta el (opcional)",`<input id="f-cierre" type="date" value="${esc(v.cierre||"")}">`);
  if(section==="colectivos") extra = field("f-entity","Colectivo",sel("f-entity",COLECTIVOS.map(c=>c.name),v.entity||COLECTIVOS[0].name));
  if(section==="fotos") extra = field("f-album","Álbum",sel("f-album",[...new Set([...ALBUMES, ...(v.album?[v.album]:[])])],v.album||(S.filter.fotos&&S.filter.fotos!=="todas"?S.filter.fotos:ALBUMES[0])));
  const isCartel = section==="carteles";
  const isFoto = section==="fotos" || isCartel;
  const canPhoto = !!S.assets;
  $("#sheet-root").innerHTML = `<div class="sheet-bg" id="sheet-bg"><form class="sheet" id="f" novalidate>
    <h2>${it?"Editar":"Añadir"} ${ADD_LABEL[section]}</h2>
    ${section==="reuniones"?field("f-entity","¿Con quién fue la reunión? (elige la pestaña donde se guardará)",sel("f-entity",ENTIDADES,entDef)):""}
    ${field("f-title", section==="encuestas"?"Pregunta":isCartel?"Nombre de la actividad":isFoto?(section==="fotos"&&!it?"Pie de foto (opcional)":"Pie de foto"):"Título", `<input id="f-title" ${section==="fotos"?"":"required"} value="${esc(v.title||"")}">`)}
    ${field("f-date","Fecha",`<input id="f-date" type="date" value="${esc(v.date||"")}">`)}
    ${extra}
    ${isFoto?"":field("f-body", section==="reuniones"?"Resumen":section==="cursos"?"Explicación del curso":"Texto", `<textarea id="f-body">${esc(v.body||"")}</textarea>`)}
    ${isFoto?"":`<details class="gl-box"${v.titleGl||v.bodyGl||v.docGl?" open":""}><summary class="meta">En galego (opcional): lo verán los socios que elijan Galego</summary>${field("f-titlegl","Título en galego",`<input id="f-titlegl" value="${esc(v.titleGl||"")}">`)}${field("f-bodygl","Texto en galego",`<textarea id="f-bodygl">${esc(v.bodyGl||"")}</textarea>`)}${canPhoto?field("f-docgl","Documento en galego (PDF)",`<input id="f-docgl" type="file" accept="application/pdf">`)+(v.docGl?`<span class="meta">Ya tiene documento en galego; elige otro solo si quieres cambiarlo.</span>`:""):""}</details>`}
    ${canPhoto?field("f-photo", isCartel?"Cartel (imagen o PDF)":isFoto?(section==="fotos"&&!it?"Fotos (puedes elegir varias a la vez)":"Foto"):"Foto (opcional)", `<input id="f-photo" type="file" accept="image/*,.jpg,.jpeg,.png,.webp,.gif${isCartel?",application/pdf":""}"${section==="fotos"&&!it?" multiple":""}>`) + (v.photo?`<span class="meta">Ya tiene una foto; elige otra solo si quieres cambiarla.</span>`:"")
              :(isFoto?`<p class="err">Solo quien tenga permiso de edición puede subir fotos.</p>`:"")}
    ${canPhoto&&!isFoto?field("f-doc","Documento en PDF (opcional)",`<input id="f-doc" type="file" accept="application/pdf">`) + (v.doc?`<span class="meta">Ya tiene un documento${v.docName?" ("+esc(v.docName)+")":""}; elige otro solo si quieres cambiarlo.</span>`:""):""}
    <p class="err" id="f-err" hidden></p>
    <div class="row-actions"><button type="button" class="btn ghost" id="f-cancel">Cancelar</button><button class="btn" id="f-save">${it?"Guardar cambios":"Publicar"}</button></div>
  </form></div>`;
  $("#f-cancel").onclick = closeSheet;
  $("#sheet-bg").addEventListener("click", e=>{ if(e.target.id==="sheet-bg") closeSheet(); });
  $("#f-title").focus();
  let elegidas = (section==="fotos" && !it && S.compartidas) || []; S.compartidas = null;
  if(section==="fotos" && !it){
    const inp=$("#f-photo"), info=document.createElement("div"); info.className="meta"; info.id="f-elegidas"; inp.after(info);
    const pinta=()=>{ info.innerHTML = elegidas.length ? `${elegidas.length} foto${elegidas.length===1?"":"s"} elegida${elegidas.length===1?"":"s"}: ${elegidas.map(f=>esc(f.name)).join(", ")}. Puedes volver a pulsar para añadir más. <button type="button" class="btn ghost small" id="f-limpiar">Quitar todas</button>` : ""; const l=$("#f-limpiar"); if(l) l.onclick=()=>{ elegidas=[]; pinta(); }; };
    inp.addEventListener("change", ()=>{ for(const fl of inp.files) if(!elegidas.some(x=>x.name===fl.name&&x.size===fl.size)) elegidas.push(fl); inp.value=""; pinta(); });
    pinta();
  }
  $("#f").addEventListener("submit", async e=>{
    e.preventDefault();
    const err=$("#f-err"); err.hidden=true;
    const val=id=>{const el=$("#"+id);return el?el.value.trim():undefined};
    const data = {section, title:val("f-title"), date:val("f-date")||"", updatedAt:new Date().toISOString()};
    for(const [k,id] of [["body","f-body"],["kind","f-kind"],["time","f-time"],["place","f-place"],["entity","f-entity"],["status","f-status"],["album","f-album"],["ptab","f-ptab"],["plazas","f-plazas"],["regDate","f-regdate"],["regNum","f-regnum"],["titleGl","f-titlegl"],["bodyGl","f-bodygl"]]){ const x=val(id); if(x!==undefined) data[k]=x; }
    if(!data.title && section==="fotos") data.title = data.album || "Foto";
    if(section==="encuestas"){ data.opciones=(val("f-opciones")||"").split("\n").map(x=>x.trim()).filter(Boolean); data.cierre=val("f-cierre")||"";
      if(data.opciones.length<2){ err.textContent="Escribe al menos dos opciones, una en cada línea."; err.hidden=false; return; } }
    if(!data.title){ err.textContent="Escribe un título."; err.hidden=false; return; }
    const files = section==="fotos" && !it ? elegidas.slice() : ($("#f-photo") ? [...$("#f-photo").files] : []);
    if(section==="fotos" && !it && files.length>1){
      const btn=$("#f-save"); btn.disabled=true;
      let hechas=0, fallos=0;
      for(const fl of files){
        btn.textContent=`Subiendo ${hechas+fallos+1} de ${files.length}…`;
        try{
          if(fl.size>20*1024*1024) throw {code:"too_large"};
          const up = await S.assets.upload(await prepararFoto(fl));
          const t = new Date().toISOString();
          await S.db.collection("items").doc().set({...data, photo:up.id, photoType:up.contentType||fl.type, createdAt:t, updatedAt:t});
          hechas++;
        }catch(x){ fallos++; }
      }
      if(!fallos) return closeSheet();
      err.textContent=`Se han subido ${hechas} de ${files.length} fotos. ${fallos} no se ${fallos===1?"ha":"han"} podido subir (puede que pesen más de 20 MB). Vuelve a intentarlo con esas.`; err.hidden=false;
      btn.disabled=false; btn.textContent="Publicar"; return;
    }
    const file = files[0];
    if(isFoto && !file && !v.photo){ err.textContent=isCartel?"Elige el cartel para subir.":"Elige una foto para subir."; err.hidden=false; return; }
    const btn=$("#f-save"); btn.disabled=true; btn.textContent="Guardando…";
    try{
      if(file){
        if(file.size>20*1024*1024) throw {code:"too_large"};
        const up = await S.assets.upload(section==="fotos" ? await prepararFoto(file) : file);
        data.photo = up.id; data.photoType = up.contentType || file.type;
      } else if(v.photo){ data.photo = v.photo; if(v.photoType) data.photoType = v.photoType; }
      const doc = $("#f-doc") && $("#f-doc").files[0];
      if(doc){
        if(doc.type && !/pdf|octet-stream/i.test(doc.type) && !/\.pdf$/i.test(doc.name||"")) throw {code:"bad_type"};
        if(doc.size>20*1024*1024) throw {code:"too_large"};
        const upd = await S.assets.upload(doc, {type:"application/pdf"});
        data.doc = upd.id; data.docName = doc.name.slice(0,120);
      } else if(v.doc){ data.doc = v.doc; if(v.docName) data.docName = v.docName; }
      const docgl = $("#f-docgl") && $("#f-docgl").files[0];
      if(docgl){
        if(docgl.type && !/pdf|octet-stream/i.test(docgl.type) && !/\.pdf$/i.test(docgl.name||"")) throw {code:"bad_type"};
        if(docgl.size>20*1024*1024) throw {code:"too_large"};
        const upg = await S.assets.upload(docgl, {type:"application/pdf"});
        data.docGl = upg.id;
      } else if(v.docGl){ data.docGl = v.docGl; }
      for(const k of ["doc2","doc2Name","noticia"]) if(v[k]!==undefined&&data[k]===undefined) data[k]=v[k];
      if(it && it.cuando && !data.date) data.cuando = it.cuando;
      const ref = it ? S.db.collection("items").doc(it.id) : S.db.collection("items").doc();
      if(!it) data.createdAt = data.updatedAt;
      else data.createdAt = v.createdAt || data.updatedAt;
      await ref.set(data);
      closeSheet();
    }catch(x){
      const msg = {too_large:"El archivo pesa más de 20 MB. Prueba con uno más pequeño.", bad_type:"El documento tiene que ser un PDF. En Word: Archivo > Guardar como > PDF.", unsupported_type:"Ese formato de imagen no se admite. Usa JPG, PNG o WEBP.", invalid_argument:"No tienes permiso para publicar. Pide a la directiva acceso de edición.", quota_exceeded:"Se ha llenado el espacio de la app. Borra publicaciones antiguas.", quota_or_state:"Se ha llenado el espacio para fotos. Borra fotos antiguas.", rate_limited:"Demasiados intentos seguidos. Espera un momento y vuelve a probar.", unreadable:"El móvil no deja leer ese archivo. Descárgalo primero al móvil (en Gmail, pulsa la flecha de descargar) y elígelo desde Descargas.", network:"Se ha cortado la conexión al subir el archivo. Comprueba que tienes internet (mejor con wifi) y vuelve a pulsar Publicar."}[x&&x.code] || ("No se ha podido guardar. Vuelve a intentarlo." + ((x&&(x.message||x.code))?" (Detalle: "+String(x.message||x.code).slice(0,160)+")":""));
      err.textContent=msg; err.hidden=false; btn.disabled=false; btn.textContent=it?"Guardar cambios":"Publicar";
    }
  });
}

function askDelete(id){
  const it=S.items.find(i=>i.id===id); if(!it) return;
  $("#sheet-root").innerHTML = `<div class="sheet-bg" id="sheet-bg"><div class="sheet" role="dialog" aria-label="Borrar publicación">
    <h2>¿Borrar “${esc(T(it))}”?</h2><p class="body">Desaparecerá de la app para todos los socios. No se puede deshacer.</p>
    <p class="err" id="d-err" hidden></p>
    <div class="row-actions"><button class="btn ghost" id="d-no">Cancelar</button><button class="btn danger" id="d-yes">Borrar</button></div></div></div>`;
  $("#d-no").onclick=closeSheet;
  $("#d-yes").onclick=async()=>{
    try{
      if(SEMILLAS.some(s=>s.id===id)) await S.db.collection("items").doc(id).set({section:"_borrado", updatedAt:new Date().toISOString()});
      else await S.db.collection("items").doc(id).delete();
      if(it.photo && S.assets){ try{ await S.assets.delete(it.photo) }catch(e){} }
      if(it.doc && S.assets){ try{ await S.assets.delete(it.doc) }catch(e){} }
      closeSheet();
    }catch(e){ const er=$("#d-err"); er.textContent="No se ha podido borrar. Vuelve a intentarlo."; er.hidden=false; }
  };
}

// Carpetas donde también pueden subir fotos los socios
const SOC_ALBS=["Foto temática libre socios","Fotos denuncia"];

/* ---------- fotos compartidas desde WhatsApp o la galería (botón Compartir del móvil) ---------- */
async function recibirCompartidas(){
  const files=[];
  try{
    const c=await caches.open("recatelo-compartido");
    for(const k of await c.keys()){ const r=await c.match(k); if(r){ const b=await r.blob(); files.push(new File([b], decodeURIComponent(r.headers.get("x-nombre")||"foto.jpg"), {type:b.type||"image/jpeg"})); } await c.delete(k); }
  }catch(e){}
  if(!files.length || !S.uid) return;
  if(S.canEdit){
    S.assets = S.assets || await claude.use("assets");
    go("fotos"); S.compartidas=files; openForm("fotos");
  }else{
    S.filter.fotos="Foto temática libre socios"; S.fsElegidas=files; go("fotos");
  }
}


/* ---------- protección del contenido ---------- */
(function(){
  const libre = t => t && t.closest && t.closest("input,textarea,select,[contenteditable]");
  for(const ev of ["copy","cut"]) document.addEventListener(ev, e=>{ if(!libre(e.target)) e.preventDefault(); });
  document.addEventListener("contextmenu", e=>{ if(!libre(e.target)) e.preventDefault(); });
  document.addEventListener("dragstart", e=>{ if(e.target && e.target.tagName==="IMG") e.preventDefault(); });
  document.addEventListener("keydown", e=>{ const k=(e.key||"").toLowerCase(); if((e.ctrlKey||e.metaKey) && (k==="p"||k==="s")) e.preventDefault(); });
  // Al salir de la app (cambiar de app, multitarea) se emborrona para que no quede la vista previa
  document.addEventListener("visibilitychange", ()=>document.body.classList.toggle("oculta", document.visibilityState==="hidden"));
  window.addEventListener("blur", ()=>document.body.classList.add("oculta"));
  window.addEventListener("focus", ()=>document.body.classList.remove("oculta"));
})();
function pintarMarca(){
  const el=document.getElementById("marca"); if(!el) return;
  let c=""; try{ c=(localStorage.getItem("recatelo-codigo")||"").replace(/[^A-Z0-9]/g,""); }catch(_){}
  const txt=S.uid&&c ? c : "";
  if(el.textContent!==txt) el.textContent=txt;
}
/* ---------- arranque ---------- */
(function init(){
  // Siempre se abre en Inicio; solo una notificación (?n=1#pestaña) abre otra pestaña
  const h=(location.hash||"").slice(1), desdeAviso=/[?&]n=1/.test(location.search), compartidas=/[?&]compartir=1/.test(location.search);
  S.tab = desdeAviso && TABS.some(t=>t.id===h) ? h : "inicio";
  try{ history.replaceState(null,"",location.pathname+"#"+S.tab) }catch(e){}
  renderTabs(); render(); paintLogo();
  if(!window.claude || !window.claude.use){ S.noDb=true; render(); return; }
  const userP = claude.use("user").then(async u=>{ S.user=u; if(u){ try{ S.canEdit = !!(await u.canEdit()); }catch(e){} try{ S.uid = await u.id(); }catch(e){} render(); } });
  claude.use("assets").then(a=>{ S.assets=a; });
  claude.use("db").then(db=>{
    if(!db){ S.noDb=true; render(); return; }
    S.db=db;
    db.collection("items").onSnapshot(snap=>{
      const rows = snap.docs.map(d=>{ const r={id:d.id, ...d.data()}; const n=ALB_MOVER[r.album]; if(r.section==="fotos"&&n&&!((r.createdAt||"")>"2026-10-23T10:00")&&!((r.updatedAt||"")>"2026-10-23T10:00")){ if(r.title===r.album) r.title=n; r.album=n; } return r; });
      S.items = [...rows, ...SEMILLAS.filter(s=>!rows.some(r=>r.id===s.id))].filter(i=>i.section!=="_borrado");
      S.loaded = true; renderDatos();
    }, ()=>{ S.loaded=true; render(); });
    db.doc("config/ajustes").onSnapshot(snap=>{ S.logo = snap.exists ? (snap.data().logo||DEFAULT_LOGO) : DEFAULT_LOGO; S.estatutos = snap.exists ? (snap.data().estatutos||null) : null; paintLogo(); renderDatos(); },()=>{});
    db.collection("mercadillo").onSnapshot(snap=>{ S.mercAll=snap.docs.map(d=>({uid:d.id,...d.data()})); renderTabs(); renderDatos(); },()=>{});
    db.collection("fotosocios").onSnapshot(snap=>{ S.fotoSoc=snap.docs.map(d=>({uid:d.id,...d.data()})); renderDatos(); },()=>{});
    if(compartidas && window.caches) userP.then(recibirCompartidas);
    startInc(); userP.then(startApoyos); userP.then(startVotos); userP.then(startCuotas); userP.then(startLecturas); userP.then(registrarEntrada); userP.then(()=>registrarPestana(S.tab));
    userP.then(startBuzon); userP.then(startLot); userP.then(startInsc); userP.then(startFicha); userP.then(startConsent);
  });
})();
</script>
