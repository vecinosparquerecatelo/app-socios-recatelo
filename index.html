<h3>TITULO I: DENOMINACIÓN Y RÉGIMEN DE LA ASOCIACIÓN</h3>

<h4>Artículo 1º.-</h4>
<p>1.- Al amparo del artículo 22 de la Constitución Española y de la Ley Orgánica 1/2002, de 22 de marzo, reguladora del derecho de asociación y demás legislación aplicable, se constituye con sede en Lugo y con la denominación de <strong>Asociación de Vecinos Parque de Rosalía de Castro-Recatelo</strong>, Asociación que carece de ánimo de lucro.</p>

<p>Esta Asociación tiene personalidad jurídica propia y plena capacidad de obrar, pudiendo realizar todos aquellos actos que sean necesarios para el cumplimiento de la finalidad para la que fue creada, siempre con sujeción a lo dispuesto en el ordenamiento jurídico.</p>

<p>2.- El funcionamiento de la Asociación estará regulado por los presentes estatutos y los acuerdos válidamente adoptados por su Asamblea General y órganos directivos, dentro de la esfera de su respectiva competencia. En lo no previsto se estará a lo establecido en la Ley Orgánica 1/2002, de 22 de marzo, reguladora del Derecho de Asociación.</p>
<p>3. Esta asociación se constituye por tiempo indefinido y seguirá en todo momento los principios democráticos contenidos en el marco de la Constitución y el resto del ordenamiento jurídico.</p>

<h3>TITULO II. FINES Y ACTIVIDADES DE LA ASOCIACIÓN</h3>

<h4>Artículo 2º.- Fines.</h4>
<p><strong>1. <u>Son fines de esta Asociación:</u></strong></p>
<p>1º) La representación y defensa de los intereses generales y comunes de los asociados.</p>
<p>2º) Informar a los asociados y difundir entre todos ellos, todo aquello que pueda ser de interés para la asociación y sus miembros y que guarde relación con los fines y objetivos de la misma.</p>



<p>3º) Promocionar la participación activa de todos los asociados en el desarrollo de los fines de la asociación, así como en la ejecución de todas las actividades o acciones que la asociación desarrolle relacionadas con tales fines, promoviendo asimismo la mutua cooperación y colaboración entre todo ellos para alcanzar los objetivos propuestos por la asociación.</p>
<p>4º) Actuar como interlocutora ante las distintas administraciones públicas y en representación de los vecinos integrados en la asociación, para la tutela y defensa de sus intereses mutuos y generales relacionados con los fines propios de la asociación y con las actuaciones comunes que la misma lleve a cabo, así como para la realización de las acciones necesarias ante los organismos pertinentes, para el buen desarrollo y ejecución de los fines de esta asociación, así como de todos los acuerdos válidamente adoptados por ésta y según lo dispuesto en estos estatutos, y para el fomento y desarrollo de cuantas acciones y actuaciones sean precisas para alcanzar dichos fines, y cualquier otro relacionado con los mismos y que redunde en beneficio de la zona de actuación fundamental de la asociación y de toda la localidad de Lugo.</p>
<p>5º) Presentación de iniciativas-propuestas y la propuesta de firma de acuerdos o convenios con y ante las administraciones públicas y autoridades competentes, que sean acordadas por los socios, y que estén dirigidas en todo momento a la consecución de los fines de esta asociación, a la ejecución de los acuerdos adoptados por la misma para la promoción e incentivación de la mejora en la prestación y gestión de los servicios públicos en la zona y en toda la localidad, y para el fomento de la realización de todo tipo de actuaciones y acciones por parte de los servicios públicos, que redunden en beneficio de todos los vecinos y asociados.</p>
<p>6º) Promover y gestionar ante los órganos y autoridades competentes y en nombre y representación de todos los asociados, <u>la realización de todas aquellas actuaciones que</u> <u>sean precisas para la adecuada gestión, mantenimiento y mejora por parte de dichos</u> <u>organismos y autoridades competentes,</u> de forma prioritaria en la zona que abarca el ámbito de actuación de la asociación, y de forma secundaria y subsidiaria en todas las calles de la ciudad que puedan precisarlo, <u>de la situación actual de los siguientes</u> <u>servicios públicos:</u> Regulación del tráfico en general en toda la localidad, y de forma particular en la zona del ámbito de actuación de esta asociación, especialmente en cuanto al planteamiento de una redistribución de la reserva de plazas de aparcamiento para los organismo públicos establecidos en dicha zona, ya que el número de reservas es excesivo y perjudica enormemente a los vecinos de la zona, así como mejora de los viales y el asfaltado en la zona y en toda la localidad; Mejora de la situación actual de parques y jardines; Mejora del servicio de recogida de basuras y limpieza; Solución de problemas del alumbrado así como de ruidos y contaminación ambiental en la zona, especialmente durante la celebración de fiestas populares que causan numerosos problemas de habitabilidad y convivencia a los vecinos, vulnerándose a menudo la normativa local de protección frente a la contaminación acústica y ambiental; Mejora en las actuaciones de las autoridades competentes en cuanto a la prevención del vandalismo en la zona y en toda la localidad y en todas sus manifestaciones</p>



<p>7º) Incentivar la realización de acciones que favorezcan la convivencia pacífica en el vecindario, promoviendo valores de igualdad, tolerancia, respeto hacia otras creencias o forma de vida diferentes, e igualdad de trato para todos los vecinos independientemente de su condición personal o social, o su forma de pensar y vivir, respetando en todo momento los derechos individuales de cada vecino, siempre y cuando se respeten en todo momento los derechos y deberes conjuntos de toda la comunidad.</p>
<p>8º) Fomento de la realización de actividades culturales, lúdicas y recreativas de todo tipo, para mayores y niños, en épocas concretas y significativas del año, tales como Navidad, Carnavales, Samaín, Fiestas Patronales destacadas (recuperación de la Fiesta de las Dolores que ha dejado de celebrarse, y era valorada muy positivamente por la ciudadanía en general), etc…. las cuales favorecen la convivencia de todos los vecinos, además de incentivar las visitas a nuestra localidad e incentivar el turismo, lo cual redunda en beneficio de los negocios locales incentivando así nuestra economía, y beneficia asimismo a todos los vecinos.</p>
<p>Así pues, estas actividades pueden consistir en <u>mercadillos, conciertos al aire libre o</u> <u>en locales habilitados a tal fin, obras de teatro, campeonatos de ajedrez, billar,</u> <u>petanca y otros juegos populares similares, así como campeonatos de cualquier</u> <u>deporte; realización de talleres de variadas temáticas que puedan interesar a la</u> <u>ciudadanía; actuaciones de magia;cantos de taberna, monólogos de humor;teatro;</u> <u>exposiciones culturales de todo tipo; cine al aire libre; charlas sobre temas de interés;</u> <u>concursos o certámenes de fotografía; actuaciones para los más pequeños como</u> <u>títeres, cuentacuentos, ciclos de películas específicos para ellos; convocatoria de</u> <u>campeonatos de parkour, skate, y otras actividades de interés para los más jóvenes,</u> <u>que incentiven su interés por el deporte y la vida sana y al aire libre; promover la</u> <u>fundación de clubs de lectura, de escritura creativa, de senderismo, y en general, de</u> <u>cualquier actividad que fomente la convivencia pacífica, la participación activa de los</u> <u>vecinos en la comunidad, prestando especial atención a colectivos desfavorecidos e</u> <u>incentive los valores de respeto, tolerancia e igualdad de todos y para todos,</u> <u>promocionando en todo momento la cultura, la creatividad, y todas aquellas</u> <u>actividades que incentiven un estilo de vida sano y beneficioso para todos, de forma</u> <u>individual y colectiva.</u></p>
<p>9º) Fomento de actuaciones que incentiven el turismo en Lugo, presentando propuestas e iniciativas a los organismos competentes, para la realización de acciones que promocionen especialmente nuestras señas de identidad y los valores que caracterizan nuestra comunidad, poniendo en alza, difundiendo y publicitando todo aquello que nuestra ciudad puede ofrecer a los visitantes foráneos, tanto desde el punto de vista de nuestro importante patrimonio cultural y arquitectónico, como en cuanto a costumbres propias de nuestra localidad, como por ejemplo el ofrecer una “tapa” gratis con cada consumición, lo cual hacen casi todas cafeterías, bares, restaurantes y locales del ramo hostelero de nuestra ciudad, y que es algo que gusta mucho a nuestros visitantes; todo ello a fin de atraer un mayor número de turistas al</p>



<p>año, lo cual beneficia a la economía local y en consecuencia, a todos los vecinos de la localidad.</p>
<p>10º) Presentación de iniciativas y propuestas, y realización de actuaciones para la promoción preferente y primordial de nuestro importante patrimonio histórico, cultural y artístico, así como para la adecuada preservación y conservación del mismo, y la mejora en la medida de lo posible la gestión del cuidado del mismo, ya que es uno de nuestros más importantes valores y debe ser por tanto prioritario para nuestros representantes, su adecuado cuidado y conservación en las mejores condiciones, ya que ello es fundamental para toda la ciudadanía y para la promoción del turismo.</p>
<p>11º) Presentación de iniciativas y propuestas, y realización de actuaciones para el fomento de acciones por parte de los servicios públicos competentes, de acciones para la conservación y protección del Medio Ambiente –soterramiento de contenedores de recogida selectiva de basura, implantación del aparcamiento y la bicicleta eléctrica, puntos de recarga de automóviles eléctricos o pila de combustible…etc.</p>
<p>Promoviendo asimismo entre todos los vecinos, la necesaria concienciación para contribuir activamente, tanto de forma individual y colectiva, como miembros de la comunidad, en la realización de dichas acciones de protección y preservación del Medio Ambiente, fomentando una mayor involucración, y un incremento de la participación de todos los vecinos en actuaciones y medidas de protección medioambiental.</p>
<p>12º) Promover la realización de acuerdos con otras asociaciones y los negocios particulares dedicados al ocio la cultura, el deporte y el entretenimiento en nuestra ciudad, tales como cines, locales de conciertos, agencias de viaje, negocios de entretenimiento de los niños, el rokodromo, natación, la escuela de hípica etc…..para lograr ventajas o mejores condiciones para los asociados en la utilización de los servicios que ofertan estos negocios, que se ven también beneficiados de dichos acuerdos dado que la asociación aportaría un gran número de clientes a sus negocios a cambio de obtener mejoras o ventajas que les impulsen al uso de dichos servicios.</p>
<p>13º) Participar activamente con otras organizaciones, grupos y/o administraciones a través de programas de ayuda o subvención y/o redes de cooperación con el fin de conseguir el beneficio y la mejora de la asociación y de sus miembros.</p>
<p>14ª) Desarrollo de actividades, promociones y proyectos dirigidos a la sensibilización y utilización de las nuevas tecnologías, promoviendo e impulsando estas entre los socios de la Asociación y que asimismo redunden en el interés general de la ciudadanía.</p>
<p>15ª) Vigilar y exigir que las condiciones del solar abandonado(y de las casas en ruinas del mismo), con entrada por la calle Ciudad de Vivero, no supongan ningún tipo de problema para la salud vecinal y pública en general.</p>
<p>16º) Así mismo la Asociación quiere reconocer,expresamente, a los animales domésticos como “Seres Sintientes” y realizar ,para ello, actividades para su plena integración en la comunidad vecinal.</p>


<h3>TITULO III. DOMICILIO Y ÁMBITO TERRITORIAL</h3>

<h4>Artículo 3º.- Domicilio.</h4>
<p>Esta Asociación tendrá su domicilio social en el Concello de Lugo (Provincia de Lugo), y su estará situado en la Rúa Pascual Veiga, 6, 27002 Lugo.</p>
<p>En caso de cambio de domicilio social, se acordará por acuerdo de la Junta Directiva ratificado por la Asamblea General y se comunicará a los organismos pertinentes dicha modificación.</p>
<h4>Artículo 4º.- Ámbito Territorial.</h4>
<p>. El ámbito territorial de esta Asociación es local, ya que la misma desarrollará sus fines y actividades dentro de la localidad de Lugo y fundamentalmente y más concretamente en la zona del <strong>Parque de Rosalía de Castro y Recatelo,</strong> incluyendo asimismo en su ámbito principal de actuación, las siguientes calles de la zona antedicha: PASCUAL VEIGA, DOUTOR GARCÍA PORTELA, RIBADEO, VILLALBA, CARRIL DOS LOUREIROS, RECATELO Y CARRIL RECATELO, ISAAC DIAZ PARDO, ARMANDO</p>



<p>DURÁN, MOURELO, PURO CORA, CIDADE DE VIVEIRO, AVELINO POUSA ANTELO, SANTIAGO Y ZONA PUERTA DE SANTIAGO,FRAY PLÁCIDO Y VILLA DE SARRIA.</p>
<p><u>Todos los asociados podrán ser miembros de la Junta Directiva de esta asociación,; elegidos según lo descrito en los presentes estatutos en su apartado</u> <u>correspondiente,</u> <u>si bien, podrán formar parte de la asociación vecinos de otras calles</u> <u>de la ciudad de Lugo, que puedan estar interesados en participar en las actuaciones</u> <u>que desarrolla esta asociación de forma general en beneficio de todos los vecinos de la</u> <u>localidad y de toda la ciudadanía lucense, y de forma más particular y concreta, de los</u> <u>vecinos de la zona y las calles detalladas en el apartado anterior.</u></p>
<p>Pero también podrán formar parte de la misma según lo descrito en el Título siguiente, todos aquellos vecinos de Lugo que estén interesados en participar, colaborar, aportar propuestas o iniciativas que redunden en beneficio de toda la ciudadanía y a todos los vecinos de la localidad de Lugo, especialmente en lo que refiere a actuaciones dirigidas a la protección y defensa del patrimonio histórico, natural-paisajístico, cultural y arquitectónico de la localidad: Parque de Rosalía de Castro; Camino de Santiago; Casco antiguo; Río Miño y su entorno; Muralla Romana; Termas; Catedral…etc.</p>

<h3>TITULO IV. PERSONAS ASOCIADAS</h3>

<h4>Artículo 5º: Adquisición de la condición de asociado</h4>
<p>1. Para adquirir la condición de persona asociada, es necesario ser vecino de una de las calles o de la zona referida en el ámbito territorial de estos estatutos prioritariamente, o ser vecino de la localidad de Lugo de forma general pudiendo todos los socios ser elegidos como miembros de la Junta Directiva,y <u>podrán</u> <u>participar en la Asamblea General con voz y voto.</u></p>
<p>2. Las personas físicas miembros de esta asociación deben ser mayores de edad.</p>
<p>3. Las personas jurídicas para poder integrarse en esta asociación, requerirán presentar documentación acreditativa de la persona o personas que actuarán en nombre y representación de la asociación en todos los actos de la misma.</p>
<h4>Artículo 6º.- Clases de socios.</h4>



<p>Dentro de la Asociación existirán las siguientes clases de socios:</p>
<p>a) Socios fundadores, que serán aquellos que participen en el acto de constitución de la Asociación.</p>
<p>b) Socios de número, que serán los que ingresen después de la constitución de la Asociación.</p>
<p>c) Socios de honor, los que por su prestigio o por haber contribuido de modo relevante a la dignificación y desarrollo de la Asociación, se hagan acreedores a tal distinción. El nombramiento de los socios de honor corresponderá a la Junta Directiva o Asamblea General.</p>
<h4>Artículo 7. Pérdida de la condición de persona asociada</h4>
<p>1. La condición de persona asociada se perderá:</p>
<p>a) Por voluntad propia, que será efectiva mediante la presentación de renuncia, por escrito ante la junta directiva de la asociación, dirigida a la secretaría general de la asociación. La renuncia tendrá efectos desde la fecha da su presentación.</p>
<p>b) Por falta de pago de las cuotas que dan derecho a pertenecer a la asociación y al disfrute de todos sus servicios y como socio de pleno derecho de la misma. Las cuotas serán las que acuerde la asociación en la Asamblea General correspondiente y según lo dispuesto en los presentes estatutos. Esta pérdida del derecho de socio, será efectiva desde la notificación fehaciente a la persona interesada, del acuerdo de pérdida de la condición de asociado por impago de cuotas, adoptado a tales efectos por la junta directiva de la asociación. Las personas que pierdan su condición de asociados por esta causa, podrán ser rehabilitados en caso de que en un plazo de 6 meses desde su expulsión de la asociación, abonen las cuotas pendientes de pago.</p>
<p>c) Por incumplimento de los presentes estatutos o de los acuerdos válidamente adoptados por los órganos de la asociación, así como por la realización de acciones que perjudiquen gravemente los intereses de ésta o de algún miembro de la misma, siempre y cuando sea demostrable la realización de estas acciones por el asociado a fin de privarle de su condición y derechos como socio.</p>
<p>d) Por fallecimiento de la persona física o extinción de la persona jurídica. 7</p>
<p>2.- La expulsión de personas asociadas en los casos supuestos dos apartados b) y c) del párrafo anterior, será acordada por la Junta Directiva, después de celebrar audiencia con la persona interesada. El acuerdo de expulsión, deberá ser ratificado por Asamblea General extraordinaria, y contra su resolución, el interesado podrá recurrir ante la jurisdicción ordinaria.</p>
<h4>Artículo 8. Derechos de los asociados</h4>
<p>a) Participar en las actividades de la asociación</p>
<p>b) Ser electores y elegibles para los cargos de los órganos de goberno de esta</p>
<p>asociación</p>
<p>c) Participar en las Asambleas Generales de la asociación con voz y voto.</p>
<p>d) Recibir información de la composición de los órganos de representación de la asociación, del estado de cuentas y del desarrollo de sus actividades</p>
<p>e) Acceder para su consulta, a la documentación propia de la asociación a través de sus órganos de representación.</p>
<p>f) Ser oídas con carácter previo a la adopción de medidas disciplinarias contra ellos, así como a ser informados de todos los hechos que dieron lugar a dichas medidas, debiendo motivarse el acuerdo que, en seu caso, imponga dicha sanción</p>
<p>g) Impugnar los acuerdos de los dos órganos de asociación que estime contrarios a la ley o a los estatutos.</p>
<p>2. No podrán ejercer ninguno de estos derechos los asociados que no estén al día en el pago de las cuotas de la asociación.</p>
<h4>Artículo 9. Obligaciones de los asociados</h4>
<p>a) Cumplir los presentes estatutos de los acuerdos válidamente adoptados por los órganos de gobierno y representación de la asociación.</p>



<p>b) Pagar las cuotas que se establezcan.</p>
<p>c) Desempeñar en su caso, las obligaciones inherentes a los cargos que ocupan y para los que hayan sido elegidos</p>
<p>d) Asistir a las Asambleas y demás actos organizados por la asociación.</p>

<h3>TITULO V. ÓRGANOS DE GOBIERNO Y REPRESENTACIÓN</h3>
<h3>CAPÍTULO I. CLASES Y DENOMINACIÓN</h3>

<h4>Artículo 10º.- Clases y principios.</h4>
<p>1. Los órganos de gobierno y representación de la Asociación son: a) La Asamblea General</p>
<p>b) La Junta Directiva.</p>
<p>c) Secciones: por acuerdo de la Asamblea General podrán organizarse en la Asociación aquellas Secciones que se estimen convenientes para el mejor cumplimiento de los fines de la misma.</p>
<p>2. La organización interna y funcionamiento de la asociación deberá ser democrático, con pleno respeto al pluralismo.</p>

<h3>CAPÍTULO II. ASAMBLEA GENERAL</h3>

<h4>Artículo 11º.- Composición.</h4>
<p>La Asamblea General es el órgano supremo de gobierno de la Asociación y está integrada por todos los asociados.</p>
<h4>Artículo 12º.- Clases de Sesiones.</h4>
<p>Las reuniones de la Asamblea General serán ordinarias y extraordinarias.</p>
<p>- La Asamblea General Ordinaria se reunirá necesariamente al menos una vez al año, dentro de los cuatro meses siguientes al cierre del ejercicio.</p>



<p>- Las Asambleas Generales Extraordinarias se celebrarán cuando las circunstancias lo aconsejen, a juicio del Presidente, cuando la Directiva lo acuerde o cuando lo proponga por escrito una décima parte de los asociados.</p>
<h4>Artículo 13º.- Convocatoria</h4>
<p>Las convocatorias de las Asambleas Generales se realizarán por medios telemáticos, expresando el lugar, día y hora de la reunión así como el orden del día con expresión concreta de los asuntos a tratar. Entre la convocatoria y el día señalado para la celebración de la Asamblea en primera convocatoria habrán de mediar al menos quince días, pudiendo asimismo hacerse constar si procediera la fecha y hora en que se reunirá la Asamblea en segunda convocatoria, sin que entre una y otra pueda mediar un plazo inferior a una hora.</p>
<h4>Artículo 14º.- Quórum de asistencia y votaciones.</h4>
<p>Las Asambleas Generales, tanto ordinarias como extraordinarias, quedarán válidamente constituidas en primera convocatoria cuando concurran a ella un tercio de los asociados con derecho a voto, y en segunda convocatoria cualquiera que sea el número de asociados con derecho a voto. Será necesaria en todo caso la presencia del Presidente y Secretario, o de las personas que legalmente les sustituyan.</p>
<p>Los acuerdos se tomarán por mayoría simple de las personas presentes o representadas cuando los votos afirmativos superen a los negativos, no siendo computables a estos efectos los votos en blanco ni las abstenciones.</p>
<p>Será necesario mayoría cualificada de las personas presentes o representadas, que resultará cuando los votos afirmativos superen la mitad de éstas, para:</p>
<p>a) Nombramiento de las Juntas Directivas y Administradores.</p>
<p>b) Acuerdo para constituir una Federación de Asociaciones o integrarse en ellas.</p>
<p>c) Disposición o enajenación de bienes integrantes del inmovilizado. d) Modificación de estatutos.</p>
<p>e) Disolución de la entidad.</p>
<p>f) Acuerdo sobre compensación/remuneración de los miembros de los órganos de representación; si así se considerase necesario por razón y ejercicio en el cargo.</p>
<h4>Artículo 15º.- Competencias.</h4>
<p>1. Son competencia de la Asamblea General Ordinaria los asuntos siguientes: a) Aprobar, en su caso, la gestión de la Junta Directiva.</p>
<p>b) Examinar y aprobar las cuentas anuales.</p>



<p>c) Resolver sobre la aprobación del inventario anual de bienes muebles e inmuebles cuya valoración detallada de los mismos será realizada por el miembro de la Junta Directiva previamente designado por esta última.</p>
<p>d) Aprobar o rechazar las propuestas de las Juntas Directivas en orden a las actividades de la Asociación.</p>
<p>e) Acordar los gastos que hayan que atenderse con cuotas extraordinarias y su establecimiento, así como los de las cuotas ordinarias, fijar la cuantía de éstas y su periodicidad.</p>
<p>f) Cualquier otra que no sea de la competencia exclusiva de la Asamblea Extraordinaria.</p>
<p>2. Corresponde a la Asamblea General Extraordinaria:</p>
<p>a) Nombramiento y revocación de los miembros de la Junta Directiva. b) Modificación de los Estatutos.</p>
<p>c) Disolución de la Asociación y, en su caso, nombramiento de liquidadores. d) Expulsión de socios, a propuesta de la Junta Directiva.</p>
<p>e) Constitución de Federaciones o integración en ellas.</p>
<p>f) Solicitud de declaración de utilidad pública.</p>
<h4>Artículo 16º.- Obligatoriedad de los acuerdos</h4>
<p>Los acuerdos adoptados conforme a los preceptos anteriores obligarán a los socios, incluso a los no asistentes, llevándose a un libro de actas que firmará el Presidente y el Secretario General.</p>

<h3>CAPÍTULO VI. JUNTA DIRECTIVA</h3>

<h4>Artículo 17º.- Composición.</h4>
<p>La Asociación será gestionada y representada por una Junta Directiva formada por: un Presidente, un Vicepresidente, un Secretario General, un Tesorero y un vocal (en su caso).</p>

<p>Todos los cargos que componen la Junta Directiva serán <em>gratuitos (salvo que se</em></p>

<p><em>disponga otra cosa en los Estatutos y que conste en las cuentas anuales aprobadas en Asamblea. Art. 11.5 LO 1/2002)</em>. Estos serán designados y revocados por la Asamblea General Extraordinaria<sup>1</sup>.</p>
<p>Podrán causar baja:</p>
<p>- Por renuncia voluntaria comunicada por escrito a la Junta Directiva. <em>-</em> Por incumplimiento de las obligaciones que tuvieran encomendadas. <em>-</em> Por expiración del mandato.</p>
<h4>Artículo 18º. Elección de cargos.</h4>
<p>1.- Los cargos de la Junta Directiva, tendrán una duración de 1 año, pudiendo ser reelegidos sus miembros al finalizar su mandato<em>.</em></p>
<p>2.- La elección se efectuará por la Asamblea General mediante votación. Podrán Ser elegidos como miembros de la Junta Directiva todos los asociados-</p>

<p>3.- Las vacantes que pudieran producirse en la Junta, se cubrirán provisionalmente por designación de la Junta Directiva, hasta la celebración de la Asamblea General, que elegirá a los nuevos miembros o confirmará a los designados provisionalmente.</p>

<p><em>. Para ser miembros de la Junta Directiva es necesario ser mayor de edad, estar en pleno uso de los derechos civiles y no estar incurso en los motivos de incompatibilidad establecidos en la legislación vigente .</em></p>
<p><em>(Art.11.4 LO 1/2002)</em></p>
<h4>Artículo 19º.- Sesiones.</h4>



<p>La Junta Directiva celebrará sesión cuando lo determine el Presidente, por iniciativa propia o a petición de alguno de sus miembros.</p>
<p>Quedará constituida cuando asista la mitad más uno de sus miembros y para que sus acuerdos sean válidos deberán ser tomados por mayoría de votos. En caso de empate, el voto del Presidente será de calidad.</p>
<p>Cuando la Junta Directiva lo estime procedente por la índole de la materia a tratar en la sesión, podrán ser invitados a tomar parte en sus deliberaciones como asesores cualificados, pero sin voto, profesionales o especialistas para clarificar asuntos concretos que figuren en el orden del día.</p>
<p>De las sesiones levantará acta el Secretario General, con el visto bueno del Presidente y la reflejará en el libro de actas.</p>
<h4>Artículo 20º: Competencias.</h4>
<p>Las facultades de la Junta Directiva se extenderán, con carácter general a todos los actos propios de las finalidades de la asociación, siempre que no requieran, según estos Estatutos, autorización expresa de la Asamblea General.</p>
<p>Son facultades particulares de la Junta Directiva:</p>
<p>a) Dirigir las actividades sociales y llevar la gestión económica y administrativa de la Asociación, acordando realizar los oportunos contratos y actos en el periodo entre Asambleas.</p>
<p>b) Ejecutar los acuerdos de la Asamblea General.</p>
<p>c) Formular y someter a la aprobación de la Asamblea General los Balances y las Cuentas anuales.</p>
<p>d) Dar cuenta de su actividad a la Asamblea General.</p>
<p>e) Resolver sobre la admisión de nuevos asociados.</p>
<p>f) Nombrar delegados para alguna determinada actividad de la Asociación. g) Cualquier otra facultad que no sea de la exclusiva competencia de la Asamblea General de socios.</p>
<h4>Artículo 21º.- Presidente. Competencias.</h4>
<p>Son atribuciones del Presidente de la Asociación:</p>
<p>a) Ostentar la representación legal de la Asociación ante toda clase de organismos públicos o privados.</p>
<p>b) Convocar, presidir y levantar las sesiones que celebre la Asamblea General y la Junta Directiva, así como dirigir las deliberaciones de una y otra.</p>
<p>c) Ordenar los pagos por cuenta de fondos de la Asociación, previos a los acuerdos de gastos correspondientes.</p>
<p>d) Autorizar con su firma los documentos, actas y correspondencia. 13</p>
<p>e) Adoptar cualquier medida urgente que la buena marcha de la Asociación aconseje o en el desarrollo de sus actividades resulte necesaria o conveniente, sin perjuicio de dar cuenta posteriormente a la Junta Directiva.</p>
<p>f) Velar por los fines de la Asociación y su cumplimiento.</p>
<h4>Artículo 22º.- Vicepresidente. Competencias.</h4>
<p>Son facultades del Vicepresidente:</p>
<p>a) Sustituir al Presidente en caso de ausencia, enfermedad o cese. b) Las que delegue el Presidente o le atribuya la Asamblea General.</p>
<h4>Artículo 23º.- Secretario General. Competencias.</h4>
<p>El Secretario General tendrá a cargo la dirección de los trabajos puramente administrativos de la Asociación, expedirá certificaciones, llevará los libros de la asociación que sean legalmente establecidos y el fichero de asociados, y custodiará la documentación de la entidad, haciendo que se cursen a las comunicaciones sobre designación de Juntas Directivas y demás acuerdos sociales inscribibles a los Registros correspondientes, así como la presentación de las cuentas anuales y el cumplimiento de las obligaciones documentales en los términos que legalmente correspondan.</p>
<h4>Artículo 24º.- Tesorero. Competencias.</h4>
<p>Corresponde al Tesorero:</p>
<p>a) Recaudar y custodiar los fondos de la Asociación y llevar en orden los libros de Contabilidad.</p>
<p>b) Preparar los balances y presupuestos de la Asociación para su aprobación por la Asamblea General.</p>
<p>c) Dar cumplimiento a las órdenes de pago que expida el Presidente. d) Llevar inventario de bienes, si los hubiera.</p>
<h4>Artículo 25º.- Vocales. Competencia.</h4>



<p>Los vocales tendrán las obligaciones propias de su cargo como miembros de la Junta Directiva, y así como las que nazcan de las delegaciones o comisiones de trabajo que la propia Junta las encomiende.</p>

<h3>CAPÍTULO IV. RÉGIMEN ECONÓMICO Y PATRIMONIAL</h3>

<h4>Artículo 26º.- Patrimonio.</h4>
<p>La Asociación no cuenta con patrimonio fundacional o fondo social inicial.</p>
<h4>Artículo 27º.- Ingresos.</h4>
<p>Los recursos de la Asociación están constituidos por:</p>
<p>1.- Las cuotas (ordinarias o extraordinarias) de los socios.</p>
<p>2.- Los donativos o aportaciones que reciba.</p>
<p>3.- Las herencias o legados que pudiera recibir de forma legal por parte de los asociados o de terceras personas.</p>
<p>4.- Las subvenciones, ayudas y auxilios que reciba de la Administración estatal, regional, provincial o municipal, así como las que la conceden otras instituciones de carácter privado (fundaciones, otras asociaciones, etc.).</p>
<p>5.- Cualquier otro recurso lícito.</p>
<h4>Artículo 28º.- Cuotas.</h4>
<p>1.- Las cuotas ordinarias o extraordinarias se establecerán por la Asamblea General, a propuesta de la Junta Directiva, y no son reintegrables en caso alguno.</p>
<p>2.- Para la admisión de nuevos socios, podrá ser fijada por la Asamblea General, como aportación inicial, no reintegrable, una cuota de admisión.</p>
<h4>Artículo 29º.- Obligaciones documentales y contables:</h4>
<p>1. La asociación ha de disponer de una relación actualizada de sus asociados, llevar una contabilidad que permita obtener la imagen fiel del patrimonio, del resultado y de la situación financiera de la entidad, así como las actividades realizadas, efectuar</p>



<p>un inventario de sus bienes y recoger en un libro las actas de las reuniones de sus órganos de gobierno y representación. Deberán llevar su contabilidad conforme a las normas específicas que les resulten de aplicación.</p>
<p>2. Las cuentas de la asociación se aprobarán anualmente por la Asamblea General.</p>
<p>3. El ejercicio asociativo y económico será anual y su cierre tendrá lugar el 31 de diciembre de cada año.</p>

<h3>CAPÍTULO V. DISOLUCIÓN Y LIQUIDACIÓN DE LA ASOCIACIÓN.</h3>

<h4>Artículo 30º.-</h4>
<p>La asociación se disolverá:</p>
<p>a) Voluntariamente cuando así lo acuerde la Asamblea General Extraordinaria, convocada al efecto, por un número de asociados no inferior al 10%. El acuerdo sobre la disolución requerirá mayoría cualificada de las personas presentes o representadas, que resultará cuando los votos afirmativos superen la mitad. <em>(Art. 12 LO 1/2002)</em></p>
<p>b) Por las causas determinadas en el artículo 39 del Código Civil.</p>
<p>c) Por sentencia judicial firme.</p>
<h4>Artículo 31º.-</h4>
<p>En caso de disolución, se nombrará una comisión liquidadora la cual, una vez extinguidas las deudas, y si existiese sobrante líquido lo destinará para fines que no desvirtúen su naturaleza no lucrativa .</p>

<h3>CAPITULO VI. REFORMA DE LOS ESTATUTOS</h3>

<h4>Artículo 32º.- Reforma de los Estatutos.</h4>
<p>Las modificaciones de los presentes Estatutos será de competencia de la Asamblea General Extraordinaria, adoptándose el acuerdo por mayoría cualificada de las personas presentes o representadas, que resultará cuando los votos afirmativos superen la mitad de los asistentes.</p>



<p>Las modificaciones que se realicen se comunicarán al Registro correspondiente.</p>
<h3>DISPOSICIÓN ADICIONAL</h3>
<p>En todo cuanto no esté previsto en los presentes Estatutos se aplicará la vigente Ley Orgánica 1/2002, de 22 de marzo, reguladora del Derecho de Asociación, y las Disposiciones Complementarias.</p>

/* Quita las franjas negras (o casi negras) de los bordes de una foto. Devuelve null si no hay nada que quitar. */
async function sinBordes(blob){
  if(!blob || !/^image\/(jpe?g|png|webp|heic|heif)/i.test(blob.type||"image/jpeg")) return null;
  let bm; try{ bm = await createImageBitmap(blob, {imageOrientation:"from-image"}); }catch(_){ try{ bm = await createImageBitmap(blob); }catch(__){ return null; } }
  const W=bm.width, H=bm.height, k=Math.min(1, 400/Math.max(W,H)), w=Math.max(1,Math.round(W*k)), h=Math.max(1,Math.round(H*k));
  const c=document.createElement("canvas"); c.width=w; c.height=h; const x=c.getContext("2d",{willReadFrequently:true}); x.drawImage(bm,0,0,w,h);
  let px; try{ px=x.getImageData(0,0,w,h).data; }catch(_){ return null; }
  const osc=(i)=>{ const l=0.3*px[i]+0.59*px[i+1]+0.11*px[i+2]; return l<40; };
  const fila=y=>{ let n=0; for(let i=0;i<w;i++) if(osc((y*w+i)*4)) n++; return n/w>0.96; };
  const col=xx=>{ let n=0; for(let j=0;j<h;j++) if(osc((j*w+xx)*4)) n++; return n/h>0.96; };
  let t=0,b=h-1,l=0,r=w-1;
  while(t<b && fila(t)) t++; while(b>t && fila(b)) b--; while(l<r && col(l)) l++; while(r>l && col(r)) r--;
  const m=1; t=Math.min(h-1,t+(t?m:0)); b=Math.max(0,b-(b<h-1?m:0)); l=Math.min(w-1,l+(l?m:0)); r=Math.max(0,r-(r<w-1?m:0));
  const cw=r-l+1, ch=b-t+1;
  if(cw*ch > w*h*0.97 || cw<w*0.2 || ch<h*0.2) return null;
  const sx=Math.round(l/k), sy=Math.round(t/k), sw=Math.min(W-sx,Math.round(cw/k)), sh=Math.min(H-sy,Math.round(ch/k));
  const o=document.createElement("canvas"); o.width=sw; o.height=sh; o.getContext("2d").drawImage(bm,sx,sy,sw,sh,0,0,sw,sh);
  const out = await new Promise(res=>o.toBlob(res,"image/jpeg",0.9)); bm.close&&bm.close();
  if(!out) return null;
  return new File([out], ((blob.name||"foto").replace(/\.[^.]+$/,""))+".jpg", {type:"image/jpeg"});
}

        <span class="eyebrow">Parque de Rosalía de Castro · Recatelo · Lugo</span>
        <h2>Entre todos, por nuestro barrio</h2>
        <p>Vivimos en uno de los rincones con más carácter de Lugo. Recatelo y el Parque de Rosalía de Castro están en pleno centro, a los pies de la Muralla, y el parque es el gran pulmón verde de la ciudad, con su mirador sobre el valle del Miño.</p>
        <p>Pocos barrios pueden presumir de lo que tenemos alrededor: cuatro patrimonios. La Muralla romana y el Camino Primitivo, los dos Patrimonio de la Humanidad; la Catedral, en ese mismo Camino; y el río Miño, dentro de la Reserva de la Biosfera Terras do Miño.</p>
        <p>Recatelo fue durante generaciones un barrio de paso y de hospedaje. Por aquí entraba en la ciudad quien venía del Puente Romano, y las diligencias de Friol y Portomarín paraban en la Porta de Santiago. Los días de feria, la gente de las aldeas llegaba con sus carros de leña y paja, y se gastaba lo ganado en comida y vino: Recatelo tenía fama de servir el mejor vino de Lugo.</p>
        <p>Casas de comidas como Casa do Bataneiro, El Frade, El Manco o El Rivas hicieron famoso el barrio. A su alrededor trabajaban serrerías, almacenes de bebidas como Casa Mourelle, talleres de bicicletas y tiendas de toda la vida. Ese espíritu emprendedor sigue vivo en la hostelería que hoy llena de vida nuestras calles.</p>
        <p>Por eso creemos que la zona tiene unas posibilidades inmensas, para vivir, para pasear y para recibir a quien nos visita. La asociación nació entre muchos vecinos para cuidarla y sacarla adelante. Nos sentamos con el Concello, con la Xunta de Galicia, con la Diputación Provincial de Lugo, con los grupos políticos, con la Subdelegación del Gobierno y con las fuerzas y cuerpos de seguridad de la ciudad, como la Policía Nacional, la Local y la Autonómica. Toda institución que se interese por el barrio es bienvenida, siempre que no lo use para sus fines políticos.</p>
        <p>En septiembre de 2023 recuperamos las antiguas fiestas del barrio en el Templete del Parque, y desde entonces las Festas de Recatelo son nuestra excusa para saludarnos y charlar entre vecinos. Y a lo largo del año echamos una mano a la Protectora de Animales, Asociación Capaces, Michos y la Asociación Española Contra el Cáncer.</p>
        ${S.uid && !S.canEdit && !(S.consent&&S.consent.acepta) ? `<div class="notice">Antes de empezar, revisa y acepta la <a href="#privacidad" data-go="privacidad">protección de datos</a>.</div>` : ""}
        ${S.uid && !S.canEdit && !S.ficha ? `<div class="notice">¿Eres socio/a? <a href="#misdatos" data-go="misdatos">Déjanos tus datos y tu prioridad para el barrio</a>.</div>` : ""}
        <p>Esta app es de todos los socios: aquí encontrarás los avisos, los cursos, el Mercadiño, las reuniones, las sugerencias y las fotos de lo que vamos haciendo. Y como siempre, quedamos a vuestra disposición para cualquier sugerencia, duda o apunte.</p>
        <p class="firma">Junta Directiva</p></section>

  bic(){

    return `<div><h2>Parque Rosalía BIC</h2><p class="lead">Desde la asociación pedimos que el Parque de Rosalía de Castro sea declarado Bien de Interés Cultural (BIC), la máxima protección que reconoce la Ley 5/2016, de 4 de mayo, del patrimonio cultural de Galicia.</p><p class="lead">El Parque de Rosalía es mucho más que un parque: es parte de la vida de Lugo. Aquí han jugado, paseado y se han enamorado varias generaciones de lucenses, y muchas familias guardan en él sus recuerdos más queridos. Por eso la asociación se ha empeñado en protegerlo e insiste ante las instituciones en su protección, empezando por que lo declaren BIC, para que nuestros hijos y nietos lo reciban tal y como lo conocimos.</p><p class="lead">El parque y el barrio de Recatelo están unidos desde su origen: las primeras obras del parque se hicieron en las tierras junto a Recatelo. Por eso nuestra asociación une los dos nombres, Parque de Rosalía de Castro y Recatelo, y defiende la zona como un todo.</p></div>
      ${apoyoBIC()}
      <section class="card legal"><p>Un BIC no se puede alterar sin control de Patrimonio: protege su trazado, su arbolado, sus elementos históricos y su entorno, junto a la Muralla romana. Es la garantía de que el gran pulmón verde de Lugo llegue intacto a las próximas generaciones.</p><p>Aquí reunimos la auditoría del parque y los documentos que lo justifican.</p></section>
      <section class="card legal"><h3>Por qué el parque merece ser BIC</h3><p><strong>Un jardín centenario.</strong> Nació por acuerdo del Ayuntamiento el 2 de julio de 1921 y en 2021 cumplió cien años. Es uno de los jardines públicos históricos de Lugo que siguen en pie.</p><p><strong>Un jardín histórico de autor.</strong> Lo proyectó en 1921 el arquitecto municipal Ramiro Sainz, con la jardinería del ingeniero agrónomo Eguileor. Une el trazado natural del jardín paisajista inglés con la geometría de los jardines italianos y franceses. La Ley 5/2016 reconoce expresamente el «jardín histórico» como una de las categorías de BIC.</p><p><strong>Su arquitectura de los años 20 y 30.</strong> Conserva piezas de aquella época: la entrada de la Plaza de Avilés (1923-1927), el estanque con su puente y la casita de los patos, la pérgola (1927-1929), el quiosco de la música (1928), el mapa de la Península Ibérica (1929) y la balaustrada Art Decó del Balcón do Garañón de Eloy Maquieira (1929-1931).</p><p><strong>Un balcón sobre el Miño, junto a la Muralla.</strong> Está al lado de la Muralla romana, Patrimonio de la Humanidad, y se asoma al valle del Miño. Parque, Muralla y río forman un mismo paisaje que hay que proteger entero.</p><p><strong>La memoria de la ciudad.</strong> Se creó como «pulmón de la ciudad», para que los niños jugasen al aire libre y los mayores tuviesen un lugar de descanso. Lleva el nombre de Rosalía de Castro desde el 21 de abril de 1931 y generaciones de lucenses han crecido en él.</p><p><strong>La protección actual no basta.</strong> Hoy solo figura como elemento protegido en el catálogo del plan urbanístico de Lugo (ficha L-26). Como BIC, cualquier obra necesitaría el visto bueno de Patrimonio de la Xunta y no dependería solo de cada gobierno municipal.</p></section>

      <section class="card legal">

        <p><strong>2. Qué datos usamos:</strong> los que tú nos das: nombre y apellidos, dirección, teléfono, correo, el pago de la cuota, los cursos a los que te apuntas, tus mensajes al buzón, tus anuncios del Mercadiño, tus votos en las encuestas, tu apoyo a la declaración BIC y los avisos del barrio que envíes, con su foto y su ubicación. El DNI solo lo pedimos cuando hace falta, por ejemplo para reservar lotería. Las fotos en las que aparezcas solo se publican si nos das permiso. Te pedimos que no incluyas en los mensajes datos de salud, ideología o religión.</p>

        <p><strong>6. Entre vecinos, discreción:</strong> lo que veas de otros socios en la app (nombres, teléfonos, anuncios, fotos) es para usarlo dentro de la asociación. Te pedimos que no lo copies, no lo reenvíes ni lo subas a redes sociales. Si alguien no lo respeta, la directiva puede retirarle el acceso.</p>
        <p><strong>7. Tu código de acceso:</strong> es solo tuyo y funciona en un único móvil. Guárdalo bien y, si crees que otra persona lo está usando, avísanos y te daremos uno nuevo.</p>

      </section>${box}${admin}`;

const BEST = {nueva:["Nuevo","p-red"], leida:["Leído","p-amber"], respondida:["Respondido","p-green"]};
function bzCard(m, admin, uid){
  const st = BEST[m.estado]||BEST.nueva;
  const who = admin ? `<span>De: ${esc(S.names[uid]||"Socio")}${m.contacto?" · "+esc(m.contacto):""}</span>` : "";
  const when = m.at ? new Date(m.at).toLocaleDateString("es-ES",{day:"numeric",month:"long",year:"numeric"}) : "";
  let foot = m.respuesta ? `<div class="notice"><strong>Respuesta de la directiva:</strong> <span class="body">${esc(m.respuesta)}</span></div>` : "";
  if(admin) foot += `<div class="row-actions">${m.estado==="nueva"||!m.estado?`<button class="btn ghost small" data-bz-read="${esc(uid)}|${esc(m.id)}">Marcar leído</button>`:""}<button class="btn ghost small" data-bz-reply="${esc(uid)}|${esc(m.id)}">${m.respuesta?"Cambiar respuesta":"Responder"}</button></div>`;
  return `<article class="card"><div class="meta"><span class="pill ${m.tipo==="Sugerencia"?"p-blue":"p-red"}">${esc(m.tipo||"Mensaje")}</span><span class="pill ${st[1]}">${st[0]}</span><span>${when}</span>${who}</div><p class="body">${esc(m.texto)}</p>${foot}</article>`;
}
function buzonAdmin(){
  const all=[]; for(const d of S.buzonAll) for(const m of (d.msgs||[])) all.push([d.uid,m]);
  all.sort((a,b)=>(b[1].at||"").localeCompare(a[1].at||""));
  const nuevos = all.filter(([,m])=>!m.estado||m.estado==="nueva").length;
  return `<div class="notice">Vista de la directiva: ${all.length} mensaje${all.length===1?"":"s"}, ${nuevos} sin leer.</div>
    <section class="stack">${all.length?all.map(([u,m])=>bzCard(m,true,u)).join(""):`<div class="empty"><strong>El buzón está vacío.</strong>Los mensajes que envíen los socios aparecerán aquí.</div>`}</section>`;
}
function cartelCard(it){
  const pdf = it.photoType==="application/pdf";
  const src = it.photo ? imgSrc(it.photo) : "";
  const media = !it.photo ? `<div class="ph">Sin cartel</div>` : pdf ? `<a class="ph" href="${src}" target="_blank" rel="noopener">Abrir cartel (PDF)</a>` : `<a href="${src}" target="_blank" rel="noopener"><img src="${src}" alt="Cartel: ${esc(it.title)}" loading="lazy"></a>`;
  return `<figure class="photo" style="margin:0">${media}<figcaption class="cap"><strong>${esc(it.title)}</strong><span class="meta">${it.date?fmtDate(it.date):""}</span>${adminRow(it)}</figcaption></figure>`;
}

let MAPA=null, MAPA_EL=null, MAPA_CAPA=null, MAPA_MIO=null;
function cargarLeaflet(){
  if(window.L) return Promise.resolve();
  if(cargarLeaflet.p) return cargarLeaflet.p;
  const css=document.createElement("link"); css.rel="stylesheet"; css.href="vendor/leaflet/leaflet.css"; document.head.appendChild(css);
  return cargarLeaflet.p=new Promise((ok,ko)=>{ const sc=document.createElement("script"); sc.src="vendor/leaflet/leaflet.js"; sc.onload=ok; sc.onerror=ko; document.head.appendChild(sc); });
}
async function montarMapa(){
  const slot=document.getElementById("mapa-slot"); if(!slot) return;
  if(!MAPA_EL){ MAPA_EL=document.createElement("div"); MAPA_EL.id="mapa"; }
  slot.appendChild(MAPA_EL);
  try{ await cargarLeaflet(); }catch(e){ MAPA_EL.textContent="No se ha podido cargar el mapa."; return; }
  if(!MAPA){
    MAPA=L.map(MAPA_EL).setView([43.0072,-7.5615],16);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19, attribution:"© OpenStreetMap"}).addTo(MAPA);
    MAPA_CAPA=L.layerGroup().addTo(MAPA);
    MAPA.on("click",ev=>{ if(!S.uid) return; marcarMio(ev.latlng.lat, ev.latlng.lng); });
  }
  setTimeout(()=>MAPA.invalidateSize(),50);
  MAPA_CAPA.clearLayers();
  for(const d of S.incAll) for(const a of (d.avisos||[])) if(a.lat!=null){
    const st=IESTADOS[a.estado]||IESTADOS.pendiente;
    L.circleMarker([a.lat,a.lng],{radius:9, weight:2, color:"#fff", fillOpacity:.95, fillColor:a.estado==="arreglado"?"#3e7d5a":a.estado==="comunicado"?"#b86a12":"#b3261e"})
      .bindPopup(`<strong>${esc(a.tipo)}</strong><br>${esc(st[0])}${a.texto?"<br>"+esc(a.texto):""}`).addTo(MAPA_CAPA);
  }
  if(S.incPos) marcarMio(S.incPos.lat, S.incPos.lng, true);
}
function marcarMio(lat,lng,silencio){
  S.incPos={lat:+lat.toFixed(6), lng:+lng.toFixed(6)};
  if(!MAPA) return;
  if(MAPA_MIO) MAPA_MIO.setLatLng([lat,lng]); else MAPA_MIO=L.marker([lat,lng]).addTo(MAPA);
  const m=document.getElementById("inc-pos"); if(m && !silencio) m.textContent="Ubicación marcada en el mapa.";
}

    const err=$("#f-err"); err.hidden=true;
    const val=id=>{const el=$("#"+id);return el?el.value.trim():undefined};
    const data = {section, title:val("f-title"), date:val("f-date")||"", updatedAt:new Date().toISOString()};
    for(const [k,id] of [["body","f-body"],["kind","f-kind"],["time","f-time"],["place","f-place"],["entity","f-entity"],["status","f-status"],["album","f-album"],["plazas","f-plazas"],["regDate","f-regdate"],["regNum","f-regnum"]]){ const x=val(id); if(x!==undefined) data[k]=x; }
    if(!data.title && section==="fotos") data.title = data.album || "Foto";
    if(section==="encuestas"){ data.opciones=(val("f-opciones")||"").split("\n").map(x=>x.trim()).filter(Boolean); data.cierre=val("f-cierre")||"";
      if(data.opciones.length<2){ err.textContent="Escribe al menos dos opciones, una en cada línea."; err.hidden=false; return; } }
    if(!data.title){ err.textContent="Escribe un título."; err.hidden=false; return; }
    const files = section==="fotos" && !it ? elegidas.slice() : ($("#f-photo") ? [...$("#f-photo").files] : []);
    if(section==="fotos" && !it && files.length>1){
      const btn=$("#f-save"); btn.disabled=true;
      let hechas=0, fallos=0;
      for(const fl of files){
        btn.textContent=`Subiendo ${hechas+fallos+1} de ${files.length}…`;
        try{
          if(fl.size>20*1024*1024) throw {code:"too_large"};
          const up = await S.assets.upload(await prepararFoto(fl));
          const t = new Date().toISOString();
          await S.db.collection("items").doc().set({...data, photo:up.id, photoType:up.contentType||fl.type, createdAt:t, updatedAt:t});
          hechas++;
        }catch(x){ fallos++; }
      }
      if(!fallos) return closeSheet();
      err.textContent=`Se han subido ${hechas} de ${files.length} fotos. ${fallos} no se ${fallos===1?"ha":"han"} podido subir (puede que pesen más de 20 MB). Vuelve a intentarlo con esas.`; err.hidden=false;
      btn.disabled=false; btn.textContent="Publicar"; return;
    }
    const file = files[0];
    if(isFoto && !file && !v.photo){ err.textContent=isCartel?"Elige el cartel para subir.":"Elige una foto para subir."; err.hidden=false; return; }
    const btn=$("#f-save"); btn.disabled=true; btn.textContent="Guardando…";
    try{
      if(file){
        if(file.size>20*1024*1024) throw {code:"too_large"};
        const up = await S.assets.upload(section==="fotos" ? await prepararFoto(file) : file);
        data.photo = up.id; data.photoType = up.contentType || file.type;
      } else if(v.photo){ data.photo = v.photo; if(v.photoType) data.photoType = v.photoType; }
      const doc = $("#f-doc") && $("#f-doc").files[0];
      if(doc){
        if(doc.type && !/pdf|octet-stream/i.test(doc.type) && !/\.pdf$/i.test(doc.name||"")) throw {code:"bad_type"};
        if(doc.size>20*1024*1024) throw {code:"too_large"};
        const upd = await S.assets.upload(doc, {type:"application/pdf"});
        data.doc = upd.id; data.docName = doc.name.slice(0,120);
      } else if(v.doc){ data.doc = v.doc; if(v.docName) data.docName = v.docName; }
      if(it && it.cuando && !data.date) data.cuando = it.cuando;
      const ref = it ? S.db.collection("items").doc(it.id) : S.db.collection("items").doc();
      if(!it) data.createdAt = data.updatedAt;
      else data.createdAt = v.createdAt || data.updatedAt;
      await ref.set(data);
      closeSheet();
    }catch(x){
      const msg = {too_large:"El archivo pesa más de 20 MB. Prueba con uno más pequeño.", bad_type:"El documento tiene que ser un PDF. En Word: Archivo > Guardar como > PDF.", unsupported_type:"Ese formato de imagen no se admite. Usa JPG, PNG o WEBP.", invalid_argument:"No tienes permiso para publicar. Pide a la directiva acceso de edición.", quota_exceeded:"Se ha llenado el espacio de la app. Borra publicaciones antiguas.", quota_or_state:"Se ha llenado el espacio para fotos. Borra fotos antiguas.", rate_limited:"Demasiados intentos seguidos. Espera un momento y vuelve a probar.", unreadable:"El móvil no deja leer ese archivo. Descárgalo primero al móvil (en Gmail, pulsa la flecha de descargar) y elígelo desde Descargas.", network:"Se ha cortado la conexión al subir el archivo. Comprueba que tienes internet (mejor con wifi) y vuelve a pulsar Publicar."}[x&&x.code] || ("No se ha podido guardar. Vuelve a intentarlo." + ((x&&(x.message||x.code))?" (Detalle: "+String(x.message||x.code).slice(0,160)+")":""));
      err.textContent=msg; err.hidden=false; btn.disabled=false; btn.textContent=it?"Guardar cambios":"Publicar";
    }
  });
}

function askDelete(id){
  const it=S.items.find(i=>i.id===id); if(!it) return;
  $("#sheet-root").innerHTML = `<div class="sheet-bg" id="sheet-bg"><div class="sheet" role="dialog" aria-label="Borrar publicación">
    <h2>¿Borrar “${esc(it.title)}”?</h2><p class="body">Desaparecerá de la app para todos los socios. No se puede deshacer.</p>
    <p class="err" id="d-err" hidden></p>
    <div class="row-actions"><button class="btn ghost" id="d-no">Cancelar</button><button class="btn danger" id="d-yes">Borrar</button></div></div></div>`;
  $("#d-no").onclick=closeSheet;
  $("#d-yes").onclick=async()=>{
    try{
      if(SEMILLAS.some(s=>s.id===id)) await S.db.collection("items").doc(id).set({section:"_borrado", updatedAt:new Date().toISOString()});
      else await S.db.collection("items").doc(id).delete();
      if(it.photo && S.assets){ try{ await S.assets.delete(it.photo) }catch(e){} }
      if(it.doc && S.assets){ try{ await S.assets.delete(it.doc) }catch(e){} }
      closeSheet();
    }catch(e){ const er=$("#d-err"); er.textContent="No se ha podido borrar. Vuelve a intentarlo."; er.hidden=false; }
  };
}

// Carpetas donde también pueden subir fotos los socios
const SOC_ALBS=["Foto temática libre socios","Fotos denuncia"];

/* ---------- fotos compartidas desde WhatsApp o la galería (botón Compartir del móvil) ---------- */
async function recibirCompartidas(){
  const files=[];
  try{
    const c=await caches.open("recatelo-compartido");
    for(const k of await c.keys()){ const r=await c.match(k); if(r){ const b=await r.blob(); files.push(new File([b], decodeURIComponent(r.headers.get("x-nombre")||"foto.jpg"), {type:b.type||"image/jpeg"})); } await c.delete(k); }
  }catch(e){}
  if(!files.length || !S.uid) return;
  if(S.canEdit){
    S.assets = S.assets || await claude.use("assets");
    go("fotos"); S.compartidas=files; openForm("fotos");
  }else{
    S.filter.fotos="Foto temática libre socios"; S.fsElegidas=files; go("fotos");
  }
}

/* ---------- arranque ---------- */
(function init(){
  // Siempre se abre en Inicio; solo una notificación (?n=1#pestaña) abre otra pestaña
  const h=(location.hash||"").slice(1), desdeAviso=/[?&]n=1/.test(location.search), compartidas=/[?&]compartir=1/.test(location.search);
  S.tab = desdeAviso && TABS.some(t=>t.id===h) ? h : "inicio";
  try{ history.replaceState(null,"",location.pathname+"#"+S.tab) }catch(e){}
  renderTabs(); render(); paintLogo();
  if(!window.claude || !window.claude.use){ S.noDb=true; render(); return; }
  const userP = claude.use("user").then(async u=>{ S.user=u; if(u){ try{ S.canEdit = !!(await u.canEdit()); }catch(e){} try{ S.uid = await u.id(); }catch(e){} render(); } });
  claude.use("assets").then(a=>{ S.assets=a; });
  claude.use("db").then(db=>{
    if(!db){ S.noDb=true; render(); return; }
    S.db=db;
    db.collection("items").onSnapshot(snap=>{
      const rows = snap.docs.map(d=>({id:d.id, ...d.data()}));
      S.items = [...rows, ...SEMILLAS.filter(s=>!rows.some(r=>r.id===s.id))].filter(i=>i.section!=="_borrado");
      S.loaded = true; render();
    }, ()=>{ S.loaded=true; render(); });
    db.doc("config/ajustes").onSnapshot(snap=>{ S.logo = snap.exists ? (snap.data().logo||DEFAULT_LOGO) : DEFAULT_LOGO; S.estatutos = snap.exists ? (snap.data().estatutos||null) : null; paintLogo(); render(); },()=>{});
    db.collection("mercadillo").onSnapshot(snap=>{ S.mercAll=snap.docs.map(d=>({uid:d.id,...d.data()})); render(); },()=>{});
    db.collection("fotosocios").onSnapshot(snap=>{ S.fotoSoc=snap.docs.map(d=>({uid:d.id,...d.data()})); render(); },()=>{});
    if(compartidas && window.caches) userP.then(recibirCompartidas);
    startInc(); userP.then(startApoyos); userP.then(startVotos); userP.then(startCuotas);
    userP.then(startBuzon); userP.then(startLot); userP.then(startInsc); userP.then(startFicha); userP.then(startConsent);
  });
})();
</script>
